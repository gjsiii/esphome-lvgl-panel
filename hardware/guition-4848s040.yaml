# Hardware package: Guition ESP32-S3-4848S040 (480x480 ST7701S RGB + GT911 touch)
# https://devices.esphome.io/devices/Guition-ESP32-S3-4848S040/
#
# Provides: my_display, my_touchscreen, display_backlight, relays.
# Other packages may add triggers to my_touchscreen (merged by id).
#
# Every hardware package sets these for the shared files:
#   px                 UI scale: sizes in the shared files are written for a
#                      480x480 screen and multiplied by px (480 -> 1, 720 -> 1.5)
#   lvgl_buffer_size   LVGL draw buffer (share of the screen)

substitutions:
  px: 1
  lvgl_buffer_size: 25%

esp32:
  variant: esp32s3
  # ESP32-S3 N16R8: use the full 16 MB (default layout is 4 MB with a 1.75 MB
  # app slot). Changing this needs one USB flash per panel; OTA can't change
  # the partition layout.
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      # Keep internal RAM free: the 8 MB PSRAM is mostly idle, while the
      # internal heap's largest free block was dropping to ~13 KB. Put Wi-Fi /
      # network buffers in PSRAM, and send allocations above 4 KB (default
      # 16 KB) there too. DMA buffers still go to internal RAM.
      CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP: y
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "4096"

psram:
  mode: octal
  speed: 80MHz

output:
  - platform: ledc
    id: backlight_output
    pin: GPIO38
    frequency: 150Hz
    min_power: 0.01
    zero_means_zero: true

light:
  - platform: monochromatic
    name: Backlight
    id: display_backlight
    # A config entity, so Assist doesn't count it as one of the room's
    # lights ("turn off the kitchen lights" would blank the screen)
    entity_category: config
    output: backlight_output
    restore_mode: ALWAYS_ON
    default_transition_length: 1s

spi:
  - id: lcd_spi
    clk_pin: GPIO48
    mosi_pin: GPIO47

i2c:
  id: touchscreen_bus
  sda: GPIO19
  scl:
    number: 45
    ignore_strapping_warning: true

switch:
  - platform: gpio
    name: Relay 1
    pin:
      number: GPIO40
      inverted: true
  - platform: gpio
    name: Relay 2
    pin:
      number: GPIO2
      inverted: true
  - platform: gpio
    name: Relay 3
    pin:
      number: GPIO1
      inverted: true

display:
  - platform: st7701s
    id: my_display
    dimensions:
      width: 480
      height: 480
    # rotation: 270    #uncomment for placement with down-facing USB socket
    spi_mode: MODE3
    data_rate: 2MHz
    color_order: RGB
    invert_colors: False
    cs_pin: 39
    de_pin: 18
    hsync_pin: 16
    vsync_pin: 17
    pclk_pin: 21
    pclk_frequency: 12MHz
    pclk_inverted: False
    hsync_pulse_width: 8
    hsync_front_porch: 10
    hsync_back_porch: 20
    vsync_pulse_width: 8
    vsync_front_porch: 10
    vsync_back_porch: 10
    update_interval: never
    auto_clear_enabled: False
    init_sequence:
      - 1
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x10] # CMD2_BKSEL_BK0
      - [0xCD, 0x00] # disable MDT flag
    data_pins:
      red: [11, 12, 13, 14, 0]
      green: [8, 20, 3, 46, 9, 10]
      blue: [4, 5, 6, 7, 15]

touchscreen:
  - platform: gt911
    id: my_touchscreen
    display: my_display
    transform:
      swap_xy: false
      mirror_x: false
      mirror_y: false
