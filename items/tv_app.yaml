# Item: one app button on the TV tab's Apps sheet: a large round
# remote-style button with the app's logo, four per row. Tapping it opens the
# app on the Apple TV (media_player.select_source) and closes the sheet.
#
# Include once per app; `slot` sets the order (1 = top left) and must be
# unique. Twelve fit on the sheet; more scroll. Leave out all app items and
# the TV tab shows no Apps button.
#   app_1: !include
#     file: panel/items/tv_app.yaml
#     vars:
#       slot: 1
#       icon: ../www/tv_app_icons/netflix.svg   # white logo, relative to the device file
#       source: "Netflix"                       # Apple TV source name, exactly as in HA
#       entity: media_player.family_room_apple_tv
#
# App logos are trademarks, so they aren't in this repo: keep them with the
# house's own files (e.g. /config/www/tv_app_icons/). PNG, JPG or SVG work;
# a white logo on a transparent background matches the remote. The
# Custom Brand Icons set (Iconify prefix "cbi") has most streaming apps.
# The image is compiled into the firmware.

esphome:
  on_boot:
    - priority: -20${slot}
      then:
        - lambda: "lv_obj_set_parent(id(tv_app_${slot}), id(tv_apps));"

image:
  - platform: file
    id: tv_app_icon_${slot}
    file: ${icon}
    type: RGB565
    transparency: alpha_channel
    resize: "${(64*px)|int}x${(64*px)|int}"

lvgl:
  pages:
    - id: holding_tv_app_${slot}
      skip: true
      widgets:
        - button:
            id: tv_app_${slot}
            width: ${104*px}
            height: ${104*px}
            styles: round_btn
            widgets:
              - image:
                  src: tv_app_icon_${slot}
                  align: CENTER
            on_click:
              - lvgl.widget.hide: tv_apps_panel
              - homeassistant.action:
                  action: media_player.select_source
                  data:
                    entity_id: ${entity}
                    source: "${source}"
