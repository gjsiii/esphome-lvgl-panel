# Item: one app tile on the TV tab's Apps sheet: the app's logo and name on a
# rounded tile in its brand colour. Tapping it opens the app on the Apple TV
# (media_player.select_source) and closes the sheet.
#
# Include once per app; `slot` sets the order (1 = top left, three per row)
# and must be unique. Leave out all app items and the TV tab shows no Apps
# button.
#   app_1: !include
#     file: panel/items/tv_app.yaml
#     vars:
#       slot: 1
#       icon: ../www/tv_app_icons/netflix.svg   # white logo, relative to the device file
#       source: "Netflix"                       # Apple TV source name, exactly as in HA
#       entity: media_player.family_room_apple_tv
#       color: "0xE50914"                       # optional tile colour (default dark grey)
#       name: "Netflix"                         # optional label (default: source)
#
# App logos are trademarks, so they aren't in this repo: keep them with the
# house's own files (e.g. /config/www/tv_app_icons/). PNG, JPG or SVG work;
# a white logo on a transparent background suits the coloured tile. The image
# is compiled into the firmware.

defaults:
  color: "0x2C2C2E"
  name: ${source}

esphome:
  on_boot:
    - priority: -20${slot}
      then:
        - lambda: "lv_obj_set_parent(id(tv_app_${slot}), id(tv_apps));"

image:
  - platform: file
    id: tv_app_icon_${slot}
    file: ${icon}
    type: RGB565
    transparency: alpha_channel
    resize: "${(56*px)|int}x${(56*px)|int}"

lvgl:
  pages:
    - id: holding_tv_app_${slot}
      skip: true
      widgets:
        - button:
            id: tv_app_${slot}
            width: ${136*px}
            height: ${112*px}
            bg_color: ${color}
            bg_opa: COVER
            radius: ${18*px}
            pad_all: 0
            pressed:
              bg_opa: 70%
            widgets:
              - image:
                  src: tv_app_icon_${slot}
                  align: TOP_MID
                  y: ${14*px}
              - label:
                  text: "${name}"
                  text_color: 0xFFFFFF
                  long_mode: DOT
                  width: ${124*px}
                  text_align: CENTER
                  align: BOTTOM_MID
                  y: -${10*px}
            on_click:
              - lvgl.widget.hide: tv_apps_panel
              - homeassistant.action:
                  action: media_player.select_source
                  data:
                    entity_id: ${entity}
                    source: "${source}"
