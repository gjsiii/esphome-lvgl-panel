# Item: one shade, blind or curtain slider on the Lights tab (same look as a
# light slider; the fill is how far open it is).
#
# Include once per cover; `slot` shares the light slots (order in the list)
# and must not repeat a light's or fan's slot.
#   shade_6: !include { file: panel/items/cover.yaml, vars: { slot: 6, name: "Window Shade", entity: cover.bedroom_shade } }
#
# Tap the name to open/close (or stop, while moving); drag elsewhere to set
# the position, sent once when the finger lifts. Covers without position
# support: drag all the way right to open, all the way left to close.

esphome:
  on_boot:
    - priority: -20${slot}
      then:
        - lambda: "lv_obj_set_parent(id(light_row_${slot}), id(lights_list));"

sensor:
  - platform: homeassistant
    id: cover_position_${slot}
    entity_id: ${entity}
    attribute: current_position
    on_value:
      - if:
          condition:
            lambda: "return !isnan(x);"
          then:
            - lambda: "id(slider_ha_update) = true;"
            - lvgl.slider.update:
                id: light_slider_${slot}
                value: !lambda "return (int)x;"
            - lambda: "id(slider_ha_update) = false;"
            - script.execute: cover_label_${slot}

text_sensor:
  # open / closed / opening / closing
  - platform: homeassistant
    id: cover_state_${slot}
    entity_id: ${entity}
    on_value:
      - lambda: |-
          // No position attribute: show fully open or closed
          if (isnan(id(cover_position_${slot}).state) && (x == "open" || x == "closed")) {
            id(slider_ha_update) = true;
            lv_slider_set_value(id(light_slider_${slot}), x == "open" ? 100 : 0, LV_ANIM_OFF);
            id(slider_ha_update) = false;
          }
      - script.execute: cover_label_${slot}

script:
  - id: cover_label_${slot}
    mode: restart
    then:
      - lambda: |-
          const std::string &s = id(cover_state_${slot}).state;
          int v = lv_slider_get_value(id(light_slider_${slot}));
          std::string t;
          if (s == "opening") t = "Opening…";
          else if (s == "closing") t = "Closing…";
          else if (v <= 0) t = "Closed";
          else if (v >= 100) t = "Open";
          else t = std::to_string(v) + "%";
          lv_label_set_text(id(light_pct_${slot}), t.c_str());
      - script.execute: update_slider_labels

lvgl:
  pages:
    - id: holding_cover_${slot}
      skip: true
      widgets:
        - obj:
            id: light_row_${slot}
            width: 440
            height: 56
            styles: transparent
            scrollbar_mode: "off"
            widgets:
              - slider:
                  id: light_slider_${slot}
                  width: 100%
                  height: 100%
                  min_value: 0
                  max_value: 100
                  value: 0
                  on_value:
                    - lvgl.label.update:
                        id: light_pct_${slot}
                        text: !lambda 'return x <= 0 ? std::string("Closed") : x >= 100 ? std::string("Open") : std::to_string((int) x) + "%";'
                    - script.execute: update_slider_labels
                  on_release:
                    - if:
                        condition:
                          lambda: "return !id(slider_ha_update);"
                        then:
                          - if:
                              condition:
                                lambda: "return x <= 0;"
                              then:
                                - homeassistant.action:
                                    action: cover.close_cover
                                    data:
                                      entity_id: ${entity}
                              else:
                                - if:
                                    condition:
                                      lambda: "return x >= 100;"
                                    then:
                                      - homeassistant.action:
                                          action: cover.open_cover
                                          data:
                                            entity_id: ${entity}
                                    else:
                                      - homeassistant.action:
                                          action: cover.set_cover_position
                                          data:
                                            entity_id: ${entity}
                                            position: !lambda "return (int)x;"
              - label:
                  text: "${name}"
                  text_color: ${c_text_2}
                  align: LEFT_MID
                  x: 18
              - label:
                  id: light_pct_${slot}
                  text: "Closed"
                  text_color: ${c_text_2}
                  align: RIGHT_MID
                  x: -18
              # Tap the name to open/close, or stop while moving.
              # Last child, so it sits on top of the slider's left end.
              - button:
                  id: light_toggle_${slot}
                  align: LEFT_MID
                  width: 180
                  height: 100%
                  radius: 16
                  bg_opa: TRANSP
                  pad_all: 0
                  pressed:
                    bg_color: ${c_text}
                    bg_opa: 15%
                  on_click:
                    - if:
                        condition:
                          lambda: 'return id(cover_state_${slot}).state == "opening" || id(cover_state_${slot}).state == "closing";'
                        then:
                          - homeassistant.action:
                              action: cover.stop_cover
                              data:
                                entity_id: ${entity}
                        else:
                          - homeassistant.action:
                              action: cover.toggle
                              data:
                                entity_id: ${entity}
