# Item: one dimmable light slider on the Lights tab.
#
# Include once per light; `slot` sets the order (1 = top) and must be unique.
#   light_1: !include { file: panel/items/light.yaml, vars: { slot: 1, name: "Chandelier", entity: light.family_room_chandelier } }
#
# Tap the name to toggle the light; drag anywhere else to set brightness.
# The slider is built on a hidden holding page and moved into `lights_list`
# at boot. HA is updated once, when the finger lifts.

esphome:
  on_boot:
    - priority: -20${slot}
      then:
        - lambda: "lv_obj_set_parent(id(light_row_${slot}), id(lights_list));"

sensor:
  - platform: homeassistant
    id: light_brightness_${slot}
    entity_id: ${entity}
    attribute: brightness
    on_value:
      - if:
          condition:
            lambda: "return id(light_state_${slot}).state;"
          then:
            - lambda: "id(slider_ha_update) = true;"
            - lvgl.slider.update:
                id: light_slider_${slot}
                value: !lambda "return (int)x;"
            - lvgl.label.update:
                id: light_pct_${slot}
                text: !lambda 'return std::to_string((int) lroundf(x * 100.0f / 255.0f)) + "%";'
            - lambda: "id(slider_ha_update) = false;"
            - script.execute: update_slider_labels

binary_sensor:
  - platform: homeassistant
    id: light_state_${slot}
    entity_id: ${entity}
    on_state:
      - if:
          condition:
            lambda: "return !x;"
          then:
            - lambda: "id(slider_ha_update) = true;"
            - lvgl.slider.update:
                id: light_slider_${slot}
                value: 0
            - lvgl.label.update:
                id: light_pct_${slot}
                text: "0%"
            - lambda: "id(slider_ha_update) = false;"
            - script.execute: update_slider_labels

lvgl:
  pages:
    - id: holding_light_${slot}
      skip: true
      widgets:
        # iOS Control Center-style slider; the name/% labels sit on top but
        # are not clickable, so touches pass through to the slider.
        - obj:
            id: light_row_${slot}
            width: 440
            height: 56
            styles: transparent
            scrollbar_mode: "off"
            widgets:
              - slider:
                  id: light_slider_${slot}
                  width: 100%
                  height: 100%
                  min_value: 0
                  max_value: 255
                  value: 0
                  on_value:
                    - lvgl.label.update:
                        id: light_pct_${slot}
                        text: !lambda 'return std::to_string((int) lroundf(x * 100.0f / 255.0f)) + "%";'
                    - script.execute: update_slider_labels
                  on_release:
                    - if:
                        condition:
                          lambda: "return !id(slider_ha_update);"
                        then:
                          - homeassistant.action:
                              action: light.turn_on
                              data:
                                entity_id: ${entity}
                                brightness: !lambda "return (int)x;"
              - label:
                  text: "${name}"
                  text_color: ${c_text_2}
                  align: LEFT_MID
                  x: 18
              - label:
                  id: light_pct_${slot}
                  text: "0%"
                  text_color: ${c_text_2}
                  align: RIGHT_MID
                  x: -18
              # Tap the name to toggle the light on/off (drag elsewhere to dim).
              # Last child, so it sits on top of the slider's left end.
              - button:
                  id: light_toggle_${slot}
                  align: LEFT_MID
                  width: 180
                  height: 100%
                  radius: 16
                  bg_opa: TRANSP
                  pad_all: 0
                  pressed:
                    bg_color: ${c_text}
                    bg_opa: 15%
                  on_click:
                    - homeassistant.action:
                        action: light.toggle
                        data:
                          entity_id: ${entity}
