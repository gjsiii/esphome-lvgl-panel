# Example display file — copy into your Home Assistant's /config/esphome/,
# rename it to match the device name, and edit everything marked ◀.
# Delete any feature, tab or item you don't want; all are optional except
# the hardware and core files.
#
# Full guide: docs/getting-started.md · every option: docs/display-file.md
#
# After adopting the display in Home Assistant, open the ESPHome integration's
# options for it and turn on "Allow the device to perform Home Assistant
# actions" — otherwise its buttons do nothing.

substitutions:
  # ── Connection (put the values in secrets.yaml) ──────────────────────────
  api_key: !secret living_room_panel_api_key          # ◀ 32-byte base64 key
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  ap_password: !secret living_room_panel_ap_password  # ◀ fallback hotspot, 8+ chars
  # ota_password: !secret living_room_panel_ota_password   # optional

  # ── Site ─────────────────────────────────────────────────────────────────
  ha_url: "http://homeassistant.local:8123"           # ◀ your HA address (for artwork)

  # Optional first-boot defaults (changeable later on the panel or in HA):
  # default_dim_after: "30 s"      # 15 s, 30 s, 1 min, 2 min, Never
  # default_off_after: "5 min"     # 1 min, 5 min, 10 min, 30 min, Never
  # default_sleep_screen: "Blank"  # Blank, Clock, Red clock

esphome:
  name: esp-living-room-panel                         # ◀ lowercase, digits, hyphens
  friendly_name: Living Room Panel                    # ◀

packages:
  panel:
    url: https://github.com/gjsiii/esphome-lvgl-panel
    ref: v0.3.0                                       # ◀ release to build from
    refresh: 1d
    files:
      # ── Board + core (always) ──────────────────────────────────────────
      - hardware/guition-4848s040.yaml
      - core/core.yaml

      # ── Status bar ─────────────────────────────────────────────────────
      - path: features/weather.yaml                   # needs ha/panel_weather.yaml in HA
        vars:
          weather_entity: weather.home
          forecast_entity: sensor.panel_weather_forecast
          # outdoor_temp_entity: sensor.backyard_temperature   # optional local thermometer
      - path: features/climate.yaml
        vars: { climate_entity: climate.living_room, climate_name: "Living Room" }   # ◀
      - path: features/status_chip.yaml               # one per status icon
        vars:
          chip_id: garage
          slot: 1                                     # 1 = rightmost
          entity: cover.garage_door                   # ◀
          icon: "\U000F06DA"                          # mdi-garage-open
          color: "0xFF9F0A"
          show_when: "open,opening"
          show_value: "false"

      # ── Wake-ups ───────────────────────────────────────────────────────
      - path: features/presence_wake.yaml
        vars: { presence_entity: binary_sensor.living_room_occupancy }   # ◀
      - path: features/camera_popup.yaml              # one per trigger
        vars:
          popup_id: doorbell
          title: "Doorbell"
          trigger_entity: binary_sensor.front_doorbell_visitor   # ◀
          camera_entity: camera.front_doorbell                   # ◀

      # ── Lights tab: scene chips (omit all for no SCENES row) ───────────
      - path: items/scene.yaml
        vars: { slot: 1, name: "Evening", entity: scene.living_room_evening }   # ◀
      - path: items/action_chip.yaml                  # any HA action
        vars: { slot: 2, name: "Off", action: light.turn_off, entity: "light.living_room_ceiling, light.living_room_lamp" }   # ◀

      # ── Lights tab: lights and fans (slots shared, 1 = top) ────────────
      - path: items/light.yaml
        vars: { slot: 1, name: "Ceiling", entity: light.living_room_ceiling }   # ◀
      - path: items/light.yaml
        vars: { slot: 2, name: "Lamp", entity: light.living_room_lamp }         # ◀
      - path: items/fan.yaml
        vars: { slot: 3, name: "Fan", entity: fan.living_room_fan }             # ◀

      # ── TV tab (Apple TV) ──────────────────────────────────────────────
      - path: tabs/tv_appletv.yaml
        vars:
          tab_position: 2
          tv_remote: remote.living_room_apple_tv              # ◀
          tv_player: media_player.living_room_apple_tv        # ◀
          tv_volume_player: media_player.living_room_speaker  # ◀ what − / + control
          tv_mute_player: media_player.living_room_speaker    # ◀ what mute controls
      - path: items/tv_app.yaml                       # optional app buttons
        vars:
          slot: 1
          icon: ../www/tv_app_icons/netflix.svg       # ◀ your own white logo
          source: "Netflix"                           # ◀ exactly as in the Apple TV source list
          entity: media_player.living_room_apple_tv   # ◀

      # ── Music tab + "Play on" speakers ─────────────────────────────────
      - path: tabs/music.yaml
        vars:
          tab_position: 3
          music_player: media_player.living_room_speaker      # ◀ Music Assistant player works best
      - path: items/speaker.yaml
        vars: { slot: 1, name: "Kitchen", entity: media_player.kitchen_speaker, leader: media_player.living_room_speaker }   # ◀

      # ── Favorites tab ──────────────────────────────────────────────────
      - path: tabs/favorites.yaml
        vars: { tab_position: 4 }
      - path: items/favorite.yaml                     # one per tile
        vars:
          slot: 1
          name: "Morning Jazz"                                                     # ◀
          image: ../www/playlist_icons/morning_jazz.png                            # ◀ square image
          media_content_id: "https://open.spotify.com/playlist/37i9dQZF1DXbITWG1ZJKYt"  # ◀
          player: media_player.living_room_speaker                                 # ◀
          shuffle: "true"
