# Core: screen layout — status bar, tab bar, Lights tab shell, settings sheet.
#
# Tabs other than Lights come from tab packages (panel/tabs/*.yaml), which add
# themselves to main_tabview at boot. Light sliders and scene chips come from
# item packages (panel/items/*.yaml), which move into the containers below.

lvgl:
  displays:
    - my_display
  touchscreens:
    - my_touchscreen
  buffer_size: ${lvgl_buffer_size}   # set by the hardware package

  pages:
    - id: main_page
      widgets:
        # Full-screen background (sheets from packages are moved in here)
        - obj:
            id: ui_root
            width: 100%
            height: 100%
            styles: container
            scrollbar_mode: "off"

            widgets:
              # ── Status Bar ────────────────────────────────────────
              - obj:
                  width: 100%
                  height: ${36*px}
                  align: TOP_MID
                  styles: transparent
                  scrollbar_mode: "off"
                  widgets:
                    # Weather (upper left): hidden unless the weather
                    # package is included and HA has reported a value.
                    # Tapping it opens the weather sheet.
                    - button:
                        id: btn_weather_open
                        align: LEFT_MID
                        x: ${4*px}
                        width: ${84*px}
                        height: ${34*px}
                        bg_opa: TRANSP
                        radius: ${10*px}
                        pad_all: 0
                        pressed:
                          bg_color: ${c_surface}
                          bg_opa: COVER
                        hidden: true
                        widgets:
                          - label:
                              id: lbl_weather_icon
                              text: "\U000F0595" # mdi-weather-partly-cloudy
                              text_font: icons_sm
                              text_color: ${c_text}
                              align: LEFT_MID
                              x: ${10*px}
                          - label:
                              id: lbl_weather_temp
                              text: "--°"
                              text_font: font_title
                              text_color: ${c_text}
                              align: LEFT_MID
                              x: ${38*px}
                        # Tap handler is attached by the weather package
                    # Indoor climate (features/climate.yaml): hidden unless
                    # included; tapping it opens the climate sheet.
                    - button:
                        id: btn_climate_open
                        align: LEFT_MID
                        x: ${92*px}
                        width: ${78*px}
                        height: ${34*px}
                        bg_opa: TRANSP
                        radius: ${10*px}
                        pad_all: 0
                        pressed:
                          bg_color: ${c_surface}
                          bg_opa: COVER
                        hidden: true
                        widgets:
                          - label:
                              id: lbl_climate_icon
                              text: "\U000F0F54" # mdi-home-thermometer
                              text_font: icons_sm
                              text_color: ${c_text_2}
                              align: LEFT_MID
                              x: ${6*px}
                          - label:
                              id: lbl_climate_temp
                              text: "--°"
                              text_font: font_title
                              align: LEFT_MID
                              x: ${32*px}
                        # Tap handler is attached by the climate package
                    - label:
                        id: lbl_time
                        text: "--:--"
                        text_font: font_time
                        text_color: ${c_text}
                        align: CENTER
                    # Status chips (features/status_chip.yaml), right-aligned
                    # left of the connection icon. Layout is set at boot.
                    - obj:
                        id: status_chips
                        align: RIGHT_MID
                        x: -${82*px}
                        width: ${112*px}
                        height: ${32*px}
                        styles: transparent
                        clickable: false
                        scrollable: false
                        scrollbar_mode: "off"
                    - label:
                        id: lbl_hastatus
                        text: "\U000F05A9" # mdi-wifi
                        text_font: icons_sm
                        text_color: ${c_text_2}
                        align: RIGHT_MID
                        x: -${50*px}
                    - button:
                        id: btn_settings_open
                        align: RIGHT_MID
                        x: -${6*px}
                        width: ${40*px}
                        height: ${34*px}
                        styles: icon_btn
                        widgets:
                          - label:
                              text: "\U000F0493" # mdi-cog
                              text_font: icons_sm
                              text_color: ${c_text_2}
                              align: CENTER
                        on_click:
                          - script.execute: open_settings   # PIN keypad if locked

              # ── Tab View (tab bar at the bottom) ──────────────────
              - tabview:
                  id: main_tabview
                  width: 100%
                  height: ${444*px}
                  align: TOP_MID
                  y: ${36*px}
                  position: BOTTOM
                  size: 12%
                  bg_color: ${c_bg}
                  bg_opa: COVER
                  border_width: 0
                  outline_width: 0
                  pad_all: 0
                  scrollbar_mode: "off"

                  tab_style:
                    bg_color: ${c_bg}
                    bg_opa: COVER
                    border_side: TOP
                    border_width: 1
                    border_color: ${c_separator}
                    pad_top: ${7*px//1}
                    pad_bottom: ${7*px//1}
                    pad_left: ${10*px}
                    pad_right: ${10*px}
                    items:
                      bg_opa: TRANSP
                      border_width: 0
                      outline_width: 0
                      radius: ${12*px}
                      text_color: ${c_text_2}
                      text_font: font_body
                      checked:
                        bg_color: ${c_surface_2}
                        bg_opa: COVER
                        border_width: 0
                        text_color: ${c_text}
                      pressed:
                        bg_color: ${c_surface}
                        bg_opa: COVER

                  tabs:
                    # ── Tab 1: Lights (always present) ────────────
                    - name: "Lights"
                      id: tab_lights
                      pad_all: 0
                      widgets:
                        - obj:
                            width: 100%
                            height: 100%
                            styles: container
                            scrollbar_mode: "off"
                            widgets:
                              - label:
                                  id: lbl_scenes_header
                                  text: "SCENES"
                                  styles: section_header
                                  align: TOP_LEFT
                                  x: ${24*px}
                                  y: ${12*px}

                              # Scene chips (filled by panel/items/scene.yaml).
                              # Chips grow to fill each row: 3 per row.
                              # Flex layout is set at boot (base.yaml): ESPHome
                              # rejects a layout on a container with no widgets.
                              - obj:
                                  id: scene_chips
                                  align: TOP_MID
                                  y: ${34*px}
                                  width: ${440*px}
                                  height: ${106*px}
                                  styles: transparent
                                  scrollbar_mode: "off"

                              - label:
                                  id: lbl_lights_header
                                  text: "${lights_title}"
                                  styles: section_header
                                  align: TOP_LEFT
                                  x: ${24*px}
                                  y: ${154*px}

                              # Light sliders (filled by panel/items/light.yaml).
                              # Three fit; more scroll. Flex layout set at boot.
                              - obj:
                                  id: lights_list
                                  align: TOP_MID
                                  y: ${176*px}
                                  width: ${440*px}
                                  height: ${210*px}
                                  styles: transparent
                                  scrollbar_mode: "off"

              # ── Settings Sheet (scrolls) ────────────────────────────
              # Values live in core/settings.yaml (also editable from HA).
              - obj:
                  id: settings_panel
                  width: 100%
                  height: 100%
                  align: TOP_LEFT
                  styles: container
                  pad_bottom: ${24*px}
                  scrollbar_mode: "off"
                  hidden: true
                  widgets:
                    - label:
                        text: "Settings"
                        text_font: font_title
                        align: TOP_LEFT
                        x: ${20*px}
                        y: ${22*px}
                    - button:
                        id: btn_settings_close
                        align: TOP_RIGHT
                        x: -${10*px}
                        y: ${12*px}
                        width: ${90*px}
                        height: ${44*px}
                        bg_opa: TRANSP
                        radius: ${22*px}
                        pad_all: 0
                        pressed:
                          bg_color: ${c_surface}
                          bg_opa: COVER
                        widgets:
                          - label:
                              text: "Done"
                              text_font: font_title
                              text_color: ${c_accent}
                              align: CENTER
                        on_click:
                          - lvgl.widget.hide: settings_panel

                    # Cleaning mode (touch off for 30 s), next to Done
                    - button:
                        id: btn_clean_screen
                        align: TOP_RIGHT
                        x: -${104*px}
                        y: ${12*px}
                        width: ${44*px}
                        height: ${44*px}
                        styles: icon_btn
                        pressed:
                          bg_color: ${c_surface}
                          bg_opa: COVER
                        widgets:
                          - label:
                              text: "\U000F0AE0" # mdi-spray-bottle
                              text_font: icons_md
                              text_color: ${c_text_2}
                              align: CENTER
                        on_click:
                          - script.execute: cleaning_mode

                    # ── Update notice (core/settings.yaml: update_notice) ──
                    # Hidden until HA reports a newer release; then the
                    # rest of the sheet moves down to make room for it.
                    - obj:
                        id: update_card
                        align: TOP_MID
                        y: ${80*px}
                        width: ${448*px}
                        height: ${74*px}
                        styles: card
                        border_color: 0x30D158
                        border_width: 1
                        clickable: false
                        scrollable: false
                        scrollbar_mode: "off"
                        hidden: true
                        widgets:
                          - label:
                              text: "\U000F06B0" # mdi-update
                              text_font: icons_md
                              text_color: 0x30D158
                              align: LEFT_MID
                              x: ${16*px}
                          - label:
                              id: lbl_update_title
                              text: "Update available"
                              align: TOP_LEFT
                              x: ${58*px}
                              y: ${13*px//1}
                          - label:
                              id: lbl_update_text
                              text: ""
                              text_font: font_caption
                              text_color: ${c_text_2}
                              long_mode: WRAP
                              width: ${374*px}
                              align: TOP_LEFT
                              x: ${58*px}
                              y: ${36*px}

                    # ── Display: brightness ─────────────────────────
                    - label:
                        text: "DISPLAY"
                        styles: section_header
                        align: TOP_LEFT
                        x: ${32*px}
                        y: ${80*px}

                    - obj:
                        align: TOP_MID
                        y: ${102*px}
                        width: ${448*px}
                        height: ${118*px}
                        styles: card
                        clickable: false
                        scrollable: false
                        scrollbar_mode: "off"
                        widgets:
                          - label:
                              text: "Brightness"
                              align: TOP_LEFT
                              x: ${16*px}
                              y: ${14*px}
                          - label:
                              id: lbl_brightness_pct
                              text: "100%"
                              text_color: ${c_text_2}
                              align: TOP_RIGHT
                              x: -${16*px}
                              y: ${14*px}
                          - label:
                              text: "\U000F00DE" # mdi-brightness-5
                              text_font: icons_md
                              text_color: ${c_text_2}
                              align: BOTTOM_LEFT
                              x: ${14*px}
                              y: -${22*px}
                          - slider:
                              id: slider_brightness
                              align: BOTTOM_MID
                              y: -${14*px}
                              width: ${340*px}
                              height: ${44*px}
                              min_value: 10
                              max_value: 100
                              value: 100
                              bg_color: ${c_surface_2}
                              radius: ${14*px}
                              indicator:
                                radius: ${14*px}
                              on_value:
                                - lambda: "id(user_brightness) = x / 100.0f;"
                                - light.turn_on:
                                    id: display_backlight
                                    brightness: !lambda "return x / 100.0f;"
                                    transition_length: 0s
                                - lvgl.label.update:
                                    id: lbl_brightness_pct
                                    text: !lambda |-
                                      char buf[8];
                                      snprintf(buf, sizeof(buf), "%d%%", (int)x);
                                      return std::string(buf);
                          - label:
                              text: "\U000F00E0" # mdi-brightness-7
                              text_font: icons_md
                              text_color: ${c_text_2}
                              align: BOTTOM_RIGHT
                              x: -${14*px}
                              y: -${22*px}

                    # ── Slider color: hue / saturation / brightness ─
                    # Also a "Slider Color" light in HA (color wheel there).
                    - label:
                        text: "SLIDER COLOR"
                        styles: section_header
                        align: TOP_LEFT
                        x: ${32*px}
                        y: ${236*px}
                    - obj:
                        id: accent_preview
                        align: TOP_RIGHT
                        x: -${24*px}
                        y: ${232*px}
                        width: ${20*px}
                        height: ${20*px}
                        radius: ${10*px}
                        bg_color: ${c_accent}
                        bg_opa: COVER
                        border_width: 1
                        border_color: ${c_separator}
                        clickable: false

                    - obj:
                        align: TOP_MID
                        y: ${258*px}
                        width: ${448*px}
                        height: ${222*px}
                        styles: card
                        clickable: false
                        scrollable: false
                        scrollbar_mode: "off"
                        widgets:
                          - label:
                              text: "Hue"
                              align: TOP_LEFT
                              x: ${16*px}
                              y: ${22*px}
                          # Rainbow track (LVGL gradients have 2 stops, so 6 pieces)
                          - obj:
                              align: TOP_LEFT
                              x: ${116*px}
                              y: ${18*px}
                              width: ${316*px}
                              height: ${28*px}
                              radius: ${14*px}
                              clip_corner: true
                              bg_opa: TRANSP
                              border_width: 0
                              pad_all: 0
                              clickable: false
                              scrollable: false
                              scrollbar_mode: "off"
                              widgets:
                                - obj:
                                    align: LEFT_MID
                                    x: 0
                                    width: ${53*px//1}
                                    height: ${28*px}
                                    radius: 0
                                    border_width: 0
                                    pad_all: 0
                                    bg_color: 0xFF0000
                                    bg_grad_color: 0xFFFF00
                                    bg_grad_dir: HOR
                                    bg_opa: COVER
                                    clickable: false
                                    scrollable: false
                                - obj:
                                    align: LEFT_MID
                                    x: ${53*px//1}
                                    width: ${53*px//1}
                                    height: ${28*px}
                                    radius: 0
                                    border_width: 0
                                    pad_all: 0
                                    bg_color: 0xFFFF00
                                    bg_grad_color: 0x00FF00
                                    bg_grad_dir: HOR
                                    bg_opa: COVER
                                    clickable: false
                                    scrollable: false
                                - obj:
                                    align: LEFT_MID
                                    x: ${106*px}
                                    width: ${53*px//1}
                                    height: ${28*px}
                                    radius: 0
                                    border_width: 0
                                    pad_all: 0
                                    bg_color: 0x00FF00
                                    bg_grad_color: 0x00FFFF
                                    bg_grad_dir: HOR
                                    bg_opa: COVER
                                    clickable: false
                                    scrollable: false
                                - obj:
                                    align: LEFT_MID
                                    x: ${159*px//1}
                                    width: ${53*px//1}
                                    height: ${28*px}
                                    radius: 0
                                    border_width: 0
                                    pad_all: 0
                                    bg_color: 0x00FFFF
                                    bg_grad_color: 0x0000FF
                                    bg_grad_dir: HOR
                                    bg_opa: COVER
                                    clickable: false
                                    scrollable: false
                                - obj:
                                    align: LEFT_MID
                                    x: ${212*px}
                                    width: ${53*px//1}
                                    height: ${28*px}
                                    radius: 0
                                    border_width: 0
                                    pad_all: 0
                                    bg_color: 0x0000FF
                                    bg_grad_color: 0xFF00FF
                                    bg_grad_dir: HOR
                                    bg_opa: COVER
                                    clickable: false
                                    scrollable: false
                                - obj:
                                    align: LEFT_MID
                                    x: ${265*px//1}
                                    width: ${51*px//1}
                                    height: ${28*px}
                                    radius: 0
                                    border_width: 0
                                    pad_all: 0
                                    bg_color: 0xFF00FF
                                    bg_grad_color: 0xFF0000
                                    bg_grad_dir: HOR
                                    bg_opa: COVER
                                    clickable: false
                                    scrollable: false
                          - slider:
                              id: slider_hue
                              align: TOP_LEFT
                              x: ${116*px}
                              y: ${18*px}
                              width: ${316*px}
                              height: ${28*px}
                              min_value: 0
                              max_value: 359
                              value: 0
                              radius: ${14*px}
                              bg_color: 0xFF0000
                              bg_grad_color: 0xFFFFFF
                              bg_grad_dir: HOR
                              bg_opa: TRANSP
                              indicator:
                                bg_opa: TRANSP
                              knob:
                                bg_color: 0xFFFFFF
                                bg_opa: COVER
                                border_color: 0x000000
                                border_width: 1
                                border_opa: 40%
                                radius: ${14*px}
                                pad_all: ${2*px}
                              on_value:
                                - script.execute: set_accent_from_sliders
                          - label:
                              text: "Saturation"
                              align: TOP_LEFT
                              x: ${16*px}
                              y: ${74*px}
                          - slider:
                              id: slider_sat
                              align: TOP_LEFT
                              x: ${116*px}
                              y: ${70*px}
                              width: ${316*px}
                              height: ${28*px}
                              min_value: 0
                              max_value: 100
                              value: 0
                              radius: ${14*px}
                              bg_color: 0xFFFFFF
                              bg_grad_color: 0xFFFFFF
                              bg_grad_dir: HOR
                              bg_opa: COVER
                              indicator:
                                bg_opa: TRANSP
                              knob:
                                bg_color: 0xFFFFFF
                                bg_opa: COVER
                                border_color: 0x000000
                                border_width: 1
                                border_opa: 40%
                                radius: ${14*px}
                                pad_all: ${2*px}
                              on_value:
                                - script.execute: set_accent_from_sliders
                          - label:
                              text: "Brightness"
                              align: TOP_LEFT
                              x: ${16*px}
                              y: ${126*px}
                          - slider:
                              id: slider_bri
                              align: TOP_LEFT
                              x: ${116*px}
                              y: ${122*px}
                              width: ${316*px}
                              height: ${28*px}
                              min_value: 5
                              max_value: 100
                              value: 95
                              radius: ${14*px}
                              bg_color: 0x000000
                              bg_grad_color: 0xFFFFFF
                              bg_grad_dir: HOR
                              bg_opa: COVER
                              indicator:
                                bg_opa: TRANSP
                              knob:
                                bg_color: 0xFFFFFF
                                bg_opa: COVER
                                border_color: 0x000000
                                border_width: 1
                                border_opa: 40%
                                radius: ${14*px}
                                pad_all: ${2*px}
                              on_value:
                                - script.execute: set_accent_from_sliders
                          - label:
                              text: "Text on fill"
                              align: TOP_LEFT
                              x: ${16*px}
                              y: ${178*px}
                          - obj:
                              align: TOP_LEFT
                              x: ${116*px}
                              y: ${170*px}
                              width: ${316*px}
                              height: ${38*px}
                              radius: ${10*px}
                              bg_color: ${c_surface_2}
                              bg_opa: COVER
                              border_width: 0
                              pad_all: 0
                              clickable: false
                              scrollable: false
                              scrollbar_mode: "off"
                              widgets:
                                - button:
                                    id: seg_txt_0
                                    align: LEFT_MID
                                    x: ${3*px//1}
                                    width: ${104*px}
                                    height: ${32*px}
                                    radius: ${8*px}
                                    pad_all: 0
                                    bg_opa: TRANSP
                                    checked:
                                      bg_color: ${c_selected}
                                      bg_opa: COVER
                                    widgets:
                                      - label:
                                          text: "Auto"
                                          align: CENTER
                                    on_click:
                                      - select.set:
                                          id: sel_slider_text
                                          option: "Auto"
                                - button:
                                    id: seg_txt_1
                                    align: LEFT_MID
                                    x: ${106*px}
                                    width: ${104*px}
                                    height: ${32*px}
                                    radius: ${8*px}
                                    pad_all: 0
                                    bg_opa: TRANSP
                                    checked:
                                      bg_color: ${c_selected}
                                      bg_opa: COVER
                                    widgets:
                                      - label:
                                          text: "Light"
                                          align: CENTER
                                    on_click:
                                      - select.set:
                                          id: sel_slider_text
                                          option: "Light"
                                - button:
                                    id: seg_txt_2
                                    align: LEFT_MID
                                    x: ${209*px//1}
                                    width: ${104*px}
                                    height: ${32*px}
                                    radius: ${8*px}
                                    pad_all: 0
                                    bg_opa: TRANSP
                                    checked:
                                      bg_color: ${c_selected}
                                      bg_opa: COVER
                                    widgets:
                                      - label:
                                          text: "Dark"
                                          align: CENTER
                                    on_click:
                                      - select.set:
                                          id: sel_slider_text
                                          option: "Dark"

                    # ── Screen timing ───────────────────────────────
                    - label:
                        text: "SCREEN"
                        styles: section_header
                        align: TOP_LEFT
                        x: ${32*px}
                        y: ${498*px}

                    - obj:
                        align: TOP_MID
                        y: ${520*px}
                        width: ${448*px}
                        height: ${272*px}
                        styles: card
                        clickable: false
                        scrollable: false
                        scrollbar_mode: "off"
                        widgets:
                          - label:
                              text: "Dim after"
                              align: TOP_LEFT
                              x: ${16*px}
                              y: ${14*px}
                          # Segmented control
                          - obj:
                              align: TOP_LEFT
                              x: ${16*px}
                              y: ${40*px}
                              width: ${416*px}
                              height: ${38*px}
                              radius: ${10*px}
                              bg_color: ${c_surface_2}
                              bg_opa: COVER
                              border_width: 0
                              pad_all: 0
                              clickable: false
                              scrollable: false
                              scrollbar_mode: "off"
                              widgets:
                                - button:
                                    id: seg_dim_0
                                    align: LEFT_MID
                                    x: ${3*px//1}
                                    width: ${82*px}
                                    height: ${32*px}
                                    radius: ${8*px}
                                    pad_all: 0
                                    bg_opa: TRANSP
                                    checked:
                                      bg_color: ${c_selected}
                                      bg_opa: COVER
                                    widgets:
                                      - label:
                                          text: "15 s"
                                          align: CENTER
                                    on_click:
                                      - select.set:
                                          id: sel_dim_after
                                          option: "15 s"
                                - button:
                                    id: seg_dim_1
                                    align: LEFT_MID
                                    x: ${85*px//1}
                                    width: ${82*px}
                                    height: ${32*px}
                                    radius: ${8*px}
                                    pad_all: 0
                                    bg_opa: TRANSP
                                    checked:
                                      bg_color: ${c_selected}
                                      bg_opa: COVER
                                    widgets:
                                      - label:
                                          text: "30 s"
                                          align: CENTER
                                    on_click:
                                      - select.set:
                                          id: sel_dim_after
                                          option: "30 s"
                                - button:
                                    id: seg_dim_2
                                    align: LEFT_MID
                                    x: ${167*px//1}
                                    width: ${82*px}
                                    height: ${32*px}
                                    radius: ${8*px}
                                    pad_all: 0
                                    bg_opa: TRANSP
                                    checked:
                                      bg_color: ${c_selected}
                                      bg_opa: COVER
                                    widgets:
                                      - label:
                                          text: "1 min"
                                          align: CENTER
                                    on_click:
                                      - select.set:
                                          id: sel_dim_after
                                          option: "1 min"
                                - button:
                                    id: seg_dim_3
                                    align: LEFT_MID
                                    x: ${249*px//1}
                                    width: ${82*px}
                                    height: ${32*px}
                                    radius: ${8*px}
                                    pad_all: 0
                                    bg_opa: TRANSP
                                    checked:
                                      bg_color: ${c_selected}
                                      bg_opa: COVER
                                    widgets:
                                      - label:
                                          text: "2 min"
                                          align: CENTER
                                    on_click:
                                      - select.set:
                                          id: sel_dim_after
                                          option: "2 min"
                                - button:
                                    id: seg_dim_4
                                    align: LEFT_MID
