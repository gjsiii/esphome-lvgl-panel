# Core: screen layout — status bar, tab bar, Lights tab shell, settings sheet.
#
# Tabs other than Lights come from tab packages (panel/tabs/*.yaml), which add
# themselves to main_tabview at boot. Light sliders and scene chips come from
# item packages (panel/items/*.yaml), which move into the containers below.

lvgl:
  displays:
    - my_display
  touchscreens:
    - my_touchscreen
  buffer_size: 25%

  pages:
    - id: main_page
      widgets:
        # Full-screen background (sheets from packages are moved in here)
        - obj:
            id: ui_root
            width: 100%
            height: 100%
            styles: container
            scrollbar_mode: "off"

            widgets:
              # ── Status Bar ────────────────────────────────────────
              - obj:
                  width: 100%
                  height: 36
                  align: TOP_MID
                  styles: transparent
                  scrollbar_mode: "off"
                  widgets:
                    # Weather (upper left): hidden unless the weather
                    # package is included and HA has reported a value.
                    # Tapping it opens the weather sheet.
                    - button:
                        id: btn_weather_open
                        align: LEFT_MID
                        x: 4
                        width: 84
                        height: 34
                        bg_opa: TRANSP
                        radius: 10
                        pad_all: 0
                        pressed:
                          bg_color: ${c_surface}
                          bg_opa: COVER
                        hidden: true
                        widgets:
                          - label:
                              id: lbl_weather_icon
                              text: "\U000F0595" # mdi-weather-partly-cloudy
                              text_font: icons_sm
                              text_color: ${c_text}
                              align: LEFT_MID
                              x: 10
                          - label:
                              id: lbl_weather_temp
                              text: "--°"
                              text_font: font_title
                              text_color: ${c_text}
                              align: LEFT_MID
                              x: 38
                        # Tap handler is attached by the weather package
                    # Indoor climate (features/climate.yaml): hidden unless
                    # included; tapping it opens the climate sheet.
                    - button:
                        id: btn_climate_open
                        align: LEFT_MID
                        x: 92
                        width: 78
                        height: 34
                        bg_opa: TRANSP
                        radius: 10
                        pad_all: 0
                        pressed:
                          bg_color: ${c_surface}
                          bg_opa: COVER
                        hidden: true
                        widgets:
                          - label:
                              id: lbl_climate_icon
                              text: "\U000F0F54" # mdi-home-thermometer
                              text_font: icons_sm
                              text_color: ${c_text_2}
                              align: LEFT_MID
                              x: 6
                          - label:
                              id: lbl_climate_temp
                              text: "--°"
                              text_font: font_title
                              align: LEFT_MID
                              x: 32
                        # Tap handler is attached by the climate package
                    - label:
                        id: lbl_time
                        text: "--:--"
                        text_font: font_time
                        text_color: ${c_text}
                        align: CENTER
                    # Status chips (features/status_chip.yaml), right-aligned
                    # left of the connection icon. Layout is set at boot.
                    - obj:
                        id: status_chips
                        align: RIGHT_MID
                        x: -82
                        width: 112
                        height: 32
                        styles: transparent
                        clickable: false
                        scrollable: false
                        scrollbar_mode: "off"
                    - label:
                        id: lbl_hastatus
                        text: "\U000F05A9" # mdi-wifi
                        text_font: icons_sm
                        text_color: ${c_text_2}
                        align: RIGHT_MID
                        x: -50
                    - button:
                        id: btn_settings_open
                        align: RIGHT_MID
                        x: -6
                        width: 40
                        height: 34
                        styles: icon_btn
                        widgets:
                          - label:
                              text: "\U000F0493" # mdi-cog
                              text_font: icons_sm
                              text_color: ${c_text_2}
                              align: CENTER
                        on_click:
                          - script.execute: open_settings   # PIN keypad if locked

              # ── Tab View (tab bar at the bottom) ──────────────────
              - tabview:
                  id: main_tabview
                  width: 100%
                  height: 444
                  align: TOP_MID
                  y: 36
                  position: BOTTOM
                  size: 12%
                  bg_color: ${c_bg}
                  bg_opa: COVER
                  border_width: 0
                  outline_width: 0
                  pad_all: 0
                  scrollbar_mode: "off"

                  tab_style:
                    bg_color: ${c_bg}
                    bg_opa: COVER
                    border_side: TOP
                    border_width: 1
                    border_color: ${c_separator}
                    pad_top: 7
                    pad_bottom: 7
                    pad_left: 10
                    pad_right: 10
                    items:
                      bg_opa: TRANSP
                      border_width: 0
                      outline_width: 0
                      radius: 12
                      text_color: ${c_text_2}
                      text_font: font_body
                      checked:
                        bg_color: ${c_surface_2}
                        bg_opa: COVER
                        border_width: 0
                        text_color: ${c_text}
                      pressed:
                        bg_color: ${c_surface}
                        bg_opa: COVER

                  tabs:
                    # ── Tab 1: Lights (always present) ────────────
                    - name: "Lights"
                      id: tab_lights
                      pad_all: 0
                      widgets:
                        - obj:
                            width: 100%
                            height: 100%
                            styles: container
                            scrollbar_mode: "off"
                            widgets:
                              - label:
                                  id: lbl_scenes_header
                                  text: "SCENES"
                                  styles: section_header
                                  align: TOP_LEFT
                                  x: 24
                                  y: 12

                              # Scene chips (filled by panel/items/scene.yaml).
                              # Chips grow to fill each row: 3 per row.
                              # Flex layout is set at boot (base.yaml): ESPHome
                              # rejects a layout on a container with no widgets.
                              - obj:
                                  id: scene_chips
                                  align: TOP_MID
                                  y: 34
                                  width: 440
                                  height: 106
                                  styles: transparent
                                  scrollbar_mode: "off"

                              - label:
                                  id: lbl_lights_header
                                  text: "${lights_title}"
                                  styles: section_header
                                  align: TOP_LEFT
                                  x: 24
                                  y: 154

                              # Light sliders (filled by panel/items/light.yaml).
                              # Three fit; more scroll. Flex layout set at boot.
                              - obj:
                                  id: lights_list
                                  align: TOP_MID
                                  y: 176
                                  width: 440
                                  height: 210
                                  styles: transparent
                                  scrollbar_mode: "off"

              # ── Settings Sheet (scrolls) ────────────────────────────
              # Values live in core/settings.yaml (also editable from HA).
              - obj:
                  id: settings_panel
                  width: 100%
                  height: 100%
                  align: TOP_LEFT
                  styles: container
                  pad_bottom: 24
                  scrollbar_mode: "off"
                  hidden: true
                  widgets:
                    - label:
                        text: "Settings"
                        text_font: font_title
                        align: TOP_LEFT
                        x: 20
                        y: 22
                    - button:
                        id: btn_settings_close
                        align: TOP_RIGHT
                        x: -10
                        y: 12
                        width: 90
                        height: 44
                        bg_opa: TRANSP
                        radius: 22
                        pad_all: 0
                        pressed:
                          bg_color: ${c_surface}
                          bg_opa: COVER
                        widgets:
                          - label:
                              text: "Done"
                              text_font: font_title
                              text_color: ${c_accent}
                              align: CENTER
                        on_click:
                          - lvgl.widget.hide: settings_panel

                    # Cleaning mode (touch off for 30 s), next to Done
                    - button:
                        id: btn_clean_screen
                        align: TOP_RIGHT
                        x: -104
                        y: 12
                        width: 44
                        height: 44
                        styles: icon_btn
                        pressed:
                          bg_color: ${c_surface}
                          bg_opa: COVER
                        widgets:
                          - label:
                              text: "\U000F0AE0" # mdi-spray-bottle
                              text_font: icons_md
                              text_color: ${c_text_2}
                              align: CENTER
                        on_click:
                          - script.execute: cleaning_mode

                    # ── Update notice (core/settings.yaml: update_notice) ──
                    # Hidden until HA reports a newer release; then the
                    # rest of the sheet moves down to make room for it.
                    - obj:
                        id: update_card
                        align: TOP_MID
                        y: 80
                        width: 448
                        height: 74
                        styles: card
                        border_color: 0x30D158
                        border_width: 1
                        clickable: false
                        scrollable: false
                        scrollbar_mode: "off"
                        hidden: true
                        widgets:
                          - label:
                              text: "\U000F06B0" # mdi-update
                              text_font: icons_md
                              text_color: 0x30D158
                              align: LEFT_MID
                              x: 16
                          - label:
                              id: lbl_update_title
                              text: "Update available"
                              align: TOP_LEFT
                              x: 58
                              y: 13
                          - label:
                              id: lbl_update_text
                              text: ""
                              text_font: font_caption
                              text_color: ${c_text_2}
                              long_mode: WRAP
                              width: 374
                              align: TOP_LEFT
                              x: 58
                              y: 36

                    # ── Display: brightness ─────────────────────────
                    - label:
                        text: "DISPLAY"
                        styles: section_header
                        align: TOP_LEFT
                        x: 32
                        y: 80

                    - obj:
                        align: TOP_MID
                        y: 102
                        width: 448
                        height: 118
                        styles: card
                        clickable: false
                        scrollable: false
                        scrollbar_mode: "off"
                        widgets:
                          - label:
                              text: "Brightness"
                              align: TOP_LEFT
                              x: 16
                              y: 14
                          - label:
                              id: lbl_brightness_pct
                              text: "100%"
                              text_color: ${c_text_2}
                              align: TOP_RIGHT
                              x: -16
                              y: 14
                          - label:
                              text: "\U000F00DE" # mdi-brightness-5
                              text_font: icons_md
                              text_color: ${c_text_2}
                              align: BOTTOM_LEFT
                              x: 14
                              y: -22
                          - slider:
                              id: slider_brightness
                              align: BOTTOM_MID
                              y: -14
                              width: 340
                              height: 44
                              min_value: 10
                              max_value: 100
                              value: 100
                              bg_color: ${c_surface_2}
                              radius: 14
                              indicator:
                                radius: 14
                              on_value:
                                - lambda: "id(user_brightness) = x / 100.0f;"
                                - light.turn_on:
                                    id: display_backlight
                                    brightness: !lambda "return x / 100.0f;"
                                    transition_length: 0s
                                - lvgl.label.update:
                                    id: lbl_brightness_pct
                                    text: !lambda |-
                                      char buf[8];
                                      snprintf(buf, sizeof(buf), "%d%%", (int)x);
                                      return std::string(buf);
                          - label:
                              text: "\U000F00E0" # mdi-brightness-7
                              text_font: icons_md
                              text_color: ${c_text_2}
                              align: BOTTOM_RIGHT
                              x: -14
                              y: -22

                    # ── Slider color: hue / saturation / brightness ─
                    # Also a "Slider Color" light in HA (color wheel there).
                    - label:
                        text: "SLIDER COLOR"
                        styles: section_header
                        align: TOP_LEFT
                        x: 32
                        y: 236
                    - obj:
                        id: accent_preview
                        align: TOP_RIGHT
                        x: -24
                        y: 232
                        width: 20
                        height: 20
                        radius: 10
                        bg_color: ${c_accent}
                        bg_opa: COVER
                        border_width: 1
                        border_color: ${c_separator}
                        clickable: false

                    - obj:
                        align: TOP_MID
                        y: 258
                        width: 448
                        height: 222
                        styles: card
                        clickable: false
                        scrollable: false
                        scrollbar_mode: "off"
                        widgets:
                          - label:
                              text: "Hue"
                              align: TOP_LEFT
                              x: 16
                              y: 22
                          # Rainbow track (LVGL gradients have 2 stops, so 6 pieces)
                          - obj:
                              align: TOP_LEFT
                              x: 116
                              y: 18
                              width: 316
                              height: 28
                              radius: 14
                              clip_corner: true
                              bg_opa: TRANSP
                              border_width: 0
                              pad_all: 0
                              clickable: false
                              scrollable: false
                              scrollbar_mode: "off"
                              widgets:
                                - obj:
                                    align: LEFT_MID
                                    x: 0
                                    width: 53
                                    height: 28
                                    radius: 0
                                    border_width: 0
                                    pad_all: 0
                                    bg_color: 0xFF0000
                                    bg_grad_color: 0xFFFF00
                                    bg_grad_dir: HOR
                                    bg_opa: COVER
                                    clickable: false
                                    scrollable: false
                                - obj:
                                    align: LEFT_MID
                                    x: 53
                                    width: 53
                                    height: 28
                                    radius: 0
                                    border_width: 0
                                    pad_all: 0
                                    bg_color: 0xFFFF00
                                    bg_grad_color: 0x00FF00
                                    bg_grad_dir: HOR
                                    bg_opa: COVER
                                    clickable: false
                                    scrollable: false
                                - obj:
                                    align: LEFT_MID
                                    x: 106
                                    width: 53
                                    height: 28
                                    radius: 0
                                    border_width: 0
                                    pad_all: 0
                                    bg_color: 0x00FF00
                                    bg_grad_color: 0x00FFFF
                                    bg_grad_dir: HOR
                                    bg_opa: COVER
                                    clickable: false
                                    scrollable: false
                                - obj:
                                    align: LEFT_MID
                                    x: 159
                                    width: 53
                                    height: 28
                                    radius: 0
                                    border_width: 0
                                    pad_all: 0
                                    bg_color: 0x00FFFF
                                    bg_grad_color: 0x0000FF
                                    bg_grad_dir: HOR
                                    bg_opa: COVER
                                    clickable: false
                                    scrollable: false
                                - obj:
                                    align: LEFT_MID
                                    x: 212
                                    width: 53
                                    height: 28
                                    radius: 0
                                    border_width: 0
                                    pad_all: 0
                                    bg_color: 0x0000FF
                                    bg_grad_color: 0xFF00FF
                                    bg_grad_dir: HOR
                                    bg_opa: COVER
                                    clickable: false
                                    scrollable: false
                                - obj:
                                    align: LEFT_MID
                                    x: 265
                                    width: 51
                                    height: 28
                                    radius: 0
                                    border_width: 0
                                    pad_all: 0
                                    bg_color: 0xFF00FF
                                    bg_grad_color: 0xFF0000
                                    bg_grad_dir: HOR
                                    bg_opa: COVER
                                    clickable: false
                                    scrollable: false
                          - slider:
                              id: slider_hue
                              align: TOP_LEFT
                              x: 116
                              y: 18
                              width: 316
                              height: 28
                              min_value: 0
                              max_value: 359
                              value: 0
                              radius: 14
                              bg_color: 0xFF0000
                              bg_grad_color: 0xFFFFFF
                              bg_grad_dir: HOR
                              bg_opa: TRANSP
                              indicator:
                                bg_opa: TRANSP
                              knob:
                                bg_color: 0xFFFFFF
                                bg_opa: COVER
                                border_color: 0x000000
                                border_width: 1
                                border_opa: 40%
                                radius: 14
                                pad_all: 2
                              on_value:
                                - script.execute: set_accent_from_sliders
                          - label:
                              text: "Saturation"
                              align: TOP_LEFT
                              x: 16
                              y: 74
                          - slider:
                              id: slider_sat
                              align: TOP_LEFT
                              x: 116
                              y: 70
                              width: 316
                              height: 28
                              min_value: 0
                              max_value: 100
                              value: 0
                              radius: 14
                              bg_color: 0xFFFFFF
                              bg_grad_color: 0xFFFFFF
                              bg_grad_dir: HOR
                              bg_opa: COVER
                              indicator:
                                bg_opa: TRANSP
                              knob:
                                bg_color: 0xFFFFFF
                                bg_opa: COVER
                                border_color: 0x000000
                                border_width: 1
                                border_opa: 40%
                                radius: 14
                                pad_all: 2
                              on_value:
                                - script.execute: set_accent_from_sliders
                          - label:
                              text: "Brightness"
                              align: TOP_LEFT
                              x: 16
                              y: 126
                          - slider:
                              id: slider_bri
                              align: TOP_LEFT
                              x: 116
                              y: 122
                              width: 316
                              height: 28
                              min_value: 5
                              max_value: 100
                              value: 95
                              radius: 14
                              bg_color: 0x000000
                              bg_grad_color: 0xFFFFFF
                              bg_grad_dir: HOR
                              bg_opa: COVER
                              indicator:
                                bg_opa: TRANSP
                              knob:
                                bg_color: 0xFFFFFF
                                bg_opa: COVER
                                border_color: 0x000000
                                border_width: 1
                                border_opa: 40%
                                radius: 14
                                pad_all: 2
                              on_value:
                                - script.execute: set_accent_from_sliders
                          - label:
                              text: "Text on fill"
                              align: TOP_LEFT
                              x: 16
                              y: 178
                          - obj:
                              align: TOP_LEFT
                              x: 116
                              y: 170
                              width: 316
                              height: 38
                              radius: 10
                              bg_color: ${c_surface_2}
                              bg_opa: COVER
                              border_width: 0
                              pad_all: 0
                              clickable: false
                              scrollable: false
                              scrollbar_mode: "off"
                              widgets:
                                - button:
                                    id: seg_txt_0
                                    align: LEFT_MID
                                    x: 3
                                    width: 104
                                    height: 32
                                    radius: 8
                                    pad_all: 0
                                    bg_opa: TRANSP
                                    checked:
                                      bg_color: ${c_selected}
                                      bg_opa: COVER
                                    widgets:
                                      - label:
                                          text: "Auto"
                                          align: CENTER
                                    on_click:
                                      - select.set:
                                          id: sel_slider_text
                                          option: "Auto"
                                - button:
                                    id: seg_txt_1
                                    align: LEFT_MID
                                    x: 106
                                    width: 104
                                    height: 32
                                    radius: 8
                                    pad_all: 0
                                    bg_opa: TRANSP
                                    checked:
                                      bg_color: ${c_selected}
                                      bg_opa: COVER
                                    widgets:
                                      - label:
                                          text: "Light"
                                          align: CENTER
                                    on_click:
                                      - select.set:
                                          id: sel_slider_text
                                          option: "Light"
                                - button:
                                    id: seg_txt_2
                                    align: LEFT_MID
                                    x: 209
                                    width: 104
                                    height: 32
                                    radius: 8
                                    pad_all: 0
                                    bg_opa: TRANSP
                                    checked:
                                      bg_color: ${c_selected}
                                      bg_opa: COVER
                                    widgets:
                                      - label:
                                          text: "Dark"
                                          align: CENTER
                                    on_click:
                                      - select.set:
                                          id: sel_slider_text
                                          option: "Dark"

                    # ── Screen timing ───────────────────────────────
                    - label:
                        text: "SCREEN"
                        styles: section_header
                        align: TOP_LEFT
                        x: 32
                        y: 498

                    - obj:
                        align: TOP_MID
                        y: 520
                        width: 448
                        height: 272
                        styles: card
                        clickable: false
                        scrollable: false
                        scrollbar_mode: "off"
                        widgets:
                          - label:
                              text: "Dim after"
                              align: TOP_LEFT
                              x: 16
                              y: 14
                          # Segmented control
                          - obj:
                              align: TOP_LEFT
                              x: 16
                              y: 40
                              width: 416
                              height: 38
                              radius: 10
                              bg_color: ${c_surface_2}
                              bg_opa: COVER
                              border_width: 0
                              pad_all: 0
                              clickable: false
                              scrollable: false
                              scrollbar_mode: "off"
                              widgets:
                                - button:
                                    id: seg_dim_0
                                    align: LEFT_MID
                                    x: 3
                                    width: 82
                                    height: 32
                                    radius: 8
                                    pad_all: 0
                                    bg_opa: TRANSP
                                    checked:
                                      bg_color: ${c_selected}
                                      bg_opa: COVER
                                    widgets:
                                      - label:
                                          text: "15 s"
                                          align: CENTER
                                    on_click:
                                      - select.set:
                                          id: sel_dim_after
                                          option: "15 s"
                                - button:
                                    id: seg_dim_1
                                    align: LEFT_MID
                                    x: 85
                                    width: 82
                                    height: 32
                                    radius: 8
                                    pad_all: 0
                                    bg_opa: TRANSP
                                    checked:
                                      bg_color: ${c_selected}
                                      bg_opa: COVER
                                    widgets:
                                      - label:
                                          text: "30 s"
                                          align: CENTER
                                    on_click:
                                      - select.set:
                                          id: sel_dim_after
                                          option: "30 s"
                                - button:
                                    id: seg_dim_2
                                    align: LEFT_MID
                                    x: 167
                                    width: 82
                                    height: 32
                                    radius: 8
                                    pad_all: 0
                                    bg_opa: TRANSP
                                    checked:
                                      bg_color: ${c_selected}
                                      bg_opa: COVER
                                    widgets:
                                      - label:
                                          text: "1 min"
                                          align: CENTER
                                    on_click:
                                      - select.set:
                                          id: sel_dim_after
                                          option: "1 min"
                                - button:
                                    id: seg_dim_3
                                    align: LEFT_MID
                                    x: 249
                                    width: 82
                                    height: 32
                                    radius: 8
                                    pad_all: 0
                                    bg_opa: TRANSP
                                    checked:
                                      bg_color: ${c_selected}
                                      bg_opa: COVER
                                    widgets:
                                      - label:
                                          text: "2 min"
                                          align: CENTER
                                    on_click:
                                      - select.set:
                                          id: sel_dim_after
                                          option: "2 min"
                                - button:
                                    id: seg_dim_4
                                    align: LEFT_MID
                                    x: 331
                                    width: 82
                                    height: 32
                                    radius: 8
                                    pad_all: 0
                                    bg_opa: TRANSP
                                    checked:
                                      bg_color: ${c_selected}
                                      bg_opa: COVER
                                    widgets:
                                      - label:
                                          text: "Never"
                                          align: CENTER
                                    on_click:
                                      - select.set:
                                          id: sel_dim_after
                                          option: "Never"
                          - label:
                              text: "Turn off after"
                              align: TOP_LEFT
                              x: 16
                              y: 102
                          - obj:
                              align: TOP_LEFT
                              x: 16
                              y: 128
                              width: 416
                              height: 38
                              radius: 10
                              bg_color: ${c_surface_2}
                              bg_opa: COVER
                              border_width: 0
                              pad_all: 0
                              clickable: false
                              scrollable: false
                              scrollbar_mode: "off"
                              widgets:
                                - button:
                                    id: seg_off_0
                                    align: LEFT_MID
                                    x: 3
                                    width: 82
                                    height: 32
                                    radius: 8
                                    pad_all: 0
                                    bg_opa: TRANSP
                                    checked:
                                      bg_color: ${c_selected}
                                      bg_opa: COVER
                                    widgets:
                                      - label:
                                          text: "1 min"
                                          align: CENTER
                                    on_click:
                                      - select.set:
                                          id: sel_off_after
                                          option: "1 min"
                                - button:
                                    id: seg_off_1
                                    align: LEFT_MID
                                    x: 85
                                    width: 82
                                    height: 32
                                    radius: 8
                                    pad_all: 0
                                    bg_opa: TRANSP
                                    checked:
                                      bg_color: ${c_selected}
                                      bg_opa: COVER
                                    widgets:
                                      - label:
                                          text: "5 min"
                                          align: CENTER
                                    on_click:
                                      - select.set:
                                          id: sel_off_after
                                          option: "5 min"
                                - button:
                                    id: seg_off_2
                                    align: LEFT_MID
                                    x: 167
                                    width: 82
                                    height: 32
                                    radius: 8
                                    pad_all: 0
                                    bg_opa: TRANSP
                                    checked:
                                      bg_color: ${c_selected}
                                      bg_opa: COVER
                                    widgets:
                                      - label:
                                          text: "10 min"
