                              text_font: font_body
                              long_mode: DOT
                              width: ${420*px}
                              text_align: CENTER
                              align: TOP_MID
                              y: ${234*px}
                              hidden: true

  # ── Message banner (core/messages.yaml) ──────────────────────────────────
  # On the top layer: above every page and sheet, and not closed on dim.
  top_layer:
    widgets:
      - button:
          id: msg_banner
          align: TOP_MID
          y: ${6*px}
          width: ${456*px}
          height: ${84*px}
          radius: ${18*px}
          bg_color: ${c_surface_2}
          bg_opa: COVER
          border_color: ${c_separator}
          border_width: 1
          pad_all: 0
          hidden: true
          pressed:
            bg_color: ${c_separator}
          widgets:
            - label:
                id: lbl_msg_icon
                text: "\U000F02FC"
                text_font: icons_md
                align: LEFT_MID
                x: ${18*px}
            - label:
                id: lbl_msg_title
                text: ""
                text_font: font_title
                long_mode: DOT
                width: ${370*px}
                align: TOP_LEFT
                x: ${64*px}
                y: ${12*px}
            - label:
                id: lbl_msg_text
                text: ""
                text_color: ${c_text_2}
                long_mode: DOT
                width: ${370*px}
                height: ${40*px}
                align: TOP_LEFT
                x: ${64*px}
                y: ${40*px}
          on_click:
            - script.execute: msg_hide

      # ── Cleaning mode cover (core/settings.yaml: cleaning_mode) ────────────
      # Full screen and clickable, so it swallows every touch while shown.
      - obj:
          id: clean_overlay
          width: 100%
          height: 100%
          align: TOP_LEFT
          styles: container
          scrollable: false
          scrollbar_mode: "off"
          hidden: true
          widgets:
            - label:
                text: "\U000F0AE0" # mdi-spray-bottle
                text_font: icons_xl
                text_color: ${c_text_2}
                align: CENTER
                y: -${110*px}
            - label:
                text: "Cleaning mode"
                text_font: font_title
                align: CENTER
                y: -${56*px}
            - label:
                id: lbl_clean_count
                text: "30"
                text_font: font_temp_xl
                align: CENTER
                y: ${20*px}
            - label:
                text: "Touch is off — wipe away. It turns back on by itself."
                text_font: font_caption
                text_color: ${c_text_2}
                align: CENTER
                y: ${92*px}
