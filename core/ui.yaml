              # ── Night clock (Sleep screen = Clock / Red clock) ──────
              # Shown instead of a blank screen when the panel goes to
              # sleep; it covers everything so a tap only wakes the panel.
              - obj:
                  id: night_clock
                  width: 100%
                  height: 100%
                  align: TOP_LEFT
                  styles: container
                  scrollable: false
                  scrollbar_mode: "off"
                  hidden: true
                  widgets:
                    # Moved a few pixels every minute (core/base.yaml)
                    - obj:
                        id: night_clock_box
                        align: CENTER
                        width: ${440*px}
                        height: ${270*px}
                        styles: transparent
                        clickable: false
                        scrollable: false
                        widgets:
                          - label:
                              id: lbl_night_time
                              text: "--:--"
                              text_font: font_clock_xl
                              align: TOP_MID
                              y: ${10*px}
                          - label:
                              id: lbl_night_date
                              text: ""
                              text_font: font_title
                              align: TOP_MID
                              y: ${150*px}
                          # Optional note under the date, set by a feature
                          # (e.g. powder day, features/snow_report.yaml)
                          - obj:
                              id: night_note
                              align: TOP_MID
                              y: ${190*px}
                              width: SIZE_CONTENT
                              height: SIZE_CONTENT
                              styles: transparent
                              layout:
                                type: FLEX
                                flex_flow: ROW
                                flex_align_cross: CENTER
                                pad_column: ${8*px}
                              hidden: true
                              widgets:
                                - label:
                                    id: lbl_night_note_icon
                                    text: ""
                                    text_font: icons_sm
                                - label:
                                    id: lbl_night_note
                                    text: ""
                                    text_font: font_title
                          # Now playing (tabs/music.yaml), dimmer, its own line
