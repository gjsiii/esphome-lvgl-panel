# Core: light color sheet — hold a light's name on the Lights tab to open it.
# Brightness, warmth (color temperature) and color (hue, saturation and
# quick swatches) for that light. Sections the light doesn't support are
# hidden; a light that only dims doesn't open the sheet.
#
# One sheet is shared by every light: panel/items/light.yaml fills it
# (script light_sheet_fill) with the held light's values and keeps it in
# sync while it's open. Changes go to HA when the finger lifts.

globals:
  - id: light_sheet_entity
    type: std::string
    restore_value: false
  - id: light_sheet_slot
    type: int
    restore_value: false
    initial_value: "-1"
  # The open light has color temperature (the white swatch uses it)
  - id: light_sheet_ct
    type: bool
    restore_value: false
    initial_value: "false"

esphome:
  on_boot:
    - priority: -150
      then:
        - lambda: "lv_obj_set_parent(id(ls_panel), id(ui_root));"

script:
  # Copy one light's values into the sheet (sliders being dragged are left alone)
  - id: light_sheet_fill
    parameters:
      name: string
      is_on: bool
      bri: int
      modes: string
      kelvin: float
      hs: string
    then:
      - lambda: |-
          lv_label_set_text(id(lbl_ls_title), name.c_str());
          bool ct = modes.find("color_temp") != std::string::npos;
          id(light_sheet_ct) = ct;
          bool col = modes.find("hs") != std::string::npos || modes.find("xy") != std::string::npos ||
                     modes.find("rgb") != std::string::npos;
          if (ct) lv_obj_clear_flag(id(ls_sec_ct), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_add_flag(id(ls_sec_ct), LV_OBJ_FLAG_HIDDEN);
          if (col) lv_obj_clear_flag(id(ls_sec_color), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_add_flag(id(ls_sec_color), LV_OBJ_FLAG_HIDDEN);

          lv_obj_set_style_text_color(id(lbl_ls_power), lv_color_hex(is_on ? 0xFFD60A : ${c_text_2}), LV_PART_MAIN);
          if (!lv_obj_has_state(id(ls_bri), LV_STATE_PRESSED)) {
            int b = is_on ? bri : 0;
            lv_slider_set_value(id(ls_bri), b, LV_ANIM_OFF);
            std::string t = is_on ? std::to_string((int) lroundf(b * 100.0f / 255.0f)) + "%" : std::string("Off");
            lv_label_set_text(id(lbl_ls_bri), t.c_str());
          }
          if (!isnan(kelvin) && !lv_obj_has_state(id(ls_ct), LV_STATE_PRESSED)) {
            lv_slider_set_value(id(ls_ct), (int32_t) kelvin, LV_ANIM_OFF);
            char k[16];
            snprintf(k, sizeof(k), "%dK", (int) kelvin);
            lv_label_set_text(id(lbl_ls_kelvin), k);
          }
          // hs_color arrives as text, e.g. "(30.0, 50.0)" or "[30.0, 50.0]"
          const char *p = hs.c_str();
          auto skip = [](const char *q) { while (*q && !(isdigit((unsigned char) *q) || *q == '.')) q++; return q; };
          char *end;
          p = skip(p);
          float h = strtof(p, &end);
          if (end != p) {
            p = skip(end);
            float s = strtof(p, &end);
            if (end != p && !lv_obj_has_state(id(ls_hue), LV_STATE_PRESSED) &&
                !lv_obj_has_state(id(ls_sat), LV_STATE_PRESSED)) {
              lv_slider_set_value(id(ls_hue), (int32_t) h, LV_ANIM_OFF);
              lv_slider_set_value(id(ls_sat), (int32_t) s, LV_ANIM_OFF);
            }
          }
      - script.execute: light_sheet_tracks

  # Saturation track: white -> the current hue
  - id: light_sheet_tracks
    then:
      - lambda: |-
          int h = lv_slider_get_value(id(ls_hue));
          lv_obj_set_style_bg_grad_color(id(ls_sat), lv_color_hsv_to_rgb(h, 100, 100), LV_PART_MAIN);

  - id: light_sheet_show
    then:
      - lambda: |-
          lv_obj_clear_flag(id(ls_panel), LV_OBJ_FLAG_HIDDEN);
          lv_obj_move_foreground(id(ls_panel));
          lv_obj_scroll_to_y(id(ls_body), 0, LV_ANIM_OFF);

  # Send a hue/saturation to the light
  - id: light_sheet_send_hs
    parameters:
      hue: int
      sat: int
    then:
      - homeassistant.action:
          action: light.turn_on
          data:
            entity_id: !lambda "return id(light_sheet_entity);"
          data_template:
            hs_color: "{{ [hue | float, sat | float] }}"
          variables:
            hue: !lambda "return std::to_string(hue);"
            sat: !lambda "return std::to_string(sat);"

  # A swatch was tapped: move the sliders and send it
  - id: light_sheet_swatch
    parameters:
      hue: int
      sat: int
    then:
      - lambda: |-
          lv_slider_set_value(id(ls_hue), hue, LV_ANIM_OFF);
          lv_slider_set_value(id(ls_sat), sat, LV_ANIM_OFF);
      - script.execute: light_sheet_tracks
      - script.execute:
          id: light_sheet_send_hs
          hue: !lambda "return hue;"
          sat: !lambda "return sat;"

  # The white swatch: neutral white (4000 K) on lights with white tones,
  # otherwise zero saturation
  - id: light_sheet_white
    then:
      - if:
          condition:
            lambda: "return id(light_sheet_ct);"
          then:
            - lambda: |-
                lv_slider_set_value(id(ls_ct), 4000, LV_ANIM_OFF);
                lv_label_set_text(id(lbl_ls_kelvin), "4000K");
                lv_slider_set_value(id(ls_sat), 0, LV_ANIM_OFF);
            - homeassistant.action:
                action: light.turn_on
                data:
                  entity_id: !lambda "return id(light_sheet_entity);"
                  color_temp_kelvin: "4000"
          else:
            - script.execute:
                id: light_sheet_swatch
                hue: !lambda "return (int) lv_slider_get_value(id(ls_hue));"
                sat: 0

lvgl:
  pages:
    # Holding page (never shown): the sheet is moved onto ui_root at boot
    - id: holding_light_sheet
      skip: true
      widgets:
        - obj:
            id: ls_panel
            width: 100%
            height: 100%
            align: TOP_LEFT
            styles: container
            scrollable: false
            scrollbar_mode: "off"
            hidden: true
            widgets:
              - label:
                  id: lbl_ls_title
                  text: ""
                  text_font: font_title
                  long_mode: DOT
                  width: 260
                  align: TOP_LEFT
                  x: 20
                  y: 22
              # Power (yellow while on)
              - button:
                  align: TOP_RIGHT
                  x: -104
                  y: 12
                  width: 44
                  height: 44
                  styles: icon_btn
                  pressed:
                    bg_color: ${c_surface}
                    bg_opa: COVER
                  widgets:
                    - label:
                        id: lbl_ls_power
                        text: "\U000F0425" # mdi-power
                        text_font: icons_md
                        text_color: ${c_text_2}
                        align: CENTER
                  on_click:
                    - homeassistant.action:
                        action: light.toggle
                        data:
                          entity_id: !lambda "return id(light_sheet_entity);"
              - button:
                  align: TOP_RIGHT
                  x: -10
                  y: 12
                  width: 90
                  height: 44
                  bg_opa: TRANSP
                  radius: 22
                  pad_all: 0
                  pressed:
                    bg_color: ${c_surface}
                    bg_opa: COVER
                  widgets:
                    - label:
                        text: "Done"
                        text_font: font_title
                        text_color: ${c_accent}
                        align: CENTER
                  on_click:
                    - lvgl.widget.hide: ls_panel

              # Sections stack in a column; unsupported ones are hidden
              - obj:
                  id: ls_body
                  align: TOP_MID
                  y: 64
                  width: 100%
                  height: 416
                  styles: transparent
                  pad_left: 20
                  pad_right: 20
                  pad_bottom: 16
                  scrollbar_mode: "off"
                  layout:
                    type: FLEX
                    flex_flow: COLUMN
                    flex_align_main: START
                    flex_align_cross: CENTER
                    flex_align_track: START
                    pad_row: 14
                  widgets:
                    # ── Brightness ─────────────────────────────────
                    - obj:
                        width: 440
                        height: 82
                        styles: transparent
                        scrollable: false
                        widgets:
                          - label:
                              text: "BRIGHTNESS"
                              styles: section_header
                              align: TOP_LEFT
                              x: 4
                          - label:
                              id: lbl_ls_bri
                              text: "Off"
                              text_font: font_caption
                              text_color: ${c_text_2}
                              align: TOP_RIGHT
                              x: -4
                          - slider:
                              id: ls_bri
                              align: TOP_LEFT
                              y: 24
                              width: 440
                              height: 56
                              min_value: 0
                              max_value: 255
                              value: 0
                              on_value:
                                - lvgl.label.update:
                                    id: lbl_ls_bri
                                    text: !lambda 'return x <= 0 ? std::string("Off") : std::to_string((int) lroundf(x * 100.0f / 255.0f)) + "%";'
                              on_release:
                                - if:
                                    condition:
                                      lambda: "return x <= 0;"
                                    then:
                                      - homeassistant.action:
                                          action: light.turn_off
                                          data:
                                            entity_id: !lambda "return id(light_sheet_entity);"
                                    else:
                                      - homeassistant.action:
                                          action: light.turn_on
                                          data:
                                            entity_id: !lambda "return id(light_sheet_entity);"
                                            brightness: !lambda "return (int)x;"

                    # ── Warmth (color temperature) ─────────────────
                    - obj:
                        id: ls_sec_ct
                        width: 440
                        height: 74
                        styles: transparent
                        scrollable: false
                        widgets:
                          - label:
                              text: "WARMTH"
                              styles: section_header
                              align: TOP_LEFT
                              x: 4
                          - label:
                              id: lbl_ls_kelvin
                              text: ""
                              text_font: font_caption
                              text_color: ${c_text_2}
                              align: TOP_RIGHT
                              x: -4
                          # Inset so the round knob isn't clipped at the ends
                          - slider:
                              id: ls_ct
                              align: TOP_LEFT
                              x: 22
                              y: 28
                              width: 396
                              height: 40
                              min_value: 2000
                              max_value: 6500
                              value: 2700
                              radius: 20
                              bg_color: 0xFF9A3C
                              bg_grad_color: 0xD6E6FF
                              bg_grad_dir: HOR
                              bg_opa: COVER
                              indicator:
                                bg_opa: TRANSP
                              knob:
                                bg_color: 0xFFFFFF
                                bg_opa: COVER
                                border_color: 0x000000
                                border_width: 1
                                border_opa: 40%
                                radius: 20
                                pad_all: 2
                              on_value:
                                - lvgl.label.update:
                                    id: lbl_ls_kelvin
                                    text: !lambda 'return std::to_string((int) x) + "K";'
                              on_release:
                                - homeassistant.action:
                                    action: light.turn_on
                                    data:
                                      entity_id: !lambda "return id(light_sheet_entity);"
                                      color_temp_kelvin: !lambda "return (int)x;"

                    # ── Color: hue, saturation, swatches ───────────
                    - obj:
                        id: ls_sec_color
                        width: 440
                        height: 190
                        styles: transparent
                        scrollable: false
                        widgets:
                          - label:
                              text: "COLOR"
                              styles: section_header
                              align: TOP_LEFT
                              x: 4
                          # Rainbow track (LVGL gradients have 2 stops, so 6 pieces)
                          - obj:
                              align: TOP_LEFT
                              x: 22
                              y: 28
                              width: 396
                              height: 40
                              radius: 20
                              clip_corner: true
                              bg_opa: TRANSP
                              border_width: 0
                              pad_all: 0
                              clickable: false
                              scrollable: false
                              scrollbar_mode: "off"
                              widgets:
                                - obj: { align: LEFT_MID, x: 0, width: 66, height: 40, radius: 0, border_width: 0, pad_all: 0, bg_color: 0xFF0000, bg_grad_color: 0xFFFF00, bg_grad_dir: HOR, bg_opa: COVER, clickable: false, scrollable: false }
                                - obj: { align: LEFT_MID, x: 66, width: 66, height: 40, radius: 0, border_width: 0, pad_all: 0, bg_color: 0xFFFF00, bg_grad_color: 0x00FF00, bg_grad_dir: HOR, bg_opa: COVER, clickable: false, scrollable: false }
                                - obj: { align: LEFT_MID, x: 132, width: 66, height: 40, radius: 0, border_width: 0, pad_all: 0, bg_color: 0x00FF00, bg_grad_color: 0x00FFFF, bg_grad_dir: HOR, bg_opa: COVER, clickable: false, scrollable: false }
                                - obj: { align: LEFT_MID, x: 198, width: 66, height: 40, radius: 0, border_width: 0, pad_all: 0, bg_color: 0x00FFFF, bg_grad_color: 0x0000FF, bg_grad_dir: HOR, bg_opa: COVER, clickable: false, scrollable: false }
                                - obj: { align: LEFT_MID, x: 264, width: 66, height: 40, radius: 0, border_width: 0, pad_all: 0, bg_color: 0x0000FF, bg_grad_color: 0xFF00FF, bg_grad_dir: HOR, bg_opa: COVER, clickable: false, scrollable: false }
                                - obj: { align: LEFT_MID, x: 330, width: 66, height: 40, radius: 0, border_width: 0, pad_all: 0, bg_color: 0xFF00FF, bg_grad_color: 0xFF0000, bg_grad_dir: HOR, bg_opa: COVER, clickable: false, scrollable: false }
                          - slider:
                              id: ls_hue
                              align: TOP_LEFT
                              x: 22
                              y: 28
                              width: 396
                              height: 40
                              min_value: 0
                              max_value: 359
                              value: 0
                              radius: 20
                              bg_opa: TRANSP
                              indicator:
                                bg_opa: TRANSP
                              knob:
                                bg_color: 0xFFFFFF
                                bg_opa: COVER
                                border_color: 0x000000
                                border_width: 1
                                border_opa: 40%
                                radius: 20
                                pad_all: 2
                              on_value:
                                - script.execute: light_sheet_tracks
                              on_release:
                                - script.execute:
                                    id: light_sheet_send_hs
                                    hue: !lambda "return (int) x;"
                                    sat: !lambda "return (int) lv_slider_get_value(id(ls_sat));"
                          # Saturation: white -> hue (end color set by light_sheet_tracks)
                          - slider:
                              id: ls_sat
                              align: TOP_LEFT
                              x: 22
                              y: 80
                              width: 396
                              height: 40
                              min_value: 0
                              max_value: 100
                              value: 100
                              radius: 20
                              bg_color: 0xFFFFFF
                              bg_grad_color: 0xFF0000
                              bg_grad_dir: HOR
                              bg_opa: COVER
                              indicator:
                                bg_opa: TRANSP
                              knob:
                                bg_color: 0xFFFFFF
                                bg_opa: COVER
                                border_color: 0x000000
                                border_width: 1
                                border_opa: 40%
                                radius: 20
                                pad_all: 2
                              on_release:
                                - script.execute:
                                    id: light_sheet_send_hs
                                    hue: !lambda "return (int) lv_slider_get_value(id(ls_hue));"
                                    sat: !lambda "return (int) x;"
                          # Quick swatches: white, then colors
                          - obj:
                              align: TOP_LEFT
                              y: 136
                              width: 440
                              height: 50
                              styles: transparent
                              scrollable: false
                              layout:
                                type: FLEX
                                flex_flow: ROW
                                flex_align_main: SPACE_BETWEEN
                                flex_align_cross: CENTER
                                flex_align_track: CENTER
                              widgets:
                                - button:
                                    width: 48
                                    height: 48
                                    styles: round_btn
                                    bg_color: 0xF5F1E8
                                    pressed: { border_color: 0x8E8E93, border_width: 3 }
                                    on_click:
                                      - script.execute: light_sheet_white
                                - button:
                                    width: 48
                                    height: 48
                                    styles: round_btn
                                    bg_color: 0xFF453A
                                    pressed: { border_color: 0xFFFFFF, border_width: 3 }
                                    on_click: { script.execute: { id: light_sheet_swatch, hue: 0, sat: 100 } }
                                - button:
                                    width: 48
                                    height: 48
                                    styles: round_btn
                                    bg_color: 0xFF9F0A
                                    pressed: { border_color: 0xFFFFFF, border_width: 3 }
                                    on_click: { script.execute: { id: light_sheet_swatch, hue: 30, sat: 100 } }
                                - button:
                                    width: 48
                                    height: 48
                                    styles: round_btn
                                    bg_color: 0xFFD60A
                                    pressed: { border_color: 0xFFFFFF, border_width: 3 }
                                    on_click: { script.execute: { id: light_sheet_swatch, hue: 50, sat: 100 } }
                                - button:
                                    width: 48
                                    height: 48
                                    styles: round_btn
                                    bg_color: 0x30D158
                                    pressed: { border_color: 0xFFFFFF, border_width: 3 }
                                    on_click: { script.execute: { id: light_sheet_swatch, hue: 120, sat: 100 } }
                                - button:
                                    width: 48
                                    height: 48
                                    styles: round_btn
                                    bg_color: 0x0A84FF
                                    pressed: { border_color: 0xFFFFFF, border_width: 3 }
                                    on_click: { script.execute: { id: light_sheet_swatch, hue: 220, sat: 100 } }
                                - button:
                                    width: 48
                                    height: 48
                                    styles: round_btn
                                    bg_color: 0xBF5AF2
                                    pressed: { border_color: 0xFFFFFF, border_width: 3 }
                                    on_click: { script.execute: { id: light_sheet_swatch, hue: 280, sat: 90 } }
                                - button:
                                    width: 48
                                    height: 48
                                    styles: round_btn
                                    bg_color: 0xFF7EB6
                                    pressed: { border_color: 0xFFFFFF, border_width: 3 }
                                    on_click: { script.execute: { id: light_sheet_swatch, hue: 330, sat: 55 } }
