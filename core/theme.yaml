lvgl:
  default_font: font_body

  # ── Theme: defaults for every widget of a type (replaces LVGL's blue) ──────
  # Avoid shadows/gradients: they are expensive to draw on the ESP32-S3.
  theme:
    button:
      bg_color: ${c_surface}
      bg_opa: COVER
      border_width: 0
      shadow_width: 0
      outline_width: 0
      radius: ${14*px}
      text_color: ${c_text}
      pressed:
        bg_color: ${c_surface_2}
    slider:
      bg_color: ${c_surface}
      bg_opa: COVER
      border_width: 0
      outline_width: 0
      radius: ${16*px}
      pad_all: 0
      indicator:
        bg_color: ${c_accent}
        bg_opa: COVER
        radius: ${16*px}
      knob:
        bg_opa: TRANSP
        border_width: 0
        shadow_width: 0
        outline_width: 0
        pad_all: 0
    bar:
      bg_color: ${c_separator}
      bg_opa: COVER
      border_width: 0
      radius: ${2*px}
      pad_all: 0
      indicator:
        bg_color: ${c_accent}
        bg_opa: COVER
        radius: ${2*px}
    switch:
      bg_color: ${c_separator}
      bg_opa: COVER
      border_width: 0
      outline_width: 0
      indicator:
        checked:
          bg_color: ${c_accent}
          bg_opa: COVER
      knob:
        bg_color: 0xFFFFFF
        bg_opa: COVER
        border_width: 0
        shadow_width: 0
    label:
      text_color: ${c_text}

  # ── Reusable styles ────────────────────────────────────────────────────────
  style_definitions:
    # Plain full-size black background, no chrome
    - id: container
      bg_color: ${c_bg}
      bg_opa: COVER
      border_width: 0
      outline_width: 0
      radius: 0
      pad_all: 0
    # Invisible layout box
    - id: transparent
      bg_opa: TRANSP
      border_width: 0
      outline_width: 0
      radius: 0
      pad_all: 0
    # Small grey uppercase heading above a group (iOS grouped-list style)
    - id: section_header
      text_font: font_caption
      text_color: ${c_text_2}
      text_letter_space: 1
    # Pill-shaped button
    - id: chip
      radius: ${24*px}
      pad_all: 0
    # Fully round button
    - id: round_btn
      radius: 999
      pad_all: 0
    # Icon-only button with no background until pressed
    - id: icon_btn
      bg_opa: TRANSP
      radius: 999
      pad_all: 0
    # Rounded frame that clips artwork to its corners
    - id: art_frame
      bg_color: ${c_surface}
      bg_opa: COVER
      border_width: 0
      radius: ${12*px}
      pad_all: 0
      clip_corner: true
    # Grouped card (settings)
    - id: card
      bg_color: ${c_surface}
      bg_opa: COVER
      border_width: 0
      radius: ${14*px}
      pad_all: 0
