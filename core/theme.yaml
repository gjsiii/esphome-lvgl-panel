# Core: look & feel — palette, fonts, LVGL theme and reusable styles.
#
# Palette values are defaults; a device file can override any of them in its
# own `substitutions:` block.

substitutions:
  # ── UI palette (iOS/Android-style dark, neutral accent) ────────────────────
  c_bg: "0x000000"          # screen background
  c_surface: "0x1C1C1E"     # cards, buttons, slider tracks
  c_surface_2: "0x2C2C2E"   # pressed state, selected tab, inner circles
  c_separator: "0x38383A"   # hairlines, progress track
  c_text: "0xFFFFFF"        # primary text / icons
  c_text_2: "0x8E8E93"      # secondary text, captions, unselected tabs
  c_accent: "0xF2F2F7"      # slider fill, progress, play button, "Done"
  c_on_accent: "0x000000"   # icons/text drawn on the accent color
  c_selected: "0x636366"    # selected segment in a segmented control
  # The slider/progress/switch color is a user setting (core/settings.yaml);
  # c_accent is its default and the color of "Done" and the play button.

font:
  # ── Text (Inter: closest open font to SF Pro / Roboto) ─────────────────────
  - file: "gfonts://Inter@500"
    id: font_caption
    size: ${13*px//1}
    bpp: 4
    glyphsets: [GF_Latin_Core]

  - file: "gfonts://Inter@500"
    id: font_body
    size: ${16*px}
    bpp: 4
    glyphsets: [GF_Latin_Core]

  - file: "gfonts://Inter@600"
    id: font_title
    size: ${20*px}
    bpp: 4
    glyphsets: [GF_Latin_Core]

  - file: "gfonts://Inter@600"
    id: font_time
    size: ${22*px}
    bpp: 4
    glyphs: "0123456789:-apm"

  # Night clock: very large, thin digits
  - file: "gfonts://Inter@200"
    id: font_clock_xl
    size: ${120*px}
    bpp: 4
    glyphs: "0123456789:"

  # Weather sheet: big current temperature; snow report: big inches
  - file: "gfonts://Inter@300"
    id: font_temp_xl
    size: ${72*px}
    bpp: 4
    glyphs: "0123456789-°.\""

  # ── Icons (Material Design Icons) ──────────────────────────────────────────
  - file: https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf
    id: icons_sm
    size: ${22*px}
    bpp: 4
    glyphs: [
        "\U000F0493", # mdi-cog
        "\U000F05A9", # mdi-wifi
        "\U000F05AA", # mdi-wifi-off (HA disconnected)
        "\U000F0F54", # mdi-home-thermometer (climate readout)
        "\U000F0717", # mdi-snowflake (snow report chip)
        "\U000F0369", # mdi-message-text (sleep message, features/sleep_notes.yaml)
        "\U000F00EB", # mdi-cake-variant (birthday, features/sleep_notes.yaml)
        # Weather conditions (HA weather states)
        "\U000F0599", # mdi-weather-sunny            sunny
        "\U000F0594", # mdi-weather-night            clear-night
        "\U000F0595", # mdi-weather-partly-cloudy    partlycloudy
        "\U000F0590", # mdi-weather-cloudy           cloudy
        "\U000F0591", # mdi-weather-fog              fog
        "\U000F0592", # mdi-weather-hail             hail
        "\U000F0593", # mdi-weather-lightning        lightning
        "\U000F067E", # mdi-weather-lightning-rainy  lightning-rainy
        "\U000F0596", # mdi-weather-pouring          pouring
        "\U000F0597", # mdi-weather-rainy            rainy
        "\U000F0598", # mdi-weather-snowy            snowy
        "\U000F067F", # mdi-weather-snowy-rainy      snowy-rainy
        "\U000F059D", # mdi-weather-windy            windy
        "\U000F059E", # mdi-weather-windy-variant    windy-variant
        "\U000F05D6", # mdi-alert-circle-outline     exceptional
