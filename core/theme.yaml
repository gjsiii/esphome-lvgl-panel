  - file: https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf
    id: icons_md
    size: ${28*px}
    bpp: 4
    glyphs: [
        "\U000F02DC", # mdi-home
        "\U000F0731", # mdi-arrow-left
        "\U000F0425", # mdi-power
        "\U000F040E", # mdi-play-pause
        "\U000F075F", # mdi-volume-mute
        "\U000F075E", # mdi-volume-minus
        "\U000F075D", # mdi-volume-plus
        "\U000F00DE", # mdi-brightness-5 (low)
        "\U000F00E0", # mdi-brightness-7 (high)
        "\U000F0374", # mdi-minus
        "\U000F0415", # mdi-plus
        "\U000F0D38", # mdi-speaker-multiple
        "\U000F04C3", # mdi-speaker
        "\U000F012C", # mdi-check
        "\U000F0B5C", # mdi-backspace-outline (PIN keypad)
        "\U000F0AE0", # mdi-spray-bottle (cleaning mode)
        "\U000F0717", # mdi-snowflake (snow report)
