# Core: user settings — slider color, screen timing, clock format, media tabs.
#
# Each setting is an ESPHome entity, so it's saved on the panel (survives
# reboots), editable on the panel's Settings sheet, and editable from Home
# Assistant (the device's Configuration section).
#
# The slider color is an RGB "light" entity named "Slider Color", so HA shows
# its color wheel and brightness slider (brightness = how light/dark the color
# is; white at 55% is a medium grey). Turning it off restores the default.
#
# Defaults can be changed per display with substitutions:
#   default_dim_after: "30 s"    # 15 s, 30 s, 1 min, 2 min, Never
#   default_off_after: "5 min"   # 1 min, 5 min, 10 min, 30 min, Never
#   default_sleep_screen: "Blank"  # Blank, Clock, Red clock
#   night_clock_brightness: "0.25"

substitutions:
  default_dim_after: "30 s"
  default_off_after: "5 min"
  default_sleep_screen: "Blank"      # Blank, Clock, Red clock
  # Backlight while the night clock shows. The backlight is gamma-corrected
  # (2.8), so this is perceived level: 0.25 is about as bright as the dim level;
  # below ~0.15 the LEDs barely light.
  night_clock_brightness: "0.25"

globals:
  # Set at the end of boot; settings only touch widgets after this
  - id: ui_ready
    type: bool
    initial_value: "false"
  # Current slider color (0xRRGGBB) and a guard for programmatic slider moves
  - id: accent_rgb
    type: uint32_t
    initial_value: "${c_accent}"
  - id: accent_ui_update
    type: bool
    initial_value: "false"
  - id: dim_after_ms
    type: uint32_t
    initial_value: "30000"
  - id: off_after_ms
    type: uint32_t
    initial_value: "300000"
  # Night mode: currently inside the night window, and the brightness cap
  - id: night_now
    type: bool
    initial_value: "false"
  - id: night_level
    type: float
    initial_value: "0.30"
  # PIN lock: digits typed so far, keypad mode (0 = unlock, 1 = choose new),
  # and whether Settings was unlocked since the screen last dimmed
  - id: pin_entry
    type: std::string
    initial_value: '""'
  - id: pin_mode
    type: int
    initial_value: "0"
  - id: settings_unlocked
    type: bool
    initial_value: "false"

# ── Slider color: an RGB light that only stores a color (no hardware) ────────
output:
  - platform: template
    id: accent_out_r
    type: float
    write_action:
      - lambda: "(void) state;"
  - platform: template
    id: accent_out_g
    type: float
    write_action:
      - lambda: "(void) state;"
  - platform: template
    id: accent_out_b
    type: float
    write_action:
      - lambda: "(void) state;"

light:
  - platform: rgb
    id: accent_light
    name: Slider Color
    icon: mdi:palette
    entity_category: config
    red: accent_out_r
    green: accent_out_g
    blue: accent_out_b
    gamma_correct: 1.0
    default_transition_length: 0s
    restore_mode: RESTORE_DEFAULT_ON
    on_state:
      - script.execute: accent_changed

# Settings PIN (4 digits on the panel; editable or clearable from HA)
text:
  - platform: template
    id: settings_pin
    name: Settings PIN
    icon: mdi:lock
    entity_category: config
    mode: password
    optimistic: true
    restore_value: true
    initial_value: ""
    min_length: 0
    max_length: 8

select:
  # Color of a slider's name/% where the colored fill is under it.
  # Auto picks dark or white text from the slider color's brightness.
  - platform: template
    id: sel_slider_text
    name: Slider Text Color
    icon: mdi:format-color-text
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Auto"
    options: ["Auto", "Light", "Dark"]
    on_value:
      - script.execute: update_slider_labels
      - script.execute: sync_settings_ui

  - platform: template
    id: sel_dim_after
    name: Dim After
    icon: mdi:brightness-6
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: ${default_dim_after}
    options: ["15 s", "30 s", "1 min", "2 min", "Never"]
    on_value:
      - lambda: |-
          static const uint32_t ms[5] = {15000, 30000, 60000, 120000, 0};
          id(dim_after_ms) = ms[i < 5 ? i : 1];
      - script.execute: sync_settings_ui

  - platform: template
    id: sel_off_after
    name: Turn Off After
    icon: mdi:monitor-off
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: ${default_off_after}
    options: ["1 min", "5 min", "10 min", "30 min", "Never"]
    on_value:
      - lambda: |-
          static const uint32_t ms[5] = {60000, 300000, 600000, 1800000, 0};
          id(off_after_ms) = ms[i < 5 ? i : 1];
      - script.execute: sync_settings_ui

  # What the screen shows when it "turns off": nothing, or a dim night clock
  - platform: template
    id: sel_sleep_screen
    name: Sleep Screen
    icon: mdi:clock-time-four-outline
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: ${default_sleep_screen}
    options: ["Blank", "Clock", "Red clock"]
    on_value:
      - script.execute: sync_settings_ui

  # ── Night mode window and brightness cap ──────────────────────────────────
  - platform: template
    id: sel_night_start
    name: Night Starts
    icon: mdi:weather-night
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "10 PM"
    options: ["8 PM", "9 PM", "10 PM", "11 PM", "12 AM"]
    on_value:
      - script.execute: night_check
      - script.execute: sync_settings_ui

  - platform: template
    id: sel_night_end
    name: Night Ends
    icon: mdi:weather-sunset-up
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "6 AM"
    options: ["5 AM", "6 AM", "7 AM", "8 AM", "9 AM"]
    on_value:
      - script.execute: night_check
      - script.execute: sync_settings_ui

  - platform: template
    id: sel_night_level
    name: Night Brightness
    icon: mdi:brightness-4
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "30%"
    options: ["20%", "30%", "45%"]
    on_value:
      - lambda: |-
          static const float lv[3] = {0.20f, 0.30f, 0.45f};
          id(night_level) = lv[i < 3 ? i : 1];
      - script.execute: night_check
      - script.execute: sync_settings_ui

switch:
  # Settings need the PIN (when a PIN is set)
  - platform: template
    id: sw_pin_lock
    name: Settings PIN Lock
    icon: mdi:lock
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - script.execute: sync_settings_ui
    on_turn_off:
      - script.execute: sync_settings_ui

  # Night mode: inside the window, brightness is capped and the panel sleeps
  # to the red night clock
  - platform: template
    id: sw_night
    name: Night Mode
    icon: mdi:weather-night
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - script.execute: night_check
      - script.execute: sync_settings_ui
    on_turn_off:
      - script.execute: night_check
      - script.execute: sync_settings_ui

  - platform: template
    id: sw_clock_24h
    name: 24-Hour Clock
    icon: mdi:clock-digital
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - script.execute: update_clock
      - script.execute: sync_settings_ui
    on_turn_off:
      - script.execute: update_clock
      - script.execute: sync_settings_ui

  - platform: template
    id: sw_auto_media_tabs
    name: Auto-Open TV & Music
    icon: mdi:television-play
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - script.execute: sync_settings_ui
    on_turn_off:
      - script.execute: sync_settings_ui

  # Messages from HA wake the screen to the Settings brightness (on) or to
  # the dim level (off)
  - platform: template
    id: sw_msg_full
    name: Messages Wake at Full Brightness
    icon: mdi:message-alert
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - script.execute: sync_settings_ui
    on_turn_off:
      - script.execute: sync_settings_ui

script:
  # Paint the slider color onto every slider, progress bar and switch, and
  # the preview dot in Settings.
  - id: apply_accent
    mode: restart
    then:
      - if:
          condition:
            lambda: "return id(ui_ready);"
          then:
            - lambda: |-
                lv_color_t c = lv_color_hex(id(accent_rgb));
                std::function<void(lv_obj_t *)> paint = [&](lv_obj_t *o) {
                  if (lv_obj_check_type(o, &lv_slider_class) || lv_obj_check_type(o, &lv_bar_class))
                    lv_obj_set_style_bg_color(o, c, LV_PART_INDICATOR);
                  if (lv_obj_check_type(o, &lv_switch_class))
                    lv_obj_set_style_bg_color(o, c, (lv_style_selector_t) LV_PART_INDICATOR | LV_STATE_CHECKED);
                  uint32_t n = lv_obj_get_child_cnt(o);
                  for (uint32_t k = 0; k < n; k++) paint(lv_obj_get_child(o, k));
                };
                paint(id(ui_root));
                lv_obj_set_style_bg_color(id(accent_preview), c, LV_PART_MAIN);

  # The Slider Color light changed (panel sliders or HA): work out the color,
  # repaint, and move the panel's Hue/Saturation/Brightness sliders to match
  # (unless a finger is on one of them).
  - id: accent_changed
    mode: restart
    then:
      - lambda: |-
          auto v = id(accent_light).remote_values;
          if (!v.is_on()) {
            id(accent_rgb) = ${c_accent};
          } else {
            float b = v.get_brightness();
            uint32_t r = lroundf(v.get_red() * b * 255.0f);
            uint32_t g = lroundf(v.get_green() * b * 255.0f);
            uint32_t bl = lroundf(v.get_blue() * b * 255.0f);
            id(accent_rgb) = (r << 16) | (g << 8) | bl;
          }
          if (!id(ui_ready)) return;
          if (lv_obj_has_state(id(slider_hue), LV_STATE_PRESSED) ||
              lv_obj_has_state(id(slider_sat), LV_STATE_PRESSED) ||
              lv_obj_has_state(id(slider_bri), LV_STATE_PRESSED)) return;
          // RGB (max channel 1.0) + brightness -> hue/saturation/brightness
          float r = v.get_red(), g = v.get_green(), bl = v.get_blue();
          float mx = std::max(r, std::max(g, bl)), mn = std::min(r, std::min(g, bl));
          float d = mx - mn, sat = mx > 0 ? d / mx : 0, hue = 0;
          if (d > 0.001f) {
            if (mx == r) hue = 60.0f * fmodf((g - bl) / d, 6.0f);
            else if (mx == g) hue = 60.0f * ((bl - r) / d + 2.0f);
            else hue = 60.0f * ((r - g) / d + 4.0f);
            if (hue < 0) hue += 360.0f;
          }
          id(accent_ui_update) = true;
          if (sat > 0.01f) lv_slider_set_value(id(slider_hue), lroundf(hue), LV_ANIM_OFF);
          lv_slider_set_value(id(slider_sat), lroundf(sat * 100.0f), LV_ANIM_OFF);
          lv_slider_set_value(id(slider_bri), v.is_on() ? lroundf(v.get_brightness() * 100.0f) : 100, LV_ANIM_OFF);
          id(accent_ui_update) = false;
      - script.execute: update_hsb_tracks
      - script.execute: apply_accent
      - script.execute: update_slider_labels

  # Light/fan slider labels: text over the colored fill gets a contrasting
  # color (per the Slider Text Color setting); text over the dark track stays
  # secondary grey. Runs when a slider moves or the color/setting changes.
  - id: update_slider_labels
    mode: restart
    then:
      - if:
          condition:
            lambda: "return id(ui_ready);"
          then:
            - lambda: |-
                uint32_t a = id(accent_rgb);
                float lum = (0.2126f * ((a >> 16) & 0xFF) + 0.7152f * ((a >> 8) & 0xFF) +
                             0.0722f * (a & 0xFF)) / 255.0f;
                auto mode = id(sel_slider_text).active_index();
                size_t m = mode.has_value() ? *mode : 0;   // 0 Auto, 1 Light, 2 Dark
                bool dark = (m == 2) || (m == 0 && lum > 0.55f);
                lv_color_t on_fill = lv_color_hex(dark ? 0x1C1C1E : 0xFFFFFF);
                lv_color_t on_track = lv_color_hex(${c_text_2});
                // Each row in lights_list: child 0 = slider, then its labels
                uint32_t rows = lv_obj_get_child_cnt(id(lights_list));
                for (uint32_t r = 0; r < rows; r++) {
                  lv_obj_t *row = lv_obj_get_child(id(lights_list), r);
                  lv_obj_t *sl = lv_obj_get_child(row, 0);
                  if (!sl || !lv_obj_check_type(sl, &lv_slider_class)) continue;
                  int32_t w = lv_obj_get_width(sl);
                  int32_t mn = lv_slider_get_min_value(sl), mx = lv_slider_get_max_value(sl);
                  int32_t fill = mx > mn ? (int32_t) ((int64_t) (lv_slider_get_value(sl) - mn) * w / (mx - mn)) : 0;
                  uint32_t n = lv_obj_get_child_cnt(row);
                  for (uint32_t k = 1; k < n; k++) {
                    lv_obj_t *lbl = lv_obj_get_child(row, k);
                    int32_t cx = lv_obj_get_x(lbl) + lv_obj_get_width(lbl) / 2;
                    lv_obj_set_style_text_color(lbl, cx < fill ? on_fill : on_track, LV_PART_MAIN);
                  }
                }

  # Saturation track: white -> hue; Brightness track: black -> hue+saturation
  - id: update_hsb_tracks
    mode: restart
    then:
      - if:
          condition:
            lambda: "return id(ui_ready);"
          then:
            - lambda: |-
                int h = lv_slider_get_value(id(slider_hue));
                int s = lv_slider_get_value(id(slider_sat));
                lv_obj_set_style_bg_grad_color(id(slider_sat), lv_color_hsv_to_rgb(h, 100, 100), LV_PART_MAIN);
                lv_obj_set_style_bg_grad_color(id(slider_bri), lv_color_hsv_to_rgb(h, s, 100), LV_PART_MAIN);

  # A panel HSB slider moved: send the color to the Slider Color light
  - id: set_accent_from_sliders
    mode: restart
    then:
      - if:
          condition:
            lambda: "return id(ui_ready) && !id(accent_ui_update);"
          then:
            - script.execute: update_hsb_tracks
            - lambda: |-
                int h = lv_slider_get_value(id(slider_hue));
                int s = lv_slider_get_value(id(slider_sat));
                int b = lv_slider_get_value(id(slider_bri));
                lv_color_t c = lv_color_hsv_to_rgb(h, s, 100);
                auto call = id(accent_light).turn_on();
                call.set_rgb(c.red / 255.0f, c.green / 255.0f, c.blue / 255.0f);
                call.set_brightness(std::max(b, 1) / 100.0f);
                call.set_transition_length(0);
                call.perform();

  # Make the Settings sheet's segments and switches match the saved values.
  - id: sync_settings_ui
    mode: restart
    then:
      - if:
          condition:
            lambda: "return id(ui_ready);"
          then:
            - lambda: |-
                auto mark = [](lv_obj_t **btns, int count, optional<size_t> sel) {
                  for (int k = 0; k < count; k++) {
                    if (sel.has_value() && (size_t) k == *sel) lv_obj_add_state(btns[k], LV_STATE_CHECKED);
                    else lv_obj_clear_state(btns[k], LV_STATE_CHECKED);
                  }
                };
                lv_obj_t *dim[5] = {id(seg_dim_0), id(seg_dim_1), id(seg_dim_2), id(seg_dim_3), id(seg_dim_4)};
                lv_obj_t *off[5] = {id(seg_off_0), id(seg_off_1), id(seg_off_2), id(seg_off_3), id(seg_off_4)};
                lv_obj_t *txt[3] = {id(seg_txt_0), id(seg_txt_1), id(seg_txt_2)};
                mark(txt, 3, id(sel_slider_text).active_index());
                mark(dim, 5, id(sel_dim_after).active_index());
                lv_obj_t *slp[3] = {id(seg_sleep_0), id(seg_sleep_1), id(seg_sleep_2)};
                mark(slp, 3, id(sel_sleep_screen).active_index());
                lv_obj_t *ns[5] = {id(seg_nstart_0), id(seg_nstart_1), id(seg_nstart_2), id(seg_nstart_3), id(seg_nstart_4)};
                mark(ns, 5, id(sel_night_start).active_index());
                lv_obj_t *ne[5] = {id(seg_nend_0), id(seg_nend_1), id(seg_nend_2), id(seg_nend_3), id(seg_nend_4)};
                mark(ne, 5, id(sel_night_end).active_index());
                lv_obj_t *nl[3] = {id(seg_nlevel_0), id(seg_nlevel_1), id(seg_nlevel_2)};
                mark(nl, 3, id(sel_night_level).active_index());
                if (id(sw_night).state) lv_obj_add_state(id(lv_sw_night), LV_STATE_CHECKED);
                else lv_obj_clear_state(id(lv_sw_night), LV_STATE_CHECKED);
                if (id(sw_pin_lock).state && !id(settings_pin).state.empty()) lv_obj_add_state(id(lv_sw_pin_lock), LV_STATE_CHECKED);
                else lv_obj_clear_state(id(lv_sw_pin_lock), LV_STATE_CHECKED);
                mark(off, 5, id(sel_off_after).active_index());
                if (id(sw_clock_24h).state) lv_obj_add_state(id(lv_sw_clock_24h), LV_STATE_CHECKED);
                else lv_obj_clear_state(id(lv_sw_clock_24h), LV_STATE_CHECKED);
                if (id(sw_auto_media_tabs).state) lv_obj_add_state(id(lv_sw_auto_media), LV_STATE_CHECKED);
                else lv_obj_clear_state(id(lv_sw_auto_media), LV_STATE_CHECKED);
                if (id(sw_msg_full).state) lv_obj_add_state(id(lv_sw_msg_full), LV_STATE_CHECKED);
                else lv_obj_clear_state(id(lv_sw_msg_full), LV_STATE_CHECKED);

  # Is it night? On entering or leaving the window, apply the brightness
  # change to an awake screen and recolor a showing night clock.
  - id: night_check
    mode: restart
    then:
      - lambda: |-
          bool was = id(night_now);
          bool now = false;
          auto t = id(ha_time).now();
          if (id(sw_night).state && t.is_valid()) {
            static const int starts[5] = {20, 21, 22, 23, 0};
            static const int ends[5] = {5, 6, 7, 8, 9};
            int s = starts[id(sel_night_start).active_index().value_or(2)];
            int e = ends[id(sel_night_end).active_index().value_or(1)];
            int h = t.hour;
            now = (s > e) ? (h >= s || h < e) : (h >= s && h < e);
          }
          id(night_now) = now;
          if (now == was || !id(ui_ready)) return;
          ESP_LOGI("night", "Night mode %s", now ? "started" : "ended");
          // Awake screen: ease to the night cap, or back to the Settings brightness
          if (id(screen_state) == 0) {
            auto call = id(display_backlight).turn_on();
            call.set_brightness(now ? std::min(id(user_brightness), id(night_level)) : id(user_brightness));
            call.set_transition_length(2000);
            call.perform();
          }
          if (id(screen_state) == 3) {
            bool red = now || id(sel_sleep_screen).active_index().value_or(0) == 2;
            lv_color_t c = lv_color_hex(red ? 0xFF3B30 : 0xFFFFFF);
            lv_obj_set_style_text_color(id(lbl_night_time), c, LV_PART_MAIN);
            lv_obj_set_style_text_color(id(lbl_night_date), c, LV_PART_MAIN);
          }

  # Gear tapped: open Settings, or the PIN keypad if Settings is locked
  - id: open_settings
    then:
      - lambda: |-
          bool locked = id(sw_pin_lock).state && !id(settings_pin).state.empty() && !id(settings_unlocked);
          if (locked) {
            id(pin_mode) = 0;
            id(pin_entry) = "";
            lv_label_set_text(id(lbl_pin_title), "Enter PIN");
            lv_obj_add_flag(id(lbl_pin_msg), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(pin_panel), LV_OBJ_FLAG_HIDDEN);
            lv_obj_move_foreground(id(pin_panel));
          } else {
            lv_obj_clear_flag(id(settings_panel), LV_OBJ_FLAG_HIDDEN);
            lv_obj_move_foreground(id(settings_panel));
          }
      - script.execute: pin_dots

  # "Lock settings with PIN" switched on in Settings: choose a new PIN
  - id: pin_choose
    then:
      - lambda: |-
          id(pin_mode) = 1;
          id(pin_entry) = "";
          lv_label_set_text(id(lbl_pin_title), "Choose a 4-digit PIN");
          lv_obj_add_flag(id(lbl_pin_msg), LV_OBJ_FLAG_HIDDEN);
          lv_obj_clear_flag(id(pin_panel), LV_OBJ_FLAG_HIDDEN);
          lv_obj_move_foreground(id(pin_panel));
      - script.execute: pin_dots

  # Keypad: 0-9 digits, 10 = delete, 11 = cancel
  - id: pin_key
    parameters:
      k: int
    then:
      - lambda: |-
          if (k == 11) {                       // cancel
            lv_obj_add_flag(id(pin_panel), LV_OBJ_FLAG_HIDDEN);
            id(pin_entry) = "";
            id(sync_settings_ui).execute();    // un-tick the switch if choosing was cancelled
            return;
          }
          if (k == 10) { if (!id(pin_entry).empty()) id(pin_entry).pop_back(); }
          else if (id(pin_entry).size() < 4) id(pin_entry) += (char) ('0' + k);
          lv_obj_add_flag(id(lbl_pin_msg), LV_OBJ_FLAG_HIDDEN);
          if (id(pin_entry).size() < 4) { id(pin_dots).execute(); return; }
          if (id(pin_mode) == 1) {             // new PIN chosen
            auto call = id(settings_pin).make_call();
            call.set_value(id(pin_entry));
            call.perform();
            id(sw_pin_lock).turn_on();
            id(settings_unlocked) = true;
            lv_obj_add_flag(id(pin_panel), LV_OBJ_FLAG_HIDDEN);
          } else if (id(pin_entry) == id(settings_pin).state) {   // unlocked
            id(settings_unlocked) = true;
            lv_obj_add_flag(id(pin_panel), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(settings_panel), LV_OBJ_FLAG_HIDDEN);
            lv_obj_move_foreground(id(settings_panel));
          } else {                             // wrong
            lv_label_set_text(id(lbl_pin_msg), "Incorrect PIN");
            lv_obj_clear_flag(id(lbl_pin_msg), LV_OBJ_FLAG_HIDDEN);
          }
          id(pin_entry) = "";
          id(pin_dots).execute();

  # Fill one dot per digit typed
  - id: pin_dots
    then:
      - lambda: |-
          lv_obj_t *d[4] = {id(pin_dot_0), id(pin_dot_1), id(pin_dot_2), id(pin_dot_3)};
          for (size_t k = 0; k < 4; k++)
            lv_obj_set_style_bg_opa(d[k], k < id(pin_entry).size() ? LV_OPA_COVER : LV_OPA_TRANSP, LV_PART_MAIN);

  # Cleaning mode: a full-screen cover on the top layer swallows every touch
  # for 30 s (with a countdown) so the screen can be wiped.
  - id: cleaning_mode
    mode: restart
    then:
      - lambda: |-
          lv_obj_add_flag(id(settings_panel), LV_OBJ_FLAG_HIDDEN);
          lv_obj_clear_flag(id(clean_overlay), LV_OBJ_FLAG_HIDDEN);
          lv_obj_move_foreground(id(clean_overlay));
      - repeat:
          count: 30
          then:
            - lambda: |-
                char buf[24];
                snprintf(buf, sizeof(buf), "%d", 30 - (int) iteration);
                lv_label_set_text(id(lbl_clean_count), buf);
                lv_disp_trig_activity(NULL);   // stay awake while cleaning
            - delay: 1s
      - lvgl.widget.hide: clean_overlay

  # Close any open sheet (Settings, Weather, ...): every child of ui_root
  # after the status bar and the tab view.
  - id: close_sheets
    then:
      - lambda: |-
          id(settings_unlocked) = false;   // Settings relock after the screen dims
          uint32_t n = lv_obj_get_child_cnt(id(ui_root));
          for (uint32_t k = 2; k < n; k++)
            lv_obj_add_flag(lv_obj_get_child(id(ui_root), k), LV_OBJ_FLAG_HIDDEN);

esphome:
  on_boot:
    # After everything is built and placed (core/base.yaml runs at -300)
    - priority: -310
      then:
        - lambda: |-
            id(ui_ready) = true;
            lv_obj_update_layout(id(ui_root));   // label positions for update_slider_labels
        - script.execute: accent_changed
        - script.execute: sync_settings_ui
        - script.execute: update_clock

# ── Screen idle: dim, then backlight off (touch or presence wakes it) ────────
interval:
  - interval: 1s
    then:
      - if:
          condition:
            lambda: |-
              return id(ui_ready) && id(screen_state) == 0 && id(dim_after_ms) > 0 &&
                     lv_disp_get_inactive_time(NULL) >= id(dim_after_ms);
          then:
            - script.execute: close_sheets
            - light.turn_on:
                id: display_backlight
                brightness: !lambda "return std::min(${idle_dim_brightness}f, (id(night_now) ? std::min(id(user_brightness), id(night_level)) : id(user_brightness)));"
                transition_length: 1s
            - lambda: "id(screen_state) = 1;"
      # Sleep: blank (backlight off, LVGL paused) or the night clock
      - if:
          condition:
            lambda: |-
              return id(ui_ready) && id(screen_state) < 2 && id(off_after_ms) > 0 &&
                     lv_disp_get_inactive_time(NULL) >= id(off_after_ms);
          then:
            - script.execute: close_sheets
            - if:
                condition:
                  lambda: "return !id(night_now) && id(sel_sleep_screen).active_index().value_or(0) == 0;"
                then:
                  - light.turn_off:
                      id: display_backlight
                      transition_length: 1s
                  - lvgl.pause:
                  - lambda: "id(screen_state) = 2;"
                  - logger.log: "Sleep: blank screen"
                else:
                  - lambda: |-
                      bool red = id(night_now) || id(sel_sleep_screen).active_index().value_or(0) == 2;   // night: always red
                      lv_color_t c = lv_color_hex(red ? 0xFF3B30 : 0xFFFFFF);
                      lv_obj_set_style_text_color(id(lbl_night_time), c, LV_PART_MAIN);
                      lv_obj_set_style_text_color(id(lbl_night_date), c, LV_PART_MAIN);
                      lv_obj_set_style_text_opa(id(lbl_night_date), LV_OPA_70, LV_PART_MAIN);
                      lv_obj_clear_flag(id(night_clock), LV_OBJ_FLAG_HIDDEN);
                      lv_obj_move_foreground(id(night_clock));
                      id(screen_state) = 3;
                  - script.execute: update_clock
                  - logger.log: "Sleep: night clock"
                  - light.turn_on:
                      id: display_backlight
                      brightness: !lambda "return std::min(${night_clock_brightness}f, (id(night_now) ? std::min(id(user_brightness), id(night_level)) : id(user_brightness)));"
                      transition_length: 1s

  # Night window check (every 30 s and whenever a night setting changes)
  - interval: 30s
    then:
      - script.execute: night_check

button:
  # Start cleaning mode from Home Assistant (also on the panel: Settings header)
  - platform: template
    id: btn_cleaning_mode
    name: Cleaning Mode
    icon: mdi:spray-bottle
    on_press:
      - script.execute: cleaning_mode
