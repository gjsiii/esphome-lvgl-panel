# Core: network, Home Assistant API and OTA updates.
#
# Credentials come from the device file as substitutions (normally !secret),
# because a `!secret` inside a GitHub package would be looked up in the
# downloaded repo instead of on the house's Home Assistant:
#
#   substitutions:
#     api_key: !secret my_display_api_key
#     ota_password: !secret my_display_ota_password   # optional
#     wifi_ssid: !secret wifi_ssid
#     wifi_password: !secret wifi_password
#     ap_password: !secret my_display_ap_password     # fallback hotspot, 8+ chars

substitutions:
  ota_password: ""   # no OTA password unless the device file sets one

api:
  encryption:
    key: ${api_key}

# Status bar: Wi-Fi icon while Home Assistant is connected, red Wi-Fi-off when
# not. Polled because other API clients (e.g. the ESPHome log viewer) also
# connect and disconnect; only HA subscribes to states.
interval:
  - interval: 5s
    then:
      - if:
          condition:
            api.connected:
              state_subscription_only: true
          then:
            - lvgl.label.update:
                id: lbl_hastatus
                text: "\U000F05A9" # mdi-wifi
                text_color: ${c_text_2}
          else:
            - lvgl.label.update:
                id: lbl_hastatus
                text: "\U000F05AA" # mdi-wifi-off
                text_color: 0xFF453A

ota:
  - platform: esphome
    password: ${ota_password}
    on_begin: # prevent screen flickering during OTA
      - light.turn_off:
          id: display_backlight
          transition_length: 0s
      - lambda: "id(display_backlight).loop();"

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}
  # Fallback hotspot (captive portal) if Wi-Fi can't connect
  ap:
    password: ${ap_password}
