# Tab: Favorites from Music Assistant. Your MA favorites (playlists, radio
# stations, albums and artists) as an artwork grid with category chips. It
# follows Music Assistant: favorite something there and it appears here,
# no reinstall. Tap a tile to play it on the room's player.
#
#   tab_favorites: !include
#     file: panel/tabs/ma_favorites.yaml
#     vars:
#       tab_position: 4
#       music_player: media_player.kitchen          # MA player to play on
#       ma_url: "http://192.168.0.10:8095"          # Music Assistant (for artwork)
#       # favorites_entity: sensor.panel_ma_favorites   # optional (default)
#
# Needs ha/panel_ma_favorites.yaml in Home Assistant (same release: its short
# "cat|name|uri|art" codes are expanded here). Up to 36 favorites, on every
# board. Artwork comes one tile at a time through the shared art loader
# (core/images.yaml) and each tile keeps a copy in PSRAM (about 40 KB per
# tile on 480x480, 90 KB on 720x720). The tiles are built at boot with one
# tap handler for all, and the list is kept only once (the HA text), so the
# tab needs little internal RAM.
#
# Shuffle (the icon next to the chips) applies to playlists, albums and
# artists; radio never shuffles. The refresh icon asks HA to re-read the
# favorites right away (they are also re-read every 15 minutes).

defaults:
  favorites_entity: sensor.panel_ma_favorites

globals:
  # Per tile, from the HA text (maf_items): category code (p r a t, 0 =
  # none), where the URI and the artwork sit in the text (offset << 16 |
  # length), and a hash of the artwork wanted / last asked for
  - id: maf_cat
    type: std::vector<char>
    initial_value: "std::vector<char>(36, 0)"
  - id: maf_uri
    type: std::vector<uint32_t>
    initial_value: "std::vector<uint32_t>(36, 0)"
  - id: maf_art
    type: std::vector<uint32_t>
    initial_value: "std::vector<uint32_t>(36, 0)"
  - id: maf_want
    type: std::vector<uint32_t>
    initial_value: "std::vector<uint32_t>(36, 0)"
  - id: maf_have
    type: std::vector<uint32_t>
    initial_value: "std::vector<uint32_t>(36, 0)"
  - id: maf_count
    type: int
    initial_value: "0"
  # Widgets by tile (built at boot) and each tile's artwork (PSRAM copy)
  - id: maf_tiles
    type: std::vector<lv_obj_t *>
    initial_value: "std::vector<lv_obj_t *>(36, nullptr)"
  - id: maf_names
    type: std::vector<lv_obj_t *>
    initial_value: "std::vector<lv_obj_t *>(36, nullptr)"
  - id: maf_arts
    type: std::vector<lv_obj_t *>
    initial_value: "std::vector<lv_obj_t *>(36, nullptr)"
  - id: maf_dscs
    type: std::vector<lv_image_dsc_t *>
    initial_value: "std::vector<lv_image_dsc_t *>(36, nullptr)"
  # Tile whose artwork is being fetched (-1: none)
  - id: maf_loading
    type: int
    initial_value: "-1"
  # Chip filter: 0 All, 1 Playlists, 2 Radio, 3 Albums, 4 Artists
  - id: maf_filter
    type: int
    initial_value: "0"
  - id: maf_ready
    type: bool
    initial_value: "false"
  - id: maf_shuffle
    type: bool
    restore_value: true
    initial_value: "true"

esphome:
  on_boot:
    - priority: -10${tab_position}
      then:
        - lambda: |-
            lv_obj_t *tab = lv_tabview_add_tab(id(main_tabview), "Favorites");
            lv_obj_set_style_pad_all(tab, 0, 0);
            lv_obj_set_scrollbar_mode(tab, LV_SCROLLBAR_MODE_OFF);
            lv_obj_set_parent(id(content_maf), tab);
            lv_obj_t *grid = id(maf_grid);
            lv_obj_set_layout(grid, LV_LAYOUT_FLEX);
            lv_obj_set_flex_flow(grid, LV_FLEX_FLOW_ROW_WRAP);
            lv_obj_set_flex_align(grid, LV_FLEX_ALIGN_START, LV_FLEX_ALIGN_START, LV_FLEX_ALIGN_START);
            lv_obj_set_style_pad_row(grid, ${(12*px)|int}, 0);
            lv_obj_set_style_pad_column(grid, ${(18*px)|int}, 0);
            // 36 tiles: artwork frame (music note until the art arrives) and
            // a caption; one tap handler for all, the tile number in user_data
            const lv_font_t *note = id(maf_note)->get_lv_font();
            const lv_font_t *caption = id(font_caption)->get_lv_font();
            for (int i = 0; i < 36; i++) {
              lv_obj_t *tile = lv_button_create(grid);
              lv_obj_set_size(tile, ${(140*px)|int}, ${(172*px)|int});
              lv_obj_set_style_bg_opa(tile, LV_OPA_TRANSP, LV_PART_MAIN);
              lv_obj_set_style_pad_all(tile, 0, LV_PART_MAIN);
              lv_obj_set_style_bg_color(tile, lv_color_hex(${c_surface}), LV_PART_MAIN | LV_STATE_PRESSED);
              lv_obj_set_style_bg_opa(tile, LV_OPA_COVER, LV_PART_MAIN | LV_STATE_PRESSED);
              lv_obj_add_flag(tile, LV_OBJ_FLAG_HIDDEN);
              lv_obj_t *frame = lv_obj_create(tile);
              lv_obj_add_style(frame, id(art_frame), LV_PART_MAIN);
              lv_obj_set_size(frame, ${(140*px)|int}, ${(140*px)|int});
              lv_obj_align(frame, LV_ALIGN_TOP_MID, 0, 0);
              lv_obj_clear_flag(frame, LV_OBJ_FLAG_CLICKABLE);
              lv_obj_clear_flag(frame, LV_OBJ_FLAG_SCROLLABLE);
              lv_obj_t *ph = lv_label_create(frame);
              lv_label_set_text(ph, "\U000F075A");   // mdi-music
              lv_obj_set_style_text_font(ph, note, LV_PART_MAIN);
              lv_obj_set_style_text_color(ph, lv_color_hex(${c_text_2}), LV_PART_MAIN);
              lv_obj_center(ph);
              lv_obj_t *img = lv_image_create(frame);
              lv_obj_center(img);
              lv_obj_add_flag(img, LV_OBJ_FLAG_HIDDEN);
              lv_obj_t *name = lv_label_create(tile);
              lv_label_set_text(name, "");
              lv_obj_set_style_text_font(name, caption, LV_PART_MAIN);
              lv_obj_set_style_text_color(name, lv_color_hex(${c_text}), LV_PART_MAIN);
              lv_obj_set_style_text_align(name, LV_TEXT_ALIGN_CENTER, LV_PART_MAIN);
              lv_label_set_long_mode(name, LV_LABEL_LONG_DOT);
              lv_obj_set_width(name, ${(136*px)|int});
              lv_obj_align(name, LV_ALIGN_TOP_MID, 0, ${(148*px)|int});
              lv_obj_add_event_cb(tile, [](lv_event_t *e) {
                id(maf_play)->execute((int) (intptr_t) lv_event_get_user_data(e));
              }, LV_EVENT_CLICKED, (void *) (intptr_t) i);
              id(maf_tiles)[i] = tile;
              id(maf_arts)[i] = img;
              id(maf_names)[i] = name;
            }
        - script.execute: maf_shuffle_show
        - script.execute: maf_apply
        # The list may have arrived before the tab was built
        - script.execute: maf_parse

text_sensor:
  - platform: homeassistant
    id: maf_items
    entity_id: ${favorites_entity}
    attribute: items
    on_value:
      - script.execute: maf_parse

script:
  # "cat|name|uri|art;…" → tiles (names go straight to the labels; URIs and
  # artwork stay in the HA text, found by offset)
  - id: maf_parse
    then:
      - lambda: |-
          if (id(maf_tiles)[0] == nullptr) return;
          const std::string &x = id(maf_items).state;
          if (x.empty()) return;
          auto pos = [](size_t off, size_t len) -> uint32_t {
            return off < 65536 && len < 65536 ? (uint32_t) (off << 16 | len) : 0;
          };
          int n = 0;
          size_t p = 0;
          while (p < x.size() && n < 36) {
            size_t e = x.find(';', p);
            if (e == std::string::npos) e = x.size();
            size_t a = x.find('|', p), b = std::string::npos, c = std::string::npos;
            if (a < e) b = x.find('|', a + 1);
            if (b < e) c = x.find('|', b + 1);
            if (c < e) {
              // Category: p r a t (older HA packages sent the full word)
              std::string cat = x.substr(p, a - p);
              char code = cat == "playlist" ? 'p' : cat == "radio" ? 'r' : cat == "album" ? 'a'
                        : cat == "artist" ? 't' : (cat.size() == 1 ? cat[0] : 0);
              id(maf_cat)[n] = code;
              std::string nm = x.substr(a + 1, b - a - 1);
              lv_label_set_text(id(maf_names)[n], nm.c_str());
              id(maf_uri)[n] = pos(b + 1, c - b - 1);
              id(maf_art)[n] = pos(c + 1, e - c - 1);
              // FNV-1a of the artwork text: a changed picture is fetched again
              uint32_t h = 2166136261u;
              for (size_t k = c + 1; k < e; k++) h = (h ^ (uint8_t) x[k]) * 16777619u;
              if (e == c + 1) h = 0;
              if (h != id(maf_want)[n]) {
                id(maf_want)[n] = h;
                // New artwork: the placeholder until it arrives
                lv_obj_add_flag(id(maf_arts)[n], LV_OBJ_FLAG_HIDDEN);
                lv_obj_clear_flag(lv_obj_get_child(lv_obj_get_parent(id(maf_arts)[n]), 0), LV_OBJ_FLAG_HIDDEN);
              }
              n++;
            }
            p = e + 1;
          }
          for (int i = n; i < 36; i++) { id(maf_cat)[i] = 0; id(maf_want)[i] = 0; }
          id(maf_count) = n;
          id(maf_ready) = true;
      - script.execute: maf_apply
      - script.execute: maf_load_next

  # Show the tiles for the selected chip; hide chips with nothing in them
  - id: maf_apply
    then:
      - lambda: |-
          if (id(maf_tiles)[0] == nullptr) return;
          static const char codes[5] = {0, 'p', 'r', 'a', 't'};
          int n = id(maf_count);
          int counts[5] = {n, 0, 0, 0, 0};
          for (int i = 0; i < n; i++)
            for (int k = 1; k < 5; k++)
              if (id(maf_cat)[i] == codes[k]) counts[k]++;
          if (id(maf_filter) > 0 && counts[id(maf_filter)] == 0) id(maf_filter) = 0;
          int f = id(maf_filter);
          for (int i = 0; i < 36; i++) {
            bool show = i < n && (f == 0 || id(maf_cat)[i] == codes[f]);
            if (show) lv_obj_clear_flag(id(maf_tiles)[i], LV_OBJ_FLAG_HIDDEN);
            else lv_obj_add_flag(id(maf_tiles)[i], LV_OBJ_FLAG_HIDDEN);
          }
          lv_obj_t *chips[5] = {id(maf_chip_0), id(maf_chip_1), id(maf_chip_2), id(maf_chip_3), id(maf_chip_4)};
          for (int k = 0; k < 5; k++) {
            if (k > 0 && counts[k] == 0) lv_obj_add_flag(chips[k], LV_OBJ_FLAG_HIDDEN);
            else lv_obj_clear_flag(chips[k], LV_OBJ_FLAG_HIDDEN);
            if (k == f) lv_obj_add_state(chips[k], LV_STATE_CHECKED);
            else lv_obj_clear_state(chips[k], LV_STATE_CHECKED);
          }
          if (!id(maf_ready)) {
            lv_label_set_text(id(lbl_maf_empty), "Loading favorites…");
            lv_obj_clear_flag(id(lbl_maf_empty), LV_OBJ_FLAG_HIDDEN);
          } else if (n == 0) {
            lv_label_set_text(id(lbl_maf_empty), "No favorites in Music Assistant");
            lv_obj_clear_flag(id(lbl_maf_empty), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(lbl_maf_empty), LV_OBJ_FLAG_HIDDEN);
          }
          lv_obj_scroll_to_y(id(maf_grid), 0, LV_ANIM_OFF);

  # Shuffle button: highlighted with a white icon when on
  - id: maf_shuffle_show
    then:
      - lambda: |-
          bool on = id(maf_shuffle);
          if (on) lv_obj_add_state(id(maf_shuffle_btn), LV_STATE_CHECKED);
          else lv_obj_clear_state(id(maf_shuffle_btn), LV_STATE_CHECKED);
          lv_obj_set_style_text_color(id(maf_shuffle_icon), lv_color_hex(on ? ${c_text} : ${c_text_2}), LV_PART_MAIN);

  - id: maf_set_filter
    parameters:
      f: int
    then:
      - lambda: "id(maf_filter) = f;"
      - script.execute: maf_apply

  # Download the next tile's artwork, one at a time, through the shared art
  # loader (core/images.yaml; the image lock is shared with album art, TV
  # art and camera pop-ups)
  - id: maf_load_next
    mode: restart
    then:
      - delay: 200ms
      - wait_until:
          condition:
            lambda: "return !id(img_busy) || millis() - id(img_busy_ms) > 15000;"
          timeout: 20s
      - lambda: |-
          // Expand the short codes from ha/panel_ma_favorites.yaml
          static const char *const prefixes[6][2] = {
            {"~p", "https://pickasso.spotifycdn.com/image/ab67c0de0000deef/dt/v1/img/"},
            {"~s", "https://i.scdn.co/image/"},
            {"~m", "https://mosaic.scdn.co/300/"},
            {"~c", "https://image-cdn-"},
            {"~a", "https://is1-ssl.mzstatic.com/image/thumb/"},
            {"~x", "http://pri.art.prod.streaming.siriusxm.com/images/chan/"}};
          const std::string &x = id(maf_items).state;
          for (int n = 0; n < id(maf_count); n++) {
            if (id(maf_want)[n] == 0 || id(maf_want)[n] == id(maf_have)[n]) continue;
            id(maf_have)[n] = id(maf_want)[n];   // asked for (not retried if it fails)
            uint32_t ap = id(maf_art)[n];
            if ((ap >> 16) + (ap & 0xFFFF) > x.size() || (ap & 0xFFFF) == 0) continue;
            std::string a = x.substr(ap >> 16, ap & 0xFFFF);
            std::string u;
            if (a[0] == '~') {
              for (auto &pf : prefixes)
                if (a.compare(0, 2, pf[0]) == 0) { u = std::string(pf[1]) + a.substr(2); break; }
            } else if (a.rfind("http", 0) == 0) {
              u = a;
            } else {
              // A Music Assistant image id: its proxy, as a 256 px JPEG
              u = std::string("${ma_url}/imageproxy/") + a + "?size=256&fmt=jpeg";
            }
            if (u.empty()) continue;
            id(maf_loading) = n;
            id(img_busy) = true;
            id(img_busy_ms) = millis();
            id(art_cb) = [](bool ok) { id(maf_art_done)->execute(ok); };
            id(art_loader)->set_url(u);
            id(art_loader)->update();
            return;
          }

  # A download ended: show the artwork (or keep the placeholder) and go on
  - id: maf_art_done
    parameters:
      ok: bool
    then:
      - lambda: |-
          int i = id(maf_loading);
          id(maf_loading) = -1;
          if (!ok || i < 0 || i >= 36) return;
          if (id(maf_have)[i] != id(maf_want)[i]) return;   // list changed meanwhile
          lv_obj_t *img = id(maf_arts)[i];
          if (id(img_show)(img, &id(maf_dscs)[i], id(art_loader)->get_lv_image_dsc(), ${(140*px)|int})) {
            lv_obj_clear_flag(img, LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(lv_obj_get_child(lv_obj_get_parent(img), 0), LV_OBJ_FLAG_HIDDEN);
          }
      - script.execute: maf_load_next

  # Tap a tile: play it on the room's player, then set shuffle
  - id: maf_play
    parameters:
      index: int
    then:
      - if:
          condition:
            lambda: "return index >= 0 && index < id(maf_count) && id(maf_cat)[index] != 0;"
          then:
            - homeassistant.action:
                action: music_assistant.play_media
                data:
                  entity_id: ${music_player}
                  media_id: !lambda |-
                    const std::string &x = id(maf_items).state;
                    uint32_t up = id(maf_uri)[index];
                    if ((up >> 16) + (up & 0xFFFF) > x.size()) return std::string();
                    std::string u = x.substr(up >> 16, up & 0xFFFF);
                    if (u.find("://") != std::string::npos) return u;
                    // A library item id: "62" → "library://playlist/62"
                    char c = id(maf_cat)[index];
                    const char *t = c == 'p' ? "playlist" : c == 'r' ? "radio" : c == 'a' ? "album" : "artist";
                    return std::string("library://") + t + "/" + u;
                  media_type: !lambda |-
                    char c = id(maf_cat)[index];
                    return std::string(c == 'p' ? "playlist" : c == 'r' ? "radio" : c == 'a' ? "album" : "artist");
                  enqueue: replace
            - homeassistant.action:
                action: media_player.shuffle_set
                data:
                  entity_id: ${music_player}
                  shuffle: !lambda "return (id(maf_shuffle) && id(maf_cat)[index] != 'r') ? std::string(\"true\") : std::string(\"false\");"

font:
  - file: https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf
    id: maf_icons
    size: ${24*px}
    bpp: 4
    glyphs: ["\U000F049D", "\U000F0450"] # mdi-shuffle, mdi-refresh
  - file: https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf
    id: maf_note
    size: ${48*px}
    bpp: 4
    glyphs: ["\U000F075A"] # mdi-music

lvgl:
  pages:
    # Holding page (never shown): content_maf is moved into the tab at boot
    - id: holding_maf
      skip: true
      widgets:
        - obj:
            id: content_maf
            width: 100%
            height: 100%
            styles: container
            scrollable: false
            scrollbar_mode: "off"
            widgets:
              # Category chips (scroll sideways if they don't fit)
              - obj:
                  align: TOP_LEFT
                  x: ${8*px}
                  y: ${8*px}
                  width: ${376*px}
                  height: ${40*px}
                  styles: transparent
                  scrollbar_mode: "off"
                  scroll_dir: HOR
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_main: START
                    flex_align_cross: CENTER
                    flex_align_track: CENTER
                    pad_column: ${6*px}
                  widgets:
                    - button:
                        id: maf_chip_0
                        width: SIZE_CONTENT
                        height: ${36*px}
                        radius: ${18*px}
                        pad_left: ${14*px}
                        pad_right: ${14*px}
                        pad_top: 0
                        pad_bottom: 0
                        bg_color: ${c_surface}
                        bg_opa: COVER
                        checked:
                          bg_color: ${c_selected}
                          bg_opa: COVER
                        widgets:
                          - label:
                              text: "All"
                              text_color: ${c_text}
                              align: CENTER
                        on_click:
                          - script.execute:
                              id: maf_set_filter
                              f: 0
                    - button:
                        id: maf_chip_1
                        width: SIZE_CONTENT
                        height: ${36*px}
                        radius: ${18*px}
                        pad_left: ${14*px}
                        pad_right: ${14*px}
                        pad_top: 0
                        pad_bottom: 0
                        bg_color: ${c_surface}
                        bg_opa: COVER
                        checked:
                          bg_color: ${c_selected}
                          bg_opa: COVER
                        widgets:
                          - label:
                              text: "Playlists"
                              text_color: ${c_text}
                              align: CENTER
                        on_click:
                          - script.execute:
                              id: maf_set_filter
                              f: 1
                    - button:
                        id: maf_chip_2
                        width: SIZE_CONTENT
                        height: ${36*px}
                        radius: ${18*px}
                        pad_left: ${14*px}
                        pad_right: ${14*px}
                        pad_top: 0
                        pad_bottom: 0
                        bg_color: ${c_surface}
                        bg_opa: COVER
                        checked:
                          bg_color: ${c_selected}
                          bg_opa: COVER
                        widgets:
                          - label:
                              text: "Radio"
                              text_color: ${c_text}
                              align: CENTER
                        on_click:
                          - script.execute:
                              id: maf_set_filter
                              f: 2
                    - button:
                        id: maf_chip_3
                        width: SIZE_CONTENT
                        height: ${36*px}
                        radius: ${18*px}
                        pad_left: ${14*px}
                        pad_right: ${14*px}
                        pad_top: 0
                        pad_bottom: 0
                        bg_color: ${c_surface}
                        bg_opa: COVER
                        checked:
                          bg_color: ${c_selected}
                          bg_opa: COVER
                        widgets:
                          - label:
                              text: "Albums"
                              text_color: ${c_text}
                              align: CENTER
                        on_click:
                          - script.execute:
                              id: maf_set_filter
                              f: 3
                    - button:
                        id: maf_chip_4
                        width: SIZE_CONTENT
                        height: ${36*px}
                        radius: ${18*px}
                        pad_left: ${14*px}
                        pad_right: ${14*px}
                        pad_top: 0
                        pad_bottom: 0
                        bg_color: ${c_surface}
                        bg_opa: COVER
                        checked:
                          bg_color: ${c_selected}
                          bg_opa: COVER
                        widgets:
                          - label:
                              text: "Artists"
                              text_color: ${c_text}
                              align: CENTER
                        on_click:
                          - script.execute:
                              id: maf_set_filter
                              f: 4
              # Shuffle (on = highlighted) and refresh
              - button:
                  id: maf_shuffle_btn
                  align: TOP_RIGHT
                  x: -${52*px}
                  y: ${8*px}
                  width: ${40*px}
                  height: ${40*px}
                  styles: round_btn
                  bg_color: ${c_surface}
                  checked:
                    bg_color: ${c_selected}
                  widgets:
                    - label:
                        id: maf_shuffle_icon
                        text: "\U000F049D" # mdi-shuffle
                        text_font: maf_icons
                        text_color: ${c_text_2}
                        align: CENTER
                  on_click:
                    - lambda: "id(maf_shuffle) = !id(maf_shuffle);"
                    - script.execute: maf_shuffle_show
              - button:
                  align: TOP_RIGHT
                  x: -${8*px}
                  y: ${8*px}
                  width: ${40*px}
                  height: ${40*px}
                  styles: round_btn
                  bg_color: ${c_surface}
                  widgets:
                    - label:
                        text: "\U000F0450" # mdi-refresh
                        text_font: maf_icons
                        text_color: ${c_text_2}
                        align: CENTER
                  on_click:
                    - homeassistant.event:
                        event: esphome.panel_favorites_refresh
              - label:
                  id: lbl_maf_empty
                  text: "Loading favorites…"
                  text_color: ${c_text_2}
                  align: CENTER
                  y: ${20*px}
              # Artwork grid: 140 px tiles, 3 per row, scrolls
              - obj:
                  id: maf_grid
                  align: TOP_MID
                  y: ${56*px}
                  width: 100%
                  height: ${334*px}
                  styles: transparent
                  scrollbar_mode: "off"
                  scroll_dir: VER
                  pad_top: ${4*px}
                  pad_left: ${12*px}
                  pad_bottom: ${12*px}
                  # Wrapping rows of tiles (flex layout and tiles: set at boot)
