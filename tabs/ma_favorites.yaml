# Tab: Favorites from Music Assistant. Your MA favorites (playlists, radio
# stations, albums and artists) as an artwork grid with category chips. It
# follows Music Assistant: favorite something there and it appears here,
# no reinstall. Tap a tile to play it on the room's player.
#
#   tab_favorites: !include
#     file: panel/tabs/ma_favorites.yaml
#     vars:
#       tab_position: 4
#       music_player: media_player.kitchen          # MA player to play on
#       ma_url: "http://192.168.0.10:8095"          # Music Assistant (for artwork)
#       # favorites_entity: sensor.panel_ma_favorites   # optional (default)
#
# Needs ha/panel_ma_favorites.yaml in Home Assistant. Up to 36 favorites.
# Artwork is downloaded one tile at a time through a single image loader and
# copied into PSRAM (about 90 KB per tile at 720x720), so this tab suits
# boards with plenty of PSRAM (the Waveshare P4). On the 480x480 boards use
# tabs/favorites.yaml instead.
#
# Shuffle (the icon next to the chips) applies to playlists, albums and
# artists; radio never shuffles. The refresh icon asks HA to re-read the
# favorites right away (they are also re-read every 15 minutes).

defaults:
  favorites_entity: sensor.panel_ma_favorites

globals:
  # The list from HA: category (playlist / radio / album / artist) and URI
  - id: maf_cat
    type: std::vector<std::string>
    initial_value: "std::vector<std::string>()"
  - id: maf_uri
    type: std::vector<std::string>
    initial_value: "std::vector<std::string>()"
  # Per tile: artwork wanted, artwork being/last downloaded, needs download
  - id: maf_art
    type: std::vector<std::string>
    initial_value: "std::vector<std::string>(36)"
  - id: maf_req
    type: std::vector<std::string>
    initial_value: "std::vector<std::string>(36)"
  - id: maf_need
    type: std::vector<int>
    initial_value: "std::vector<int>(36, 0)"
  # Widgets and image loaders, by tile (filled at boot)
  - id: maf_tiles
    type: std::vector<lv_obj_t *>
    initial_value: "std::vector<lv_obj_t *>()"
  - id: maf_names
    type: std::vector<lv_obj_t *>
    initial_value: "std::vector<lv_obj_t *>()"
  - id: maf_arts
    type: std::vector<lv_obj_t *>
    initial_value: "std::vector<lv_obj_t *>()"
  # Each tile's artwork: a copy of the loader's picture in PSRAM
  - id: maf_dscs
    type: std::vector<lv_image_dsc_t *>
    initial_value: "std::vector<lv_image_dsc_t *>(36, nullptr)"
  # Tile whose artwork is being fetched (-1: none), and by which loader
  - id: maf_loading
    type: int
    initial_value: "-1"
  - id: maf_loading_png
    type: bool
    initial_value: "false"
  # Chip filter: 0 All, 1 Playlists, 2 Radio, 3 Albums, 4 Artists
  - id: maf_filter
    type: int
    initial_value: "0"
  - id: maf_ready
    type: bool
    initial_value: "false"
  - id: maf_shuffle
    type: bool
    restore_value: true
    initial_value: "true"

esphome:
  on_boot:
    - priority: -10${tab_position}
      then:
        - lambda: |-
            lv_obj_t *tab = lv_tabview_add_tab(id(main_tabview), "Favorites");
            lv_obj_set_style_pad_all(tab, 0, 0);
            lv_obj_set_scrollbar_mode(tab, LV_SCROLLBAR_MODE_OFF);
            lv_obj_set_parent(id(content_maf), tab);
            id(maf_tiles) = {id(maf_tile_1), id(maf_tile_2), id(maf_tile_3), id(maf_tile_4), id(maf_tile_5), id(maf_tile_6), id(maf_tile_7), id(maf_tile_8), id(maf_tile_9), id(maf_tile_10), id(maf_tile_11), id(maf_tile_12), id(maf_tile_13), id(maf_tile_14), id(maf_tile_15), id(maf_tile_16), id(maf_tile_17), id(maf_tile_18), id(maf_tile_19), id(maf_tile_20), id(maf_tile_21), id(maf_tile_22), id(maf_tile_23), id(maf_tile_24), id(maf_tile_25), id(maf_tile_26), id(maf_tile_27), id(maf_tile_28), id(maf_tile_29), id(maf_tile_30), id(maf_tile_31), id(maf_tile_32), id(maf_tile_33), id(maf_tile_34), id(maf_tile_35), id(maf_tile_36)};
            id(maf_names) = {id(maf_name_1), id(maf_name_2), id(maf_name_3), id(maf_name_4), id(maf_name_5), id(maf_name_6), id(maf_name_7), id(maf_name_8), id(maf_name_9), id(maf_name_10), id(maf_name_11), id(maf_name_12), id(maf_name_13), id(maf_name_14), id(maf_name_15), id(maf_name_16), id(maf_name_17), id(maf_name_18), id(maf_name_19), id(maf_name_20), id(maf_name_21), id(maf_name_22), id(maf_name_23), id(maf_name_24), id(maf_name_25), id(maf_name_26), id(maf_name_27), id(maf_name_28), id(maf_name_29), id(maf_name_30), id(maf_name_31), id(maf_name_32), id(maf_name_33), id(maf_name_34), id(maf_name_35), id(maf_name_36)};
            id(maf_arts) = {id(maf_art_1), id(maf_art_2), id(maf_art_3), id(maf_art_4), id(maf_art_5), id(maf_art_6), id(maf_art_7), id(maf_art_8), id(maf_art_9), id(maf_art_10), id(maf_art_11), id(maf_art_12), id(maf_art_13), id(maf_art_14), id(maf_art_15), id(maf_art_16), id(maf_art_17), id(maf_art_18), id(maf_art_19), id(maf_art_20), id(maf_art_21), id(maf_art_22), id(maf_art_23), id(maf_art_24), id(maf_art_25), id(maf_art_26), id(maf_art_27), id(maf_art_28), id(maf_art_29), id(maf_art_30), id(maf_art_31), id(maf_art_32), id(maf_art_33), id(maf_art_34), id(maf_art_35), id(maf_art_36)};
        - script.execute: maf_shuffle_show
        - script.execute: maf_apply
        # The list may have arrived before the tab was built
        - script.execute: maf_parse

text_sensor:
  - platform: homeassistant
    id: maf_items
    entity_id: ${favorites_entity}
    attribute: items
    on_value:
      - script.execute: maf_parse

script:
  # "cat|name|uri|art;cat|name|uri|art;…" → tiles
  - id: maf_parse
    then:
      - lambda: |-
          if (id(maf_tiles).size() != 36) return;
          const std::string &x = id(maf_items).state;
          if (x.empty()) return;
          std::vector<std::string> cat, nm, uri, art;
          size_t p = 0;
          while (p < x.size() && cat.size() < 36) {
            size_t e = x.find(';', p);
            if (e == std::string::npos) e = x.size();
            std::string it = x.substr(p, e - p);
            p = e + 1;
            size_t a = it.find('|');
            if (a == std::string::npos) continue;
            size_t b = it.find('|', a + 1);
            if (b == std::string::npos) continue;
            size_t c = it.find('|', b + 1);
            if (c == std::string::npos) continue;
            cat.push_back(it.substr(0, a));
            nm.push_back(it.substr(a + 1, b - a - 1));
            uri.push_back(it.substr(b + 1, c - b - 1));
            art.push_back(it.substr(c + 1));
          }
          id(maf_cat) = cat;
          id(maf_uri) = uri;
          for (int i = 0; i < 36; i++) {
            std::string want = i < (int) art.size() ? art[i] : std::string();
            if (i < (int) nm.size()) lv_label_set_text(id(maf_names)[i], nm[i].c_str());
            if (want != id(maf_art)[i]) {
              // New artwork: show the placeholder until it arrives
              id(maf_art)[i] = want;
              lv_obj_add_flag(id(maf_arts)[i], LV_OBJ_FLAG_HIDDEN);
              lv_obj_clear_flag(lv_obj_get_child(lv_obj_get_parent(id(maf_arts)[i]), 0), LV_OBJ_FLAG_HIDDEN);
            }
            id(maf_need)[i] = !want.empty() && want != id(maf_req)[i];
          }
          id(maf_ready) = true;
      - script.execute: maf_apply
      - script.execute: maf_load_next

  # Show the tiles for the selected chip; hide chips with nothing in them
  - id: maf_apply
    then:
      - lambda: |-
          if (id(maf_tiles).size() != 36) return;
          static const char *const cats[5] = {"", "playlist", "radio", "album", "artist"};
          int n = (int) id(maf_cat).size();
          int counts[5] = {n, 0, 0, 0, 0};
          for (int i = 0; i < n; i++)
            for (int k = 1; k < 5; k++)
              if (id(maf_cat)[i] == cats[k]) counts[k]++;
          if (id(maf_filter) > 0 && counts[id(maf_filter)] == 0) id(maf_filter) = 0;
          int f = id(maf_filter);
          for (int i = 0; i < 36; i++) {
            bool show = i < n && (f == 0 || id(maf_cat)[i] == cats[f]);
            if (show) lv_obj_clear_flag(id(maf_tiles)[i], LV_OBJ_FLAG_HIDDEN);
            else lv_obj_add_flag(id(maf_tiles)[i], LV_OBJ_FLAG_HIDDEN);
          }
          lv_obj_t *chips[5] = {id(maf_chip_0), id(maf_chip_1), id(maf_chip_2), id(maf_chip_3), id(maf_chip_4)};
          for (int k = 0; k < 5; k++) {
            if (k > 0 && counts[k] == 0) lv_obj_add_flag(chips[k], LV_OBJ_FLAG_HIDDEN);
            else lv_obj_clear_flag(chips[k], LV_OBJ_FLAG_HIDDEN);
            if (k == f) lv_obj_add_state(chips[k], LV_STATE_CHECKED);
            else lv_obj_clear_state(chips[k], LV_STATE_CHECKED);
          }
          if (!id(maf_ready)) {
            lv_label_set_text(id(lbl_maf_empty), "Loading favorites…");
            lv_obj_clear_flag(id(lbl_maf_empty), LV_OBJ_FLAG_HIDDEN);
          } else if (n == 0) {
            lv_label_set_text(id(lbl_maf_empty), "No favorites in Music Assistant");
            lv_obj_clear_flag(id(lbl_maf_empty), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(lbl_maf_empty), LV_OBJ_FLAG_HIDDEN);
          }
          lv_obj_scroll_to_y(id(maf_grid), 0, LV_ANIM_OFF);

  # Shuffle button: highlighted with a white icon when on
  - id: maf_shuffle_show
    then:
      - lambda: |-
          bool on = id(maf_shuffle);
          if (on) lv_obj_add_state(id(maf_shuffle_btn), LV_STATE_CHECKED);
          else lv_obj_clear_state(id(maf_shuffle_btn), LV_STATE_CHECKED);
          lv_obj_set_style_text_color(id(maf_shuffle_icon), lv_color_hex(on ? ${c_text} : ${c_text_2}), LV_PART_MAIN);

  - id: maf_set_filter
    parameters:
      f: int
    then:
      - lambda: "id(maf_filter) = f;"
      - script.execute: maf_apply

  # Download the next tile's artwork, one at a time (shares the image lock
  # with album art and camera pop-ups)
  - id: maf_load_next
    mode: restart
    then:
      - delay: 200ms
      - wait_until:
          condition:
            lambda: "return !id(img_busy) || millis() - id(img_busy_ms) > 15000;"
          timeout: 20s
      - lambda: |-
          int n = -1;
          for (int i = 0; i < (int) id(maf_need).size(); i++)
            if (id(maf_need)[i]) { n = i; break; }
          if (n < 0) return;
          const std::string &a = id(maf_art)[n];
          std::string u = a.rfind("http", 0) == 0 ? a : std::string("${ma_url}/imageproxy/") + a;
          // Music Assistant's image proxy: a 256 px JPEG (the panel can't
          // decode its default PNG)
          if (u.find("/imageproxy") != std::string::npos) {
            size_t f = u.find("fmt=png");
            if (f != std::string::npos) u.replace(f, 7, "fmt=jpeg");
            f = u.find("size=");
            if (f != std::string::npos) {
              size_t e = u.find('&', f);
              u.replace(f, (e == std::string::npos ? u.size() : e) - f, "size=256");
            } else {
              u += (u.find('?') == std::string::npos ? "?" : "&");
              u += "size=256";
            }
            if (u.find("fmt=") == std::string::npos) u += "&fmt=jpeg";
          }
          // PNG artwork (e.g. SiriusXM channel logos) goes to the PNG loader
          std::string path = u.substr(0, u.find('?'));
          std::string ext = path.size() > 4 ? path.substr(path.size() - 4) : std::string();
          for (auto &c : ext) c = (char) tolower((unsigned char) c);
          bool png = ext == ".png";
          id(maf_need)[n] = 0;
          id(maf_req)[n] = a;
          id(maf_loading) = n;
          id(maf_loading_png) = png;
          id(img_busy) = true;
          id(img_busy_ms) = millis();
          auto *loader = png ? id(maf_loader_png) : id(maf_loader);
          loader->set_url(u);
          loader->update();

  # A download ended: show the artwork (or keep the placeholder) and go on
  - id: maf_art_done
    parameters:
      ok: bool
    then:
      - lambda: |-
          int index = id(maf_loading);
          id(maf_loading) = -1;
          id(img_busy) = false;
          if (!ok || index < 0 || index >= (int) id(maf_arts).size()) return;
          if (id(maf_req)[index] != id(maf_art)[index]) return;   // list changed meanwhile
          // Copy the picture out of the loader (it is reused for the next tile)
          lv_image_dsc_t *src = id(maf_loading_png) ? id(maf_loader_png)->get_lv_image_dsc()
                                                     : id(maf_loader)->get_lv_image_dsc();
          if (src == nullptr || src->data == nullptr || src->data_size == 0) return;
          // A new descriptor each time, so LVGL never mistakes it for the
          // tile's previous picture; the old one is freed after the switch
          auto *nd = (lv_image_dsc_t *) heap_caps_malloc(sizeof(lv_image_dsc_t), MALLOC_CAP_SPIRAM | MALLOC_CAP_8BIT);
          auto *buf = (uint8_t *) heap_caps_malloc(src->data_size, MALLOC_CAP_SPIRAM | MALLOC_CAP_8BIT);
          if (nd == nullptr || buf == nullptr) {
            if (nd != nullptr) heap_caps_free(nd);
            if (buf != nullptr) heap_caps_free(buf);
            return;
          }
          memcpy(buf, src->data, src->data_size);
          *nd = *src;
          nd->data = buf;
          lv_obj_t *img = id(maf_arts)[index];
          ::lv_image_set_src(img, (const void *) nd);
          lv_image_dsc_t *old = id(maf_dscs)[index];
          id(maf_dscs)[index] = nd;
          if (old != nullptr) {
            heap_caps_free((void *) old->data);
            heap_caps_free(old);
          }
          lv_obj_clear_flag(img, LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(lv_obj_get_child(lv_obj_get_parent(img), 0), LV_OBJ_FLAG_HIDDEN);
      - script.execute: maf_load_next

  # Tap a tile: play it on the room's player, then set shuffle
  - id: maf_play
    parameters:
      index: int
    then:
      - if:
          condition:
            lambda: "return index >= 0 && index < (int) id(maf_uri).size();"
          then:
            - homeassistant.action:
                action: music_assistant.play_media
                data:
                  entity_id: ${music_player}
                  media_id: !lambda "return id(maf_uri)[index];"
                  media_type: !lambda "return id(maf_cat)[index];"
                  enqueue: replace
            - homeassistant.action:
                action: media_player.shuffle_set
                data:
                  entity_id: ${music_player}
                  shuffle: !lambda 'return (id(maf_shuffle) && id(maf_cat)[index] != "radio") ? std::string("true") : std::string("false");'

font:
  - file: https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf
    id: maf_icons
    size: ${24*px}
    bpp: 4
    glyphs: ["\U000F049D", "\U000F0450"] # mdi-shuffle, mdi-refresh
  - file: https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf
    id: maf_note
    size: ${48*px}
    bpp: 4
    glyphs: ["\U000F075A"] # mdi-music

image:
  # One loader per format for all tiles: each picture is copied to its tile
  # when done (one decoder each; a loader per tile would need ~600 KB of
  # internal RAM)
  - platform: online_image
    id: maf_loader
    url: "https://www.home-assistant.io/images/favicon-192x192.png"
    format: JPEG
    type: RGB565
    resize: "${(140*px)|int}x${(140*px)|int}"
    on_download_finished:
      - script.execute:
          id: maf_art_done
          ok: true
    on_error:
      - script.execute:
          id: maf_art_done
          ok: false
  - platform: online_image
    id: maf_loader_png
    url: "https://www.home-assistant.io/images/favicon-192x192.png"
    format: PNG
    type: RGB565
    resize: "${(140*px)|int}x${(140*px)|int}"
    on_download_finished:
      - script.execute:
          id: maf_art_done
          ok: true
    on_error:
      - script.execute:
          id: maf_art_done
          ok: false

lvgl:
  pages:
    # Holding page (never shown): content_maf is moved into the tab at boot
    - id: holding_maf
      skip: true
      widgets:
        - obj:
            id: content_maf
            width: 100%
            height: 100%
            styles: container
            scrollable: false
            scrollbar_mode: "off"
            widgets:
              # Category chips (scroll sideways if they don't fit)
              - obj:
                  align: TOP_LEFT
                  x: ${8*px}
                  y: ${8*px}
                  width: ${376*px}
                  height: ${40*px}
                  styles: transparent
                  scrollbar_mode: "off"
                  scroll_dir: HOR
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_main: START
                    flex_align_cross: CENTER
                    flex_align_track: CENTER
                    pad_column: ${6*px}
                  widgets:
                    - button:
                        id: maf_chip_0
                        width: SIZE_CONTENT
                        height: ${36*px}
                        radius: ${18*px}
                        pad_left: ${14*px}
                        pad_right: ${14*px}
                        pad_top: 0
                        pad_bottom: 0
                        bg_color: ${c_surface}
                        bg_opa: COVER
                        checked:
                          bg_color: ${c_selected}
                          bg_opa: COVER
                        widgets:
                          - label:
                              text: "All"
                              text_color: ${c_text}
                              align: CENTER
                        on_click:
                          - script.execute:
                              id: maf_set_filter
                              f: 0
                    - button:
                        id: maf_chip_1
                        width: SIZE_CONTENT
                        height: ${36*px}
                        radius: ${18*px}
                        pad_left: ${14*px}
                        pad_right: ${14*px}
                        pad_top: 0
                        pad_bottom: 0
                        bg_color: ${c_surface}
                        bg_opa: COVER
                        checked:
                          bg_color: ${c_selected}
                          bg_opa: COVER
                        widgets:
                          - label:
                              text: "Playlists"
                              text_color: ${c_text}
                              align: CENTER
                        on_click:
                          - script.execute:
                              id: maf_set_filter
                              f: 1
                    - button:
                        id: maf_chip_2
                        width: SIZE_CONTENT
                        height: ${36*px}
                        radius: ${18*px}
                        pad_left: ${14*px}
                        pad_right: ${14*px}
                        pad_top: 0
                        pad_bottom: 0
                        bg_color: ${c_surface}
                        bg_opa: COVER
                        checked:
                          bg_color: ${c_selected}
                          bg_opa: COVER
                        widgets:
                          - label:
                              text: "Radio"
                              text_color: ${c_text}
                              align: CENTER
                        on_click:
                          - script.execute:
                              id: maf_set_filter
                              f: 2
                    - button:
                        id: maf_chip_3
                        width: SIZE_CONTENT
                        height: ${36*px}
                        radius: ${18*px}
                        pad_left: ${14*px}
                        pad_right: ${14*px}
                        pad_top: 0
                        pad_bottom: 0
                        bg_color: ${c_surface}
                        bg_opa: COVER
                        checked:
                          bg_color: ${c_selected}
                          bg_opa: COVER
                        widgets:
                          - label:
                              text: "Albums"
                              text_color: ${c_text}
                              align: CENTER
                        on_click:
                          - script.execute:
                              id: maf_set_filter
                              f: 3
                    - button:
                        id: maf_chip_4
                        width: SIZE_CONTENT
                        height: ${36*px}
                        radius: ${18*px}
                        pad_left: ${14*px}
                        pad_right: ${14*px}
                        pad_top: 0
                        pad_bottom: 0
                        bg_color: ${c_surface}
                        bg_opa: COVER
                        checked:
                          bg_color: ${c_selected}
                          bg_opa: COVER
                        widgets:
                          - label:
                              text: "Artists"
                              text_color: ${c_text}
                              align: CENTER
                        on_click:
                          - script.execute:
                              id: maf_set_filter
                              f: 4
              # Shuffle (on = highlighted) and refresh
              - button:
                  id: maf_shuffle_btn
                  align: TOP_RIGHT
                  x: -${52*px}
                  y: ${8*px}
                  width: ${40*px}
                  height: ${40*px}
                  styles: round_btn
                  bg_color: ${c_surface}
                  checked:
                    bg_color: ${c_selected}
                  widgets:
                    - label:
                        id: maf_shuffle_icon
                        text: "\U000F049D" # mdi-shuffle
                        text_font: maf_icons
                        text_color: ${c_text_2}
                        align: CENTER
                  on_click:
                    - lambda: "id(maf_shuffle) = !id(maf_shuffle);"
                    - script.execute: maf_shuffle_show
              - button:
                  align: TOP_RIGHT
                  x: -${8*px}
                  y: ${8*px}
                  width: ${40*px}
                  height: ${40*px}
                  styles: round_btn
                  bg_color: ${c_surface}
                  widgets:
                    - label:
                        text: "\U000F0450" # mdi-refresh
                        text_font: maf_icons
                        text_color: ${c_text_2}
                        align: CENTER
                  on_click:
                    - homeassistant.event:
                        event: esphome.panel_favorites_refresh
              - label:
                  id: lbl_maf_empty
                  text: "Loading favorites…"
                  text_color: ${c_text_2}
                  align: CENTER
                  y: ${20*px}
              # Artwork grid: 140 px tiles, 3 per row, scrolls
              - obj:
                  id: maf_grid
                  align: TOP_MID
                  y: ${56*px}
                  width: 100%
                  height: ${334*px}
                  styles: transparent
                  scrollbar_mode: "off"
                  scroll_dir: VER
                  pad_top: ${4*px}
