# Tab: Timer. Preset buttons, a custom timer, and up to three countdowns at
# once; when one ends the panel wakes, shows "Time's up" and chimes on its
# speaker until you tap Stop (or for 5 minutes). Timers set by voice ("Okay
# Nabu, set a pasta timer for 10 minutes") appear in the same list and ring
# the same way; cancel those by voice.
#
#   tab_timer: !include { file: panel/tabs/timer.yaml, vars: { tab_position: 2 } }
#
# Optional vars: preset_1 … preset_6, in minutes (defaults 1, 3, 5, 10, 15, 30).
#
# Needs features/voice_assistant.yaml (and so a board with a speaker:
# hardware/waveshare-esp32-p4-86-4b.yaml). While a timer runs, a timer chip
# in the status bar shows the time left; tap it to open this tab.

defaults:
  preset_1: "1"
  preset_2: "3"
  preset_3: "5"
  preset_4: "10"
  preset_5: "15"
  preset_6: "30"

globals:
  - id: tab_index_timer
    type: int
    initial_value: "-1"
  # Three on-screen timers: end time (millis(), 0 = free), length in
  # seconds, and name
  - id: tmr_end
    type: std::vector<uint32_t>
    initial_value: "{0, 0, 0}"
  - id: tmr_total
    type: std::vector<uint32_t>
    initial_value: "{0, 0, 0}"
  - id: tmr_name
    type: std::vector<std::string>
    initial_value: '{"", "", ""}'
  # What each list row shows: a timer slot above, or -1 (voice timer / empty)
  - id: tmr_row_src
    type: std::vector<int>
    initial_value: "{-1, -1, -1, -1}"
  # Name of an on-screen timer that just ended (picked up by the interval)
  - id: tmr_due
    type: std::string
    initial_value: '""'
  - id: tmr_ringing
    type: bool
    initial_value: "false"
  - id: tmr_ring_start
    type: uint32_t
    initial_value: "0"
  # The list was empty at the last redraw (skip redrawing an empty list)
  - id: tmr_was_empty
    type: bool
    initial_value: "false"

esphome:
  on_boot:
    - priority: -10${tab_position}
      then:
        - lambda: |-
            lv_obj_t *tab = lv_tabview_add_tab(id(main_tabview), "Timer");
            lv_obj_set_style_pad_all(tab, 0, 0);
            lv_obj_set_scrollbar_mode(tab, LV_SCROLLBAR_MODE_OFF);
            lv_obj_set_parent(id(content_timer), tab);
            id(tab_index_timer) = lv_obj_get_index(tab);
            // Custom-timer sheet: over the whole UI like the other sheets
            lv_obj_set_parent(id(timer_custom_panel), id(ui_root));
    # Status-bar chip: leftmost of the chips
    - priority: -209
      then:
        - lambda: |-
            lv_obj_set_parent(id(chip_timer), id(status_chips));
            lv_obj_move_to_index(id(chip_timer), 0);
        - script.execute: timer_render

# Timers set by voice (Home Assistant keeps them; the panel shows and rings)
voice_assistant:
  on_timer_started:
    - script.execute: timer_render
  on_timer_updated:
    - script.execute: timer_render
  on_timer_cancelled:
    - script.execute: timer_render
  on_timer_tick:
    - script.execute: timer_render
  on_timer_finished:
    - script.execute:
        id: timer_ring
        name: !lambda "return timer.name.empty() ? std::string(\"Timer\") : timer.name;"
    - script.execute: timer_render

# The chime (from Home Assistant Voice PE), stored on the panel
media_player:
  - id: !extend panel_media_player
    files:
      - id: timer_finished_sound
        file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/timer_finished.flac

interval:
  - interval: 1s
    then:
      # On-screen timers that reached zero: free the slot and ring
      - lambda: |-
          uint32_t now = millis();
          for (int k = 0; k < 3; k++) {
            if (id(tmr_end)[k] != 0 && (int32_t) (id(tmr_end)[k] - now) <= 0) {
              id(tmr_due) = id(tmr_name)[k];
              id(tmr_end)[k] = 0;
            }
          }
      - if:
          condition:
            lambda: "return !id(tmr_due).empty();"
          then:
            - script.execute:
                id: timer_ring
                name: !lambda "return id(tmr_due);"
            - lambda: "id(tmr_due).clear();"
      - script.execute: timer_render

script:
  # Start an on-screen timer (replaces the one closest to ending if all
  # three are in use)
  - id: timer_start
    parameters:
      seconds: int
      name: string
    then:
      - lambda: |-
          if (seconds <= 0) return;
          uint32_t now = millis();
          int slot = -1;
          for (int k = 0; k < 3 && slot < 0; k++)
            if (id(tmr_end)[k] == 0) slot = k;
          if (slot < 0) {
            slot = 0;
            for (int k = 1; k < 3; k++)
              if ((int32_t) (id(tmr_end)[k] - id(tmr_end)[slot]) < 0) slot = k;
          }
          id(tmr_end)[slot] = now + (uint32_t) seconds * 1000;
          id(tmr_total)[slot] = seconds;
          id(tmr_name)[slot] = name;
          lv_disp_trig_activity(NULL);
      - script.execute: timer_render

  # Redraw the list and the status-bar chip: on-screen and voice timers
  # together, soonest first
  - id: timer_render
    mode: restart
    then:
      - lambda: |-
          struct Row {
            int src;
            std::string name;
            uint32_t left;
            uint32_t total;
          };
          std::vector<Row> rows;
          uint32_t now = millis();
          for (int k = 0; k < 3; k++) {
            if (id(tmr_end)[k] == 0) continue;
            int32_t ms = (int32_t) (id(tmr_end)[k] - now);
            uint32_t left = ms > 0 ? (uint32_t) ((ms + 999) / 1000) : 0;
            rows.push_back(Row{k, id(tmr_name)[k], left, id(tmr_total)[k]});
          }
          for (const auto &t : id(va).get_timers())
            rows.push_back(Row{-1, t.name.empty() ? std::string("Voice timer") : t.name,
                               t.seconds_left, t.total_seconds});
          if (rows.empty() && id(tmr_was_empty)) return;
          id(tmr_was_empty) = rows.empty();
          std::sort(rows.begin(), rows.end(), [](const Row &a, const Row &b) { return a.left < b.left; });

          auto fmt = [](uint32_t s, char *buf, size_t n) {
            if (s >= 3600)
              snprintf(buf, n, "%u:%02u:%02u", (unsigned) (s / 3600), (unsigned) (s / 60 % 60), (unsigned) (s % 60));
            else
              snprintf(buf, n, "%u:%02u", (unsigned) (s / 60), (unsigned) (s % 60));
          };
          lv_obj_t *row[4] = {id(timer_row_1), id(timer_row_2), id(timer_row_3), id(timer_row_4)};
          lv_obj_t *nm[4] = {id(lbl_tr_name_1), id(lbl_tr_name_2), id(lbl_tr_name_3), id(lbl_tr_name_4)};
          lv_obj_t *tm[4] = {id(lbl_tr_time_1), id(lbl_tr_time_2), id(lbl_tr_time_3), id(lbl_tr_time_4)};
          lv_obj_t *fill[4] = {id(tr_fill_1), id(tr_fill_2), id(tr_fill_3), id(tr_fill_4)};
          lv_obj_t *add[4] = {id(btn_tr_add_1), id(btn_tr_add_2), id(btn_tr_add_3), id(btn_tr_add_4)};
          lv_obj_t *del[4] = {id(btn_tr_del_1), id(btn_tr_del_2), id(btn_tr_del_3), id(btn_tr_del_4)};
          char buf[16];
          for (int i = 0; i < 4; i++) {
            if (i >= (int) rows.size()) {
              lv_obj_add_flag(row[i], LV_OBJ_FLAG_HIDDEN);
              id(tmr_row_src)[i] = -1;
              continue;
            }
            const Row &r = rows[i];
            id(tmr_row_src)[i] = r.src;
            lv_obj_clear_flag(row[i], LV_OBJ_FLAG_HIDDEN);
            lv_label_set_text(nm[i], r.name.c_str());
            fmt(r.left, buf, sizeof(buf));
            lv_label_set_text(tm[i], buf);
            // Progress: the fill shrinks from full width as time runs out
            int32_t w = r.total ? (int32_t) ((uint64_t) ${(424*px)|int} * r.left / r.total) : 0;
            lv_obj_set_width(fill[i], std::max<int32_t>(w, 1));
            // +1 min and ✕ only for on-screen timers (voice timers: by voice)
            if (r.src >= 0) {
              lv_obj_clear_flag(add[i], LV_OBJ_FLAG_HIDDEN);
              lv_obj_clear_flag(del[i], LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_add_flag(add[i], LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(del[i], LV_OBJ_FLAG_HIDDEN);
            }
          }
          if (rows.empty()) {
            lv_obj_clear_flag(id(lbl_timer_empty), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(chip_timer), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(lbl_timer_empty), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(chip_timer), LV_OBJ_FLAG_HIDDEN);
            fmt(rows[0].left, buf, sizeof(buf));
            lv_label_set_text(id(lbl_chip_timer), buf);
          }

  # A row's +1 min / ✕ buttons
  - id: timer_row_add
    parameters:
      row: int
    then:
      - lambda: |-
          int s = id(tmr_row_src)[row];
          if (s < 0 || id(tmr_end)[s] == 0) return;
          id(tmr_end)[s] += 60000;
          id(tmr_total)[s] += 60;
      - script.execute: timer_render
  - id: timer_row_cancel
    parameters:
      row: int
    then:
      - lambda: |-
          int s = id(tmr_row_src)[row];
          if (s >= 0) id(tmr_end)[s] = 0;
      - script.execute: timer_render

  # Time's up: wake the screen, open this tab, and chime until Stop
  # (or 5 minutes)
  - id: timer_ring
    mode: restart
    parameters:
      name: string
    then:
      - lambda: |-
          id(tmr_ringing) = true;
          id(tmr_ring_start) = millis();
          lv_label_set_text(id(lbl_ring_name), name.c_str());
          lv_obj_clear_flag(id(timer_ring_overlay), LV_OBJ_FLAG_HIDDEN);
          lv_obj_move_foreground(id(timer_ring_overlay));
          if (id(tab_index_timer) >= 0)
            lv_tabview_set_act(id(main_tabview), id(tab_index_timer), LV_ANIM_OFF);
      - script.execute: refresh_tab_bar
      - script.execute:
          id: screen_wake
          full: true
      - while:
          condition:
            lambda: "return id(tmr_ringing) && millis() - id(tmr_ring_start) < 300000;"
          then:
            - lambda: "lv_disp_trig_activity(NULL);"
            - media_player.speaker.play_on_device_media_file:
                id: panel_media_player
                media_file: timer_finished_sound
                announcement: true
            - wait_until:
                condition:
                  media_player.is_announcing: panel_media_player
                timeout: 1s
            - wait_until:
                condition:
                  not:
                    media_player.is_announcing: panel_media_player
                timeout: 5s
            - delay: 700ms
      - script.execute: timer_ring_stop

  - id: timer_ring_stop
    then:
      - lambda: |-
          id(tmr_ringing) = false;
          lv_obj_add_flag(id(timer_ring_overlay), LV_OBJ_FLAG_HIDDEN);
      - if:
          condition:
            media_player.is_announcing: panel_media_player
          then:
            - media_player.stop:
                id: panel_media_player
                announcement: true

font:
  - file: https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf
    id: timer_icons_sm
    size: ${22*px}
    bpp: 4
    glyphs: ["\U000F051B", "\U000F0156"] # mdi-timer-outline, mdi-close
  - file: https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf
    id: timer_icons_xl
    size: ${72*px}
    bpp: 4
    glyphs: ["\U000F009E"] # mdi-bell-ring

lvgl:
  pages:
    # Holding page (never shown): content_timer is moved into the tab and the
    # chip into the status bar at boot
    - id: holding_timer
      skip: true
      widgets:
        # Status-bar chip: timer icon and the soonest time left
        - button:
            id: chip_timer
            width: SIZE_CONTENT
            height: ${30*px}
            styles: icon_btn
            hidden: true
            layout:
              type: FLEX
              flex_flow: ROW
              flex_align_main: START
              flex_align_cross: CENTER
              flex_align_track: CENTER
              pad_column: ${3*px//1}
            widgets:
              - label:
                  text: "\U000F051B" # mdi-timer-outline
                  text_font: timer_icons_sm
                  text_color: ${c_text}
              - label:
                  id: lbl_chip_timer
                  text: ""
                  text_font: font_title
                  text_color: ${c_text}
            on_click:
              - lambda: |-
                  if (id(tab_index_timer) >= 0)
                    lv_tabview_set_act(id(main_tabview), id(tab_index_timer), LV_ANIM_OFF);
              - script.execute: refresh_tab_bar

        # 480 x 390 (1x): running timers on top, presets below
        - obj:
            id: content_timer
            width: 100%
            height: 100%
            styles: container
            scrollable: false
            scrollbar_mode: "off"
            widgets:
              - label:
                  id: lbl_timer_empty
                  text: "No timers running"
                  text_color: ${c_text_2}
                  align: TOP_MID
                  y: ${104*px}
              # Up to four rows, 50 high, 8 apart
              - obj:
                  align: TOP_MID
                  y: ${10*px}
                  width: ${456*px}
                  height: ${224*px}
                  styles: transparent
                  scrollable: false
                  clickable: false
                  layout:
                    type: FLEX
                    flex_flow: COLUMN
                    flex_align_main: START
                    flex_align_cross: CENTER
                    flex_align_track: START
                    pad_row: ${8*px}
                  widgets:
                    - obj:
                        id: timer_row_1
                        width: 100%
                        height: ${50*px}
                        styles: card
                        scrollable: false
                        clickable: false
                        hidden: true
                        widgets:
                          - label:
                              id: lbl_tr_name_1
                              text: ""
                              text_color: ${c_text_2}
                              long_mode: DOT
                              width: ${170*px}
                              align: LEFT_MID
                              x: ${16*px}
                              y: -${2*px}
                          - label:
                              id: lbl_tr_time_1
                              text: ""
                              text_font: font_title
                              text_color: ${c_text}
                              align: RIGHT_MID
                              x: -${110*px}
                              y: -${2*px}
                          - button:
                              id: btn_tr_add_1
                              align: RIGHT_MID
                              x: -${52*px}
                              y: -${2*px}
                              width: ${52*px}
                              height: ${34*px}
                              styles: chip
                              bg_color: ${c_surface_2}
                              widgets:
                                - label:
                                    text: "+1m"
                                    text_color: ${c_text}
                                    align: CENTER
                              on_click:
                                - script.execute:
                                    id: timer_row_add
                                    row: 0
                          - button:
                              id: btn_tr_del_1
                              align: RIGHT_MID
                              x: -${8*px}
                              y: -${2*px}
                              width: ${34*px}
                              height: ${34*px}
                              styles: round_btn
                              bg_color: ${c_surface_2}
                              widgets:
                                - label:
                                    text: "\U000F0156" # mdi-close
                                    text_font: timer_icons_sm
                                    text_color: ${c_text}
                                    align: CENTER
                              on_click:
                                - script.execute:
                                    id: timer_row_cancel
                                    row: 0
                          # Progress line along the bottom edge
                          - obj:
                              align: BOTTOM_MID
                              y: -${4*px}
                              width: ${424*px}
                              height: ${3*px//1}
                              radius: ${2*px}
                              bg_color: ${c_surface_2}
                              bg_opa: COVER
                              border_width: 0
                              pad_all: 0
                              scrollable: false
                              clickable: false
                              widgets:
                                - obj:
                                    id: tr_fill_1
                                    align: LEFT_MID
                                    width: ${424*px}
                                    height: 100%
                                    radius: ${2*px}
                                    bg_color: ${c_accent}
                                    bg_opa: COVER
                                    border_width: 0
                                    pad_all: 0
                                    clickable: false
                    - obj:
                        id: timer_row_2
                        width: 100%
                        height: ${50*px}
                        styles: card
                        scrollable: false
                        clickable: false
                        hidden: true
                        widgets:
