# Tab: Music (iOS Now Playing style) for a Music Assistant / media player.
#
#   tab_music: !include
#     file: panel/tabs/music.yaml
#     vars:
#       tab_position: 3                         # 2-9, order in the tab bar
#       music_player: media_player.family_room_2
#
# The tab selects itself when the player starts playing after a real stop
# (see media_autoswitch_gap_ms).

globals:
  - id: tab_index_music
    type: int
    initial_value: "-1"
  - id: music_playing
    type: bool
    initial_value: "false"
  - id: music_stopped_ms
    type: uint32_t
    initial_value: "0"
  # Last album art URL fetched, so repeats of the same URL are skipped
  - id: last_album_art_url
    type: std::string
    initial_value: '""'
  # The album art shown: a PSRAM copy of the shared art loader's picture
  - id: album_art_dsc
    type: lv_image_dsc_t *
    initial_value: "nullptr"

esphome:
  on_boot:
    - priority: -10${tab_position}
      then:
        - lambda: |-
            lv_obj_t *tab = lv_tabview_add_tab(id(main_tabview), "Music");
            ::lv_image_set_src(id(lvgl_album_art), (const void *) nullptr);   // empty until the first art
            lv_obj_set_style_pad_all(tab, 0, 0);
            lv_obj_set_scrollbar_mode(tab, LV_SCROLLBAR_MODE_OFF);
            lv_obj_set_parent(id(content_music), tab);
            id(tab_index_music) = lv_obj_get_index(tab);
            // "Play on" sheet: onto the main screen, list in one column
            lv_obj_set_parent(id(music_playon_panel), id(ui_root));
            lv_obj_set_flex_flow(id(speaker_list), LV_FLEX_FLOW_COLUMN);
            lv_obj_set_flex_align(id(speaker_list), LV_FLEX_ALIGN_START, LV_FLEX_ALIGN_CENTER, LV_FLEX_ALIGN_START);
            lv_obj_set_style_pad_row(id(speaker_list), ${(10*px)|int}, 0);
    # No speaker items: no "Play on" button
    - priority: -305
      then:
        - lambda: |-
            if (lv_obj_get_child_cnt(id(speaker_list)) == 0)
              lv_obj_add_flag(id(music_btn_playon), LV_OBJ_FLAG_HIDDEN);

script:
  # Night clock: "Title · Artist" on its own line while music plays
  - id: night_music_update
    mode: restart
    then:
      - lambda: |-
          const std::string &t = id(media_title_text).state, &a = id(media_artist_text).state;
          bool show = id(media_state_text).state == "playing" && !t.empty() && t != "unknown";
          if (show) {
            std::string line = (a.empty() || a == "unknown") ? t : t + " \u00B7 " + a;
            lv_label_set_text(id(lbl_night_music), line.c_str());
            lv_obj_clear_flag(id(lbl_night_music), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(lbl_night_music), LV_OBJ_FLAG_HIDDEN);
          }

  # Debounced album art fetch: rapid track skips restart the delay, so only
  # the final track's art is downloaded (downloads briefly block the UI)
  - id: load_album_art
    mode: restart
    parameters:
      url: string
    then:
      - delay: 1500ms
      - if:
          condition:
            lambda: "return url != id(last_album_art_url);"
          then:
            - lambda: "id(last_album_art_url) = url;"
            - wait_until:
                condition:
                  lambda: "return !id(img_busy) || millis() - id(img_busy_ms) > 15000;"
                timeout: 15s
            - lambda: |-
                id(img_busy) = true;
                id(img_busy_ms) = millis();
                // Shared loader (core/images.yaml); keep a copy of the picture
                id(art_cb) = [](bool ok) {
                  if (!ok) { ESP_LOGW("music", "Album art download failed"); return; }
                  id(img_show)(id(lvgl_album_art), &id(album_art_dsc), id(art_loader)->get_lv_image_dsc(), ${(180*px)|int});
                };
                id(art_loader)->set_url(url);
                id(art_loader)->update();

sensor:
  - platform: homeassistant
    id: media_position_sensor
    entity_id: ${music_player}
    attribute: media_position
    on_value:
      - lvgl.bar.update:
          id: bar_track_progress
          value: !lambda |-
            float dur = id(media_duration_sensor).state;
            if (dur <= 0) return 0;
            int pct = (int)(x / dur * 100.0f);
            return pct > 100 ? 100 : pct;
      - lvgl.label.update:
          id: lbl_time_elapsed
          text: !lambda |-
            int pos = (int)x;
            char buf[16];
            snprintf(buf, sizeof(buf), "%d:%02d", pos / 60, pos % 60);
            return std::string(buf);
      - lvgl.label.update:
          id: lbl_time_total
          text: !lambda |-
            float d = id(media_duration_sensor).state;
            int dur = isnan(d) ? 0 : (int)d;
            char buf[16];
            snprintf(buf, sizeof(buf), "%d:%02d", dur / 60, dur % 60);
            return std::string(buf);

  - platform: homeassistant
    id: media_duration_sensor
    entity_id: ${music_player}
    attribute: media_duration

  # Volume slider follows the player (unless a finger is on it)
  - platform: homeassistant
    id: music_volume_level
    entity_id: ${music_player}
    attribute: volume_level
    on_value:
      - lambda: |-
          if (isnan(x) || lv_obj_has_state(id(music_volume), LV_STATE_PRESSED)) return;
          lv_slider_set_value(id(music_volume), lroundf(x * 100.0f), LV_ANIM_OFF);

binary_sensor:
  - platform: homeassistant
    id: music_muted
    entity_id: ${music_player}
    attribute: is_volume_muted
    on_state:
      - lambda: |-
          lv_label_set_text(id(lbl_music_mute), x ? "\U000F0581" : "\U000F057E");   // volume-off / volume-high
          lv_obj_set_style_text_color(id(lbl_music_mute), lv_color_hex(x ? 0xFF453A : ${c_text_2}), LV_PART_MAIN);

  - platform: homeassistant
    id: music_shuffle
    entity_id: ${music_player}
    attribute: shuffle
    on_state:
      - lambda: |-
          lv_obj_set_style_text_color(id(lbl_music_shuffle), lv_color_hex(x ? ${c_text} : ${c_text_2}), LV_PART_MAIN);

text_sensor:
  # Grouped with other speakers? Light up the "Play on" icon.
  - platform: homeassistant
    id: music_group
    entity_id: ${music_player}
    attribute: group_members
    on_value:
      - lambda: |-
          bool grouped = x.find(',') != std::string::npos;   // 2+ members
          lv_obj_set_style_text_color(id(lbl_music_playon), lv_color_hex(grouped ? ${c_text} : ${c_text_2}), LV_PART_MAIN);
          if (grouped) lv_obj_clear_flag(id(music_btn_match), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_add_flag(id(music_btn_match), LV_OBJ_FLAG_HIDDEN);

  - platform: homeassistant
    id: music_repeat
    entity_id: ${music_player}
    attribute: repeat
    on_value:
      - lambda: |-
          const char *g = "\U000F0457";                 // repeat-off
          if (x == "one") g = "\U000F0458";             // repeat-once
          else if (x == "all") g = "\U000F0456";        // repeat
          lv_label_set_text(id(lbl_music_repeat), g);
          lv_obj_set_style_text_color(id(lbl_music_repeat), lv_color_hex(x == "off" ? ${c_text_2} : ${c_text}), LV_PART_MAIN);

  - platform: homeassistant
    id: media_title_text
    entity_id: ${music_player}
    attribute: media_title
    on_value:
      - lvgl.label.update:
          id: lbl_track_name
          text: !lambda "return x.c_str();"
      - script.execute: night_music_update

  - platform: homeassistant
    id: media_artist_text
    entity_id: ${music_player}
    attribute: media_artist
    on_value:
      - lvgl.label.update:
          id: lbl_artist_name
          text: !lambda "return x.c_str();"
      - script.execute: night_music_update

  # Player state: show pause while playing, play otherwise.
  # Also brings up the Music tab when playback (re)starts after a real stop.
  - platform: homeassistant
    id: media_state_text
    entity_id: ${music_player}
    on_value:
      - script.execute: night_music_update
      - lvgl.label.update:
          id: lbl_music_playpause
          text: !lambda |-
            return std::string(x == "playing" ? "\U000F03E4" : "\U000F040A");
      - if:
          condition:
            lambda: |-
              bool playing = (x == "playing");
              bool start = playing && !id(music_playing) &&
                (id(music_stopped_ms) == 0 ||
                 millis() - id(music_stopped_ms) >= ${media_autoswitch_gap_ms});
              if (!playing && id(music_playing)) id(music_stopped_ms) = millis();
              id(music_playing) = playing;
              return start && id(tab_index_music) >= 0 && id(sw_auto_media_tabs).state;
          then:
            - lambda: "lv_tabview_set_act(id(main_tabview), id(tab_index_music), LV_ANIM_OFF);"
            - script.execute: refresh_tab_bar

  - platform: homeassistant
    id: media_entity_picture
    entity_id: ${music_player}
    attribute: entity_picture
    on_value:
      - if:
          condition:
            lambda: "return !x.empty();"
          then:
            - script.execute:
                id: load_album_art
                url: !lambda |-
                  std::string u = x.rfind("http", 0) == 0 ? x : std::string("${ha_url}") + x;
                  // SiriusXM channel logos: its https certificate isn't in the
                  // panel's certificate bundle, but the same file is on http
                  if (u.rfind("https://pri.art.prod.streaming.siriusxm.com/", 0) == 0) u.erase(4, 1);
                  // Music Assistant artwork comes as a 512 px PNG; ask its
                  // image proxy for a 256 px JPEG, which the panel decodes
                  if (u.find("/imageproxy") != std::string::npos) {
                    size_t f = u.find("fmt=png");
                    if (f != std::string::npos) u.replace(f, 7, "fmt=jpeg");
                    f = u.find("size=512");
                    if (f != std::string::npos) u.replace(f, 8, "size=256");
                  }
                  return u;

lvgl:
  pages:
    # Holding page (never shown): content_music is moved into the Music tab at boot
    - id: holding_music
      skip: true
      widgets:
        - obj:
            id: content_music
            width: 100%
            height: 100%
            styles: container
            scrollbar_mode: "off"
            widgets:
              # ── "Play on" (other speakers) ────────────
              - button:
                  id: music_btn_playon
                  align: TOP_RIGHT
                  x: -${10*px}
                  y: ${8*px}
                  width: ${52*px}
                  height: ${48*px}
                  styles: icon_btn
                  widgets:
                    - label:
                        id: lbl_music_playon
                        text: "\U000F0D38" # mdi-speaker-multiple
                        text_font: icons_md
                        text_color: ${c_text_2}
                        align: CENTER
                  on_click:
                    - lambda: |-
                        lv_obj_clear_flag(id(music_playon_panel), LV_OBJ_FLAG_HIDDEN);
                        lv_obj_move_foreground(id(music_playon_panel));

              # ── Album Art (rounded) ───────────────────
              - obj:
                  align: TOP_MID
                  y: ${6*px}
                  width: ${180*px}
                  height: ${180*px}
                  styles: art_frame
                  radius: ${14*px}
                  clickable: false
                  scrollable: false
                  scrollbar_mode: "off"
                  widgets:
                    - image:
                        id: lvgl_album_art
                        src: art_loader   # replaced by a copy (load_album_art)
                        align: CENTER

              # ── Track Name ────────────────────────────
              - label:
                  id: lbl_track_name
                  text: "—"
                  text_color: ${c_text}
                  text_font: font_title
                  text_align: CENTER
                  long_mode: DOT
                  width: ${420*px}
                  align: TOP_MID
                  y: ${196*px}

              # ── Artist Name ───────────────────────────
              - label:
                  id: lbl_artist_name
                  text: "—"
                  text_color: ${c_text_2}
                  text_font: font_body
                  text_align: CENTER
                  long_mode: DOT
                  width: ${420*px}
                  align: TOP_MID
                  y: ${222*px}

              # ── Progress Bar + times ──────────────────
              - bar:
                  id: bar_track_progress
                  align: TOP_MID
                  y: ${250*px}
                  width: ${400*px}
                  height: ${4*px}
                  min_value: 0
                  max_value: 100
                  value: 0

              - label:
                  id: lbl_time_elapsed
                  text: "0:00"
                  text_color: ${c_text_2}
                  text_font: font_caption
                  align: TOP_LEFT
                  x: ${40*px}
                  y: ${260*px}

              - label:
                  id: lbl_time_total
                  text: "0:00"
                  text_color: ${c_text_2}
                  text_font: font_caption
                  align: TOP_RIGHT
                  x: -${40*px}
                  y: ${260*px}

              # ── Transport: Prev | Play/Pause | Next ───
              - button:
                  id: music_btn_prev
                  align: TOP_MID
                  x: -${112*px}
                  y: ${284*px}
                  width: ${64*px}
                  height: ${56*px}
                  styles: icon_btn
                  widgets:
                    - label:
                        text: "\U000F04AE" # mdi-skip-previous
                        text_font: icons_xl
                        align: CENTER
                  on_click:
                    - homeassistant.action:
                        action: media_player.media_previous_track
                        data:
                          entity_id: ${music_player}

              - button:
                  id: music_btn_playpause
                  align: TOP_MID
                  y: ${280*px}
                  width: ${64*px}
                  height: ${64*px}
                  styles: round_btn
                  bg_color: ${c_accent}
                  pressed:
                    bg_color: ${c_text_2}
                  widgets:
                    - label:
                        id: lbl_music_playpause
                        text: "\U000F040A" # mdi-play
                        text_font: icons_xl
                        text_color: ${c_on_accent}
                        align: CENTER
                  on_click:
                    - homeassistant.action:
                        action: media_player.media_play_pause
                        data:
                          entity_id: ${music_player}

              - button:
                  id: music_btn_next
                  align: TOP_MID
                  x: ${112*px}
                  y: ${284*px}
                  width: ${64*px}
                  height: ${56*px}
                  styles: icon_btn
                  widgets:
                    - label:
                        text: "\U000F04AD" # mdi-skip-next
                        text_font: icons_xl
                        align: CENTER
                  on_click:
                    - homeassistant.action:
                        action: media_player.media_next_track
                        data:
                          entity_id: ${music_player}

              # ── Shuffle and repeat flank the transport row; below them a
              #    full-width volume row (mute + slider) ───────────────────
              - button:
                  id: music_btn_shuffle
                  align: TOP_MID
                  x: -${194*px}
                  y: ${288*px}
                  width: ${48*px}
                  height: ${48*px}
                  styles: icon_btn
                  widgets:
                    - label:
                        id: lbl_music_shuffle
                        text: "\U000F049D" # mdi-shuffle
                        text_font: icons_md
                        text_color: ${c_text_2}
                        align: CENTER
                  on_click:
                    - homeassistant.action:
                        action: media_player.shuffle_set
                        data:
                          entity_id: ${music_player}
                          shuffle: !lambda 'return id(music_shuffle).state ? "false" : "true";'

              - button:
                  id: music_btn_mute
                  align: TOP_LEFT
                  x: ${14*px}
                  y: ${350*px}
                  width: ${44*px}
                  height: ${38*px}
                  styles: icon_btn
                  widgets:
                    - label:
                        id: lbl_music_mute
                        text: "\U000F057E" # mdi-volume-high
                        text_font: icons_md
                        text_color: ${c_text_2}
                        align: CENTER
                  on_click:
                    - homeassistant.action:
                        action: media_player.volume_mute
                        data:
                          entity_id: ${music_player}
                          is_volume_muted: !lambda 'return id(music_muted).state ? "false" : "true";'

              - slider:
                  id: music_volume
                  align: TOP_LEFT
                  x: ${66*px}
                  y: ${355*px//1}
                  width: ${400*px}
                  height: ${28*px}
                  min_value: 0
                  max_value: 100
                  value: 0
                  on_release:
                    - homeassistant.action:
                        action: media_player.volume_set
                        data:
                          entity_id: ${music_player}
                          volume_level: !lambda "return x / 100.0f;"

              - button:
                  id: music_btn_repeat
                  align: TOP_MID
                  x: ${194*px}
                  y: ${288*px}
                  width: ${48*px}
                  height: ${48*px}
                  styles: icon_btn
                  widgets:
                    - label:
                        id: lbl_music_repeat
                        text: "\U000F0457" # mdi-repeat-off
                        text_font: icons_md
                        text_color: ${c_text_2}
                        align: CENTER
                  on_click:
                    # off -> all -> one -> off
                    - homeassistant.action:
                        action: media_player.repeat_set
                        data:
                          entity_id: ${music_player}
                          repeat: !lambda |-
                            const std::string &r = id(music_repeat).state;
                            if (r == "off") return std::string("all");
                            if (r == "all") return std::string("one");
                            return std::string("off");

    # Holding page (never shown): the "Play on" sheet is moved onto ui_root
    - id: holding_playon
      skip: true
      widgets:
        - obj:
            id: music_playon_panel
            width: 100%
            height: 100%
            align: TOP_LEFT
            styles: container
            scrollable: false
            scrollbar_mode: "off"
            hidden: true
            widgets:
              - label:
                  text: "Play on"
                  text_font: font_title
                  align: TOP_LEFT
                  x: ${20*px}
                  y: ${22*px}
              - button:
                  align: TOP_RIGHT
                  x: -${10*px}
                  y: ${12*px}
                  width: ${90*px}
                  height: ${44*px}
                  bg_opa: TRANSP
                  radius: ${22*px}
                  pad_all: 0
                  pressed:
                    bg_color: ${c_surface}
                    bg_opa: COVER
                  widgets:
                    - label:
                        text: "Done"
                        text_font: font_title
                        text_color: ${c_accent}
                        align: CENTER
                  on_click:
                    - lvgl.widget.hide: music_playon_panel
              - label:
                  text: "Tap a speaker to add it to this music or remove it."
                  text_font: font_caption
                  text_color: ${c_text_2}
                  long_mode: WRAP
                  width: ${440*px}
                  align: TOP_LEFT
                  x: ${20*px}
                  y: ${66*px}
              # Speaker rows (items/speaker.yaml)
              - obj:
                  id: speaker_list
                  align: TOP_MID
                  y: ${100*px}
                  width: ${448*px}
                  height: ${300*px}
                  styles: transparent
                  scrollbar_mode: "off"
              # Match volumes: every grouped speaker to this room's level
              - button:
                  id: music_btn_match
                  align: BOTTOM_MID
                  y: -${16*px}
                  width: ${240*px}
                  height: ${48*px}
                  radius: ${24*px}
                  bg_color: ${c_surface_2}
                  bg_opa: COVER
                  hidden: true
                  widgets:
                    - label:
                        text: "Match volumes"
                        text_font: font_title
                        align: CENTER
                  on_click:
                    - homeassistant.action:
                        action: media_player.volume_set
                        data:
                          # group_members "['media_player.a', 'media_player.b']" -> "media_player.a,media_player.b"
                          entity_id: !lambda |-
                            std::string out;
                            for (char c : id(music_group).state)
                              if (c != '[' && c != ']' && c != '\'' && c != '"' && c != ' ') out += c;
                            return out;
                          volume_level: !lambda |-
                            float v = id(music_volume_level).state;
                            return isnan(v) ? 0.5f : v;
