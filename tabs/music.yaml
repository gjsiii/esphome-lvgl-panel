# Tab: Music (iOS Now Playing style) for a Music Assistant / media player.
#
#   tab_music: !include
#     file: panel/tabs/music.yaml
#     vars:
#       tab_position: 3                         # 2-9, order in the tab bar
#       music_player: media_player.family_room_2
#
#       # music_lyrics: "false"                # portrait: no lyrics button
#
# The tab selects itself when the player starts playing after a real stop
# (see media_autoswitch_gap_ms).
#
# Portrait screens (screen_h > 480, e.g. the handheld remote) get their own
# layout: 320 px artwork, Play on and Lyrics either side of the title, the
# transport row, and volume - / slider / + (the speaker icon inside the
# slider mutes). The Lyrics button swaps the artwork for the song's lyrics,
# following along when they have timestamps. Lyrics come from LRCLIB through
# ha/panel_lyrics.yaml (install it in HA, or set music_lyrics: "false").

defaults:
  music_lyrics: "true"

substitutions:
  music_volume_step: "5"   # % per tap of the volume - / + buttons

globals:
  - id: tab_index_music
    type: int
    initial_value: "-1"
  - id: music_playing
    type: bool
    initial_value: "false"
  - id: music_stopped_ms
    type: uint32_t
    initial_value: "0"
  # Last album art URL fetched, so repeats of the same URL are skipped
  - id: last_album_art_url
    type: std::string
    initial_value: '""'
  # The album art shown: a PSRAM copy of the shared art loader's picture
  - id: album_art_dsc
    type: lv_image_dsc_t *
    initial_value: "nullptr"
  # Portrait: where the song was at millis() == music_pos_ms. HA reports a
  # position with the time it was taken (not when it arrives), and only now
  # and then; between songs the old report lingers, so a new title restarts
  # at 0 until a fresh report (music_stale_at = the report to ignore).
  - id: music_pos_s
    type: float
    initial_value: "NAN"
  - id: music_pos_ms
    type: uint32_t
    initial_value: "0"
  - id: music_stale_at
    type: std::string
    initial_value: '""'
  # Portrait lyrics: the song they belong to, lines and their start times
  # (ms; synced only), the line shown as current, and whether the lyrics
  # view is up
  - id: lyr_key
    type: std::string
    initial_value: '""'
  - id: lyr_lines
    type: std::vector<std::string>
    initial_value: "std::vector<std::string>()"   # "{}" is ambiguous for GlobalsComponent
  - id: lyr_ms
    type: std::vector<int32_t>
    initial_value: "std::vector<int32_t>()"   # "{}" is ambiguous for GlobalsComponent
  - id: lyr_synced
    type: bool
    initial_value: "false"
  - id: lyr_cur
    type: int
    initial_value: "-2"
  - id: lyr_view
    type: bool
    initial_value: "false"

esphome:
  includes:
    - <sys/time.h>   # gettimeofday (music_pos_anchor)
  on_boot:
    - priority: -10${tab_position}
      then:
        - lambda: |-
            lv_obj_t *tab = lv_tabview_add_tab(id(main_tabview), "Music");
            ::lv_image_set_src(id(lvgl_album_art), (const void *) nullptr);   // empty until the first art
            lv_obj_set_style_pad_all(tab, 0, 0);
            lv_obj_set_scrollbar_mode(tab, LV_SCROLLBAR_MODE_OFF);
            lv_obj_set_parent(id(content_music), tab);
            id(tab_index_music) = lv_obj_get_index(tab);
            // "Play on" sheet: onto the main screen, list in one column
            lv_obj_set_parent(id(music_playon_panel), id(ui_root));
            lv_obj_set_flex_flow(id(speaker_list), LV_FLEX_FLOW_COLUMN);
            lv_obj_set_flex_align(id(speaker_list), LV_FLEX_ALIGN_START, LV_FLEX_ALIGN_CENTER, LV_FLEX_ALIGN_START);
            lv_obj_set_style_pad_row(id(speaker_list), ${(10*px)|int}, 0);
    # Portrait: the mute icon sits inside the slider's left end (drawn on top)
    - priority: -305
      then:
        - lambda: |-
            if (${ 'true' if screen_h > 480 else 'false' }) lv_obj_move_foreground(id(music_btn_mute));
    # No speaker items: no "Play on" button
    - priority: -305
      then:
        - lambda: |-
            if (lv_obj_get_child_cnt(id(speaker_list)) == 0)
              lv_obj_add_flag(id(music_btn_playon), LV_OBJ_FLAG_HIDDEN);

script:
  # Volume - / + buttons: move to the next multiple of the step. Works from
  # the slider (updated at once), not the player's reported level, which
  # lags, so quick repeated taps all count.
  - id: music_volume_nudge
    mode: queued
    parameters:
      up: bool
    then:
      - lambda: |-
          const int s = ${music_volume_step};
          int cur = lv_slider_get_value(id(music_volume));
          int v = up ? (cur / s + 1) * s : ((cur + s - 1) / s - 1) * s;
          lv_slider_set_value(id(music_volume), std::max(0, std::min(100, v)), LV_ANIM_OFF);
      - homeassistant.action:
          action: media_player.volume_set
          data:
            entity_id: ${music_player}
            volume_level: !lambda "return lv_slider_get_value(id(music_volume)) / 100.0f;"

  # Portrait: a position report arrived (position + the time it was taken):
  # work out where the song is now
  - id: music_pos_anchor
    then:
      - lambda: |-
          float p = id(media_position_sensor).state;
          const std::string &at = id(media_pos_at_text).state;
          if (isnan(p) || at.empty() || at == id(music_stale_at)) return;
          id(music_stale_at) = "";
          float age = 0;
          // "2026-10-24T12:37:27.269000+00:00" -> ms since the epoch
          int Y, M, D, h, m, tzh = 0, tzm = 0; float sec; char sign = '+';
          if (sscanf(at.c_str(), "%d-%d-%dT%d:%d:%f%c%d:%d", &Y, &M, &D, &h, &m, &sec, &sign, &tzh, &tzm) >= 6) {
            int y = Y - (M <= 2);                       // days from civil (Howard Hinnant)
            int era = (y >= 0 ? y : y - 399) / 400;
            int yoe = y - era * 400;
            int doy = (153 * (M + (M > 2 ? -3 : 9)) + 2) / 5 + D - 1;
            int doe = yoe * 365 + yoe / 4 - yoe / 100 + doy;
            int64_t days = (int64_t) era * 146097 + doe - 719468;
            double at_s = days * 86400.0 + h * 3600 + m * 60 + sec - (sign == '-' ? -1 : 1) * (tzh * 3600 + tzm * 60);
            struct timeval tv;
            gettimeofday(&tv, nullptr);
            double now_s = tv.tv_sec + tv.tv_usec / 1e6;
            if (tv.tv_sec > 1600000000 && id(media_state_text).state == "playing") {
              age = (float) (now_s - at_s);
              if (age < 0 || age > 600) age = 0;        // clock not set / odd report
            }
          }
          id(music_pos_s) = p + age;
          id(music_pos_ms) = millis();

  # Where the song is now (s), or NAN
  - id: music_progress_tick
    then:
      - lambda: |-
          float dur = id(media_duration_sensor).state, pos = id(music_pos_s);
          if (isnan(dur) || dur <= 0 || isnan(pos)) return;
          if (id(music_playing)) pos += (millis() - id(music_pos_ms)) / 1000.0f;
          if (pos > dur) pos = dur;
          lv_bar_set_value(id(bar_track_progress), (int) (pos / dur * 100.0f), LV_ANIM_OFF);
          int t = (int) pos;
          char buf[16];
          snprintf(buf, sizeof(buf), "%d:%02d", t / 60, t % 60);
          lv_label_set_text(id(lbl_time_elapsed), buf);

  # ── Lyrics (portrait) ─────────────────────────────────────────────────────
  # New song: after the captions settle, ask HA (ha/panel_lyrics.yaml) once
  - id: lyrics_fetch
    mode: restart
    then:
      - delay: 2s
      - if:
          condition:
            lambda: |-
              if (!${ 'true' if (screen_h > 480 and music_lyrics | string | lower == 'true') else 'false' }) return false;
              const std::string &a = id(media_artist_text).state, &t = id(media_title_text).state;
              if (a.empty() || t.empty() || a == "unknown" || t == "unknown") return false;
              std::string key = a + "|" + t;
              if (key == id(lyr_key)) return false;
              id(lyr_key) = key;
              id(lyr_lines).clear();
              id(lyr_ms).clear();
              id(lyr_synced) = false;
              id(lyr_cur) = -2;
              id(lyrics_render).execute();
              return true;
          then:
            - homeassistant.action:
                action: script.panel_lyrics
                data:
                  artist: !lambda "return id(media_artist_text).state;"
                  title: !lambda "return id(media_title_text).state;"
                  album: !lambda "return id(media_album_text).state;"
                  duration: !lambda |-
                    float d = id(media_duration_sensor).state;
                    return to_string(isnan(d) ? 0 : (int) d);
                capture_response: true
                on_success:
                  - lambda: |-
                      // HA sends the script's answer as {"response": {...}}
                      JsonObjectConst r = response["response"].is<JsonObjectConst>()
                          ? response["response"].as<JsonObjectConst>() : response;
                      std::string txt = r["lyrics"] | "";
                      bool synced = r["synced"] | false;
                      auto &lines = id(lyr_lines);
                      auto &ms = id(lyr_ms);
                      lines.clear();
                      ms.clear();
                      // One entry per line; synced lines start "[mm:ss.xx]"
                      // (possibly several stamps), other tags are skipped
                      std::vector<std::pair<int32_t, std::string>> timed;
                      size_t at = 0;
                      while (at <= txt.size()) {
                        size_t nl = txt.find('\n', at);
                        if (nl == std::string::npos) nl = txt.size();
                        std::string line = txt.substr(at, nl - at);
                        at = nl + 1;
                        if (!line.empty() && line.back() == '\r') line.pop_back();
                        if (!synced) { lines.push_back(line); continue; }
                        std::vector<int32_t> stamps;
                        size_t p = 0;
                        while (p < line.size() && line[p] == '[') {
                          size_t q = line.find(']', p);
                          if (q == std::string::npos) break;
                          int m = 0; float sec = 0;
                          if (sscanf(line.c_str() + p + 1, "%d:%f", &m, &sec) == 2) stamps.push_back((int32_t) ((m * 60 + sec) * 1000));
                          p = q + 1;
                        }
                        if (stamps.empty()) continue;
                        while (p < line.size() && line[p] == ' ') p++;
                        for (int32_t t : stamps) timed.emplace_back(t, line.substr(p));
                      }
                      if (synced) {
                        std::stable_sort(timed.begin(), timed.end(), [](auto &a, auto &b) { return a.first < b.first; });
                        for (auto &e : timed) { ms.push_back(e.first); lines.push_back(e.second); }
                      }
                      while (!lines.empty() && lines.back().empty()) { lines.pop_back(); if (!ms.empty()) ms.pop_back(); }
                      id(lyr_synced) = synced && !lines.empty();
                      id(lyr_cur) = -2;
                      ESP_LOGI("music", "Lyrics: %u lines%s", (unsigned) lines.size(), id(lyr_synced) ? " (synced)" : "");
                  - script.execute: lyrics_render
                on_error:
                  - lambda: 'ESP_LOGW("music", "Lyrics lookup failed (is ha/panel_lyrics.yaml installed?)");'

  # Draw the lyrics view (or the artwork) and the Lyrics button's state
  - id: lyrics_render
    then:
      - lambda: |-
          if (!${ 'true' if (screen_h > 480 and music_lyrics | string | lower == 'true') else 'false' }) return;
          bool have = !id(lyr_lines).empty();
          bool view = id(lyr_view);
          // Button: filled while the lyrics show; white when there are some
          lv_obj_set_style_bg_opa(id(music_btn_lyrics), view ? LV_OPA_COVER : LV_OPA_TRANSP, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_music_lyrics), lv_color_hex(view ? ${c_on_accent} : (have ? ${c_text} : ${c_text_2})), LV_PART_MAIN);
          if (view) {
            lv_obj_clear_flag(id(music_lyrics_card), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(music_art_frame), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(music_lyrics_card), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(music_art_frame), LV_OBJ_FLAG_HIDDEN);
            return;
          }
          lv_obj_t *slots[7] = {id(lyr_l0), id(lyr_l1), id(lyr_l2), id(lyr_l3), id(lyr_l4), id(lyr_l5), id(lyr_l6)};
          if (!id(lyr_synced)) {
            // Plain lyrics (or none): one scrolling text
            for (auto *l : slots) lv_obj_add_flag(l, LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(lyr_plain), LV_OBJ_FLAG_HIDDEN);
            if (id(lyr_cur) != -1) {
              id(lyr_cur) = -1;
              std::string all;
              for (auto &l : id(lyr_lines)) { all += l; all += "\n"; }
              if (all.empty()) all = id(lyr_key).empty() ? "No song playing" : "No lyrics found for this song";
              lv_label_set_text(id(lyr_plain), all.c_str());
              lv_obj_scroll_to_y(id(music_lyrics_card), 0, LV_ANIM_OFF);
            }
            return;
          }
          // Synced: the current line in the middle, three either side
          lv_obj_add_flag(id(lyr_plain), LV_OBJ_FLAG_HIDDEN);
          float pos = id(music_pos_s);
          if (isnan(pos)) pos = 0;
          if (id(music_playing)) pos += (millis() - id(music_pos_ms)) / 1000.0f;
          // A touch early reads better; Lyrics Delay holds them back for
          // speakers that play behind the reported position (e.g. Sonos)
          int32_t now = (int32_t) (pos * 1000) + 250 - (int32_t) (id(lyrics_delay).state * 1000);
          const auto &ms = id(lyr_ms);
          int cur = (int) (std::upper_bound(ms.begin(), ms.end(), now) - ms.begin()) - 1;
          if (cur == id(lyr_cur)) return;
          id(lyr_cur) = cur;
          static const uint32_t colors[4] = {${c_text}, 0x8E8E93, 0x636366, 0x48484A};
          const int n = (int) id(lyr_lines).size();
          for (int i = 0; i < 7; i++) {
            int k = cur + i - 3, d = abs(i - 3);
            lv_obj_t *l = slots[i];
            lv_obj_clear_flag(l, LV_OBJ_FLAG_HIDDEN);
            lv_label_set_text(l, (k >= 0 && k < n) ? id(lyr_lines)[k].c_str() : "");
            lv_obj_set_style_text_color(l, lv_color_hex(colors[d]), LV_PART_MAIN);
            lv_obj_set_style_text_font(l, d == 0 ? id(font_title)->get_lv_font() : id(font_body)->get_lv_font(), LV_PART_MAIN);
          }

  # Night clock: "Title · Artist" on its own line while music plays
  - id: night_music_update
    mode: restart
    then:
      - lambda: |-
          const std::string &t = id(media_title_text).state, &a = id(media_artist_text).state;
          bool show = id(media_state_text).state == "playing" && !t.empty() && t != "unknown";
          if (show) {
            std::string line = (a.empty() || a == "unknown") ? t : t + " \u00B7 " + a;
            lv_label_set_text(id(lbl_night_music), line.c_str());
            lv_obj_clear_flag(id(lbl_night_music), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(lbl_night_music), LV_OBJ_FLAG_HIDDEN);
          }

  # Debounced album art fetch: rapid track skips restart the delay, so only
  # the final track's art is downloaded (downloads briefly block the UI)
  - id: load_album_art
    mode: restart
    parameters:
      url: string
    then:
      - delay: 1500ms
      - if:
          condition:
            lambda: "return url != id(last_album_art_url);"
          then:
            - lambda: "id(last_album_art_url) = url;"
            - wait_until:
                condition:
                  lambda: "return !id(img_busy) || millis() - id(img_busy_ms) > 15000;"
                timeout: 15s
            - lambda: |-
                id(img_busy) = true;
                id(img_busy_ms) = millis();
                // Shared loader (core/images.yaml); keep a copy of the picture
                id(art_cb) = [](bool ok) {
                  if (!ok) { ESP_LOGW("music", "Album art download failed"); return; }
                  id(img_show)(id(lvgl_album_art), &id(album_art_dsc), id(art_loader)->get_lv_image_dsc(), ${((320 if screen_h > 480 else 180)*px)|int});
                };
                id(art_loader)->set_url(url);
                id(art_loader)->update();

sensor:
  - platform: homeassistant
    id: media_position_sensor
    entity_id: ${music_player}
    attribute: media_position
    on_value:
      - script.execute: music_pos_anchor
      - lvgl.bar.update:
          id: bar_track_progress
          value: !lambda |-
            float dur = id(media_duration_sensor).state;
            if (dur <= 0) return 0;
            int pct = (int)(x / dur * 100.0f);
            return pct > 100 ? 100 : pct;
      - lvgl.label.update:
          id: lbl_time_elapsed
          text: !lambda |-
            int pos = (int)x;
            char buf[16];
            snprintf(buf, sizeof(buf), "%d:%02d", pos / 60, pos % 60);
            return std::string(buf);
      - lvgl.label.update:
          id: lbl_time_total
          text: !lambda |-
            float d = id(media_duration_sensor).state;
            int dur = isnan(d) ? 0 : (int)d;
            char buf[16];
            snprintf(buf, sizeof(buf), "%d:%02d", dur / 60, dur % 60);
            return std::string(buf);

  - platform: homeassistant
    id: media_duration_sensor
    entity_id: ${music_player}
    attribute: media_duration

  # Volume slider follows the player (unless a finger is on it)
  - platform: homeassistant
    id: music_volume_level
    entity_id: ${music_player}
    attribute: volume_level
    on_value:
      - lambda: |-
          if (isnan(x) || lv_obj_has_state(id(music_volume), LV_STATE_PRESSED)) return;
          lv_slider_set_value(id(music_volume), lroundf(x * 100.0f), LV_ANIM_OFF);

number:
  # Portrait lyrics: hold them back this many seconds (speaker latency)
  - platform: template
    id: lyrics_delay
    name: Lyrics Delay
    icon: mdi:timer-sand
    entity_category: config
    unit_of_measurement: s
    min_value: -5
    max_value: 10
    step: 0.5
    initial_value: 0
    optimistic: true
    restore_value: true
    mode: box
    internal: ${ 'false' if (screen_h > 480 and music_lyrics | string | lower == 'true') else 'true' }
    on_value:
      - lambda: "id(lyr_cur) = -2;"

binary_sensor:
  - platform: homeassistant
    id: music_muted
    entity_id: ${music_player}
    attribute: is_volume_muted
    on_state:
      - lambda: |-
          lv_label_set_text(id(lbl_music_mute), x ? "\U000F0581" : "\U000F057E");   // volume-off / volume-high
          lv_obj_set_style_text_color(id(lbl_music_mute), lv_color_hex(x ? 0xFF453A : ${c_text_2}), LV_PART_MAIN);

  - platform: homeassistant
    id: music_shuffle
    entity_id: ${music_player}
    attribute: shuffle
    on_state:
      - lambda: |-
          lv_obj_set_style_text_color(id(lbl_music_shuffle), lv_color_hex(x ? ${c_text} : ${c_text_2}), LV_PART_MAIN);

text_sensor:
  # Grouped with other speakers? Light up the "Play on" icon.
  - platform: homeassistant
    id: music_group
    entity_id: ${music_player}
    attribute: group_members
    on_value:
      - lambda: |-
          bool grouped = x.find(',') != std::string::npos;   // 2+ members
          lv_obj_set_style_text_color(id(lbl_music_playon), lv_color_hex(grouped ? ${c_text} : ${c_text_2}), LV_PART_MAIN);
          if (grouped) lv_obj_clear_flag(id(music_btn_match), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_add_flag(id(music_btn_match), LV_OBJ_FLAG_HIDDEN);

  - platform: homeassistant
    id: music_repeat
    entity_id: ${music_player}
    attribute: repeat
    on_value:
      - lambda: |-
          const char *g = "\U000F0457";                 // repeat-off
          if (x == "one") g = "\U000F0458";             // repeat-once
          else if (x == "all") g = "\U000F0456";        // repeat
          lv_label_set_text(id(lbl_music_repeat), g);
          lv_obj_set_style_text_color(id(lbl_music_repeat), lv_color_hex(x == "off" ? ${c_text_2} : ${c_text}), LV_PART_MAIN);

  - platform: homeassistant
    id: media_title_text
    entity_id: ${music_player}
    attribute: media_title
    on_value:
      - lvgl.label.update:
          id: lbl_track_name
          text: !lambda "return x.c_str();"
      - lambda: |-
          // New song: from 0 until HA reports a newer position
          id(music_stale_at) = id(media_pos_at_text).state;
          id(music_pos_s) = 0;
          id(music_pos_ms) = millis();
          id(lyr_cur) = -2;
      - script.execute: night_music_update
      - script.execute: lyrics_fetch

  - platform: homeassistant
    id: media_artist_text
    entity_id: ${music_player}
    attribute: media_artist
    on_value:
      - lvgl.label.update:
          id: lbl_artist_name
          text: !lambda "return x.c_str();"
      - script.execute: night_music_update
      - script.execute: lyrics_fetch

  # Album name (portrait lyrics lookup)
  - platform: homeassistant
    id: media_album_text
    entity_id: ${music_player}
    attribute: media_album_name

  # When the reported position was taken (portrait progress and lyrics)
  - platform: homeassistant
    id: media_pos_at_text
    entity_id: ${music_player}
    attribute: media_position_updated_at
    on_value:
      - script.execute: music_pos_anchor

  # Player state: show pause while playing, play otherwise.
  # Also brings up the Music tab when playback (re)starts after a real stop.
  - platform: homeassistant
    id: media_state_text
    entity_id: ${music_player}
    on_value:
      - script.execute: night_music_update
      - lvgl.label.update:
          id: lbl_music_playpause
          text: !lambda |-
            return std::string(x == "playing" ? "\U000F03E4" : "\U000F040A");
      - if:
          condition:
            lambda: |-
              bool playing = (x == "playing");
              bool start = playing && !id(music_playing) &&
                (id(music_stopped_ms) == 0 ||
                 millis() - id(music_stopped_ms) >= ${media_autoswitch_gap_ms});
              if (!playing && id(music_playing)) id(music_stopped_ms) = millis();
              id(music_playing) = playing;
              return start && id(tab_index_music) >= 0 && id(sw_auto_media_tabs).state;
          then:
            - lambda: "lv_tabview_set_act(id(main_tabview), id(tab_index_music), LV_ANIM_OFF);"
            - script.execute: refresh_tab_bar

  - platform: homeassistant
    id: media_entity_picture
    entity_id: ${music_player}
    attribute: entity_picture
    on_value:
      - if:
          condition:
            lambda: "return !x.empty();"
          then:
            - script.execute:
                id: load_album_art
                url: !lambda |-
                  std::string u = x.rfind("http", 0) == 0 ? x : std::string("${ha_url}") + x;
                  // Spotify / Apple / SiriusXM art over plain http (core/images.yaml)
                  u = id(art_http)(u);
                  // Music Assistant artwork comes as a 512 px PNG; ask its
                  // image proxy for a JPEG, which the panel decodes (256 px;
                  // portrait shows it at 320 px, so keep 512)
                  if (u.find("/imageproxy") != std::string::npos) {
                    size_t f = u.find("fmt=png");
                    if (f != std::string::npos) u.replace(f, 7, "fmt=jpeg");
                    f = u.find("size=512");
                    if (f != std::string::npos && !${ 'true' if screen_h > 480 else 'false' }) u.replace(f, 8, "size=256");
                  }
                  return u;

interval:
  # Portrait: progress bar every second, lyrics line four times a second
  - interval: 250ms
    then:
      - lambda: |-
          if (!${ 'true' if screen_h > 480 else 'false' }) return;
          if (lv_tabview_get_tab_active(id(main_tabview)) != id(tab_index_music)) return;
          static uint8_t n = 0;
          if (++n % 4 == 0 && id(music_playing)) id(music_progress_tick).execute();
          if (id(lyr_view) && id(lyr_synced)) id(lyrics_render).execute();

lvgl:
  pages:
    # Holding page (never shown): content_music is moved into the Music tab at boot
    - id: holding_music
      skip: true
      widgets:
        - obj:
            id: content_music
            width: 100%
            height: 100%
            styles: container
            scrollbar_mode: "off"
            widgets:
              # ── "Play on" (other speakers) ────────────
              # (portrait: left of the title)
              - button:
                  id: music_btn_playon
                  align: ${ 'TOP_LEFT' if screen_h > 480 else 'TOP_RIGHT' }
                  x: ${ (18 if screen_h > 480 else -10)*px }
                  y: ${ (360 if screen_h > 480 else 8)*px }
                  width: ${ (44 if screen_h > 480 else 52)*px }
                  height: ${ (44 if screen_h > 480 else 48)*px }
                  styles: icon_btn
                  widgets:
                    - label:
                        id: lbl_music_playon
                        text: "\U000F0D38" # mdi-speaker-multiple
                        text_font: icons_md
                        text_color: ${c_text_2}
                        align: CENTER
                  on_click:
                    - lambda: |-
                        lv_obj_clear_flag(id(music_playon_panel), LV_OBJ_FLAG_HIDDEN);
                        lv_obj_move_foreground(id(music_playon_panel));

              # ── Album Art (rounded) ───────────────────
              - obj:
                  id: music_art_frame
                  align: TOP_MID
                  y: ${ (16 if screen_h > 480 else 6)*px }
                  width: ${ (320 if screen_h > 480 else 180)*px }
                  height: ${ (320 if screen_h > 480 else 180)*px }
                  styles: art_frame
                  radius: ${ (16 if screen_h > 480 else 14)*px }
                  clickable: false
                  scrollable: false
                  scrollbar_mode: "off"
                  widgets:
                    - image:
                        id: lvgl_album_art
                        src: art_loader   # replaced by a copy (load_album_art)
                        align: CENTER

              # ── Track Name ────────────────────────────
              - label:
                  id: lbl_track_name
                  text: "—"
                  text_color: ${c_text}
                  text_font: font_title
                  text_align: CENTER
                  long_mode: DOT
                  width: ${ (340 if screen_h > 480 else 420)*px }
                  align: TOP_MID
                  y: ${ (350 if screen_h > 480 else 196)*px }

              # ── Artist Name ───────────────────────────
              - label:
                  id: lbl_artist_name
                  text: "—"
                  text_color: ${c_text_2}
                  text_font: font_body
                  text_align: CENTER
                  long_mode: DOT
                  width: ${ (340 if screen_h > 480 else 420)*px }
                  align: TOP_MID
                  y: ${ (382 if screen_h > 480 else 222)*px }

              # ── Progress Bar + times ──────────────────
              - bar:
                  id: bar_track_progress
                  align: TOP_MID
                  y: ${ (420 if screen_h > 480 else 250)*px }
                  width: ${400*px}
                  height: ${4*px}
                  min_value: 0
                  max_value: 100
                  value: 0

              - label:
                  id: lbl_time_elapsed
                  text: "0:00"
                  text_color: ${c_text_2}
                  text_font: font_caption
                  align: TOP_LEFT
                  x: ${40*px}
                  y: ${ (432 if screen_h > 480 else 260)*px }

              - label:
                  id: lbl_time_total
                  text: "0:00"
                  text_color: ${c_text_2}
                  text_font: font_caption
                  align: TOP_RIGHT
                  x: -${40*px}
                  y: ${ (432 if screen_h > 480 else 260)*px }

              # ── Transport: Prev | Play/Pause | Next ───
              # Beside the album art (180 px wide, centred): prev + shuffle on the
              # left, next + repeat on the right, centred in the side columns
              - button:
                  id: music_btn_prev
                  align: TOP_MID
                  x: -${ (96 if screen_h > 480 else 165*px//1)*(px if screen_h > 480 else 1) }
                  y: ${ (472 if screen_h > 480 else 60)*px }
                  width: ${64*px}
                  height: ${56*px}
                  styles: icon_btn
                  widgets:
                    - label:
                        text: "\U000F04AE" # mdi-skip-previous
                        text_font: icons_xl
                        align: CENTER
                  on_click:
                    - homeassistant.action:
                        action: media_player.media_previous_track
                        data:
                          entity_id: ${music_player}

              # Volume - / + either side of play/pause (step: music_volume_step;
              # portrait: either end of the volume slider)
              - button:
                  id: music_btn_vol_down
                  align: TOP_MID
                  x: -${ (200 if screen_h > 480 else 112)*px }
                  y: ${ (562 if screen_h > 480 else 284)*px }
                  width: ${ (44 if screen_h > 480 else 64)*px }
                  height: ${ (44 if screen_h > 480 else 56)*px }
                  styles: ${ 'round_btn' if screen_h > 480 else 'icon_btn' }
                  pressed:
                    bg_color: ${c_surface}
                    bg_opa: COVER
                  widgets:
                    - label:
                        text: "${ '\U000F0374' if screen_h > 480 else '\U000F075E' }" # portrait mdi-minus, else mdi-volume-minus
                        text_font: ${ 'icons_md' if screen_h > 480 else 'icons_xl' }
                        align: CENTER
                  on_click:
                    - script.execute:
                        id: music_volume_nudge
                        up: false
              - button:
                  id: music_btn_vol_up
                  align: TOP_MID
                  x: ${ (200 if screen_h > 480 else 112)*px }
                  y: ${ (562 if screen_h > 480 else 284)*px }
                  width: ${ (44 if screen_h > 480 else 64)*px }
                  height: ${ (44 if screen_h > 480 else 56)*px }
                  styles: ${ 'round_btn' if screen_h > 480 else 'icon_btn' }
                  pressed:
                    bg_color: ${c_surface}
                    bg_opa: COVER
                  widgets:
                    - label:
                        text: "${ '\U000F0415' if screen_h > 480 else '\U000F075D' }" # portrait mdi-plus, else mdi-volume-plus
                        text_font: ${ 'icons_md' if screen_h > 480 else 'icons_xl' }
                        align: CENTER
                  on_click:
                    - script.execute:
                        id: music_volume_nudge
                        up: true

              - button:
                  id: music_btn_playpause
                  align: TOP_MID
                  y: ${ (462 if screen_h > 480 else 280)*px }
                  width: ${ (76 if screen_h > 480 else 64)*px }
                  height: ${ (76 if screen_h > 480 else 64)*px }
                  styles: round_btn
                  bg_color: ${c_accent}
                  pressed:
                    bg_color: ${c_text_2}
                  widgets:
                    - label:
                        id: lbl_music_playpause
                        text: "\U000F040A" # mdi-play
                        text_font: icons_xl
                        text_color: ${c_on_accent}
                        align: CENTER
                  on_click:
                    - homeassistant.action:
                        action: media_player.media_play_pause
                        data:
                          entity_id: ${music_player}

              - button:
                  id: music_btn_next
                  align: TOP_MID
                  x: ${ (96 if screen_h > 480 else 165*px//1)*(px if screen_h > 480 else 1) }
                  y: ${ (472 if screen_h > 480 else 60)*px }
                  width: ${64*px}
                  height: ${56*px}
                  styles: icon_btn
                  widgets:
                    - label:
                        text: "\U000F04AD" # mdi-skip-next
                        text_font: icons_xl
                        align: CENTER
                  on_click:
                    - homeassistant.action:
                        action: media_player.media_next_track
                        data:
                          entity_id: ${music_player}

              # ── Shuffle and repeat flank the transport row; below them a
              #    full-width volume row (mute + slider) ───────────────────
              - button:
                  id: music_btn_shuffle
                  align: TOP_MID
                  x: -${ (188 if screen_h > 480 else 165*px//1)*(px if screen_h > 480 else 1) }
                  y: ${ (476 if screen_h > 480 else 132)*px }
                  width: ${48*px}
                  height: ${48*px}
                  styles: icon_btn
                  widgets:
                    - label:
                        id: lbl_music_shuffle
                        text: "\U000F049D" # mdi-shuffle
                        text_font: icons_md
                        text_color: ${c_text_2}
                        align: CENTER
                  on_click:
                    - homeassistant.action:
                        action: media_player.shuffle_set
                        data:
                          entity_id: ${music_player}
                          shuffle: !lambda 'return id(music_shuffle).state ? "false" : "true";'

              - button:
                  id: music_btn_mute
                  align: TOP_LEFT
                  x: ${ (78 if screen_h > 480 else 14)*px }
                  y: ${ (568 if screen_h > 480 else 350)*px }
                  width: ${44*px}
                  height: ${ (32 if screen_h > 480 else 38)*px }
                  styles: icon_btn
                  widgets:
                    - label:
                        id: lbl_music_mute
                        text: "\U000F057E" # mdi-volume-high
                        text_font: icons_md
                        text_color: ${c_text_2}
                        align: CENTER
                  on_click:
                    - homeassistant.action:
                        action: media_player.volume_mute
                        data:
                          entity_id: ${music_player}
                          is_volume_muted: !lambda 'return id(music_muted).state ? "false" : "true";'

              - slider:
                  id: music_volume
                  align: TOP_LEFT
                  x: ${ (76 if screen_h > 480 else 66)*px }
                  y: ${ (568 if screen_h > 480 else 355*px//1)*(px if screen_h > 480 else 1) }
                  width: ${ (328 if screen_h > 480 else 400)*px }
                  height: ${ (32 if screen_h > 480 else 28)*px }
                  min_value: 0
                  max_value: 100
                  value: 0
                  on_release:
                    - homeassistant.action:
                        action: media_player.volume_set
                        data:
                          entity_id: ${music_player}
                          volume_level: !lambda "return x / 100.0f;"

              - button:
                  id: music_btn_repeat
                  align: TOP_MID
                  x: ${ (188 if screen_h > 480 else 165*px//1)*(px if screen_h > 480 else 1) }
                  y: ${ (476 if screen_h > 480 else 132)*px }
                  width: ${48*px}
                  height: ${48*px}
                  styles: icon_btn
                  widgets:
                    - label:
                        id: lbl_music_repeat
                        text: "\U000F0457" # mdi-repeat-off
                        text_font: icons_md
                        text_color: ${c_text_2}
                        align: CENTER
                  on_click:
                    # off -> all -> one -> off
                    - homeassistant.action:
                        action: media_player.repeat_set
                        data:
                          entity_id: ${music_player}
                          repeat: !lambda |-
                            const std::string &r = id(music_repeat).state;
                            if (r == "off") return std::string("all");
                            if (r == "all") return std::string("one");
                            return std::string("off");

              # ── Lyrics (portrait): button right of the title, and the
              #    lyrics card that takes the artwork's place ─────────────
              - button:
                  id: music_btn_lyrics
                  align: TOP_RIGHT
                  x: -${18*px}
                  y: ${360*px}
                  width: ${44*px}
                  height: ${44*px}
                  styles: round_btn
                  bg_color: ${c_accent}
                  bg_opa: TRANSP
                  hidden: ${ 'false' if (screen_h > 480 and music_lyrics | string | lower == 'true') else 'true' }
                  widgets:
                    - label:
                        id: lbl_music_lyrics
                        text: "\U000F0CB8" # mdi-playlist-music
                        text_font: icons_md
                        text_color: ${c_text_2}
                        align: CENTER
                  on_click:
                    - lambda: |-
                        id(lyr_view) = !id(lyr_view);
                        id(lyr_cur) = -2;
                    - script.execute: lyrics_render
              - obj:
                  id: music_lyrics_card
                  align: TOP_MID
                  y: ${16*px}
                  width: ${440*px}
                  height: ${320*px}
                  styles: card
                  radius: ${16*px}
                  scrollbar_mode: "off"
                  scroll_dir: VER
                  hidden: true
                  on_click:
                    # Tap the lyrics to go back to the artwork
                    - lambda: "id(lyr_view) = false;"
                    - script.execute: lyrics_render
                  widgets:
                    # Synced: seven fixed lines, the current one in the middle
                    - label: { id: lyr_l0, text: "", width: "${400*px}", text_align: CENTER, long_mode: DOT, align: TOP_MID, y: "${14*px}" }
                    - label: { id: lyr_l1, text: "", width: "${400*px}", text_align: CENTER, long_mode: DOT, align: TOP_MID, y: "${58*px}" }
                    - label: { id: lyr_l2, text: "", width: "${400*px}", text_align: CENTER, long_mode: DOT, align: TOP_MID, y: "${102*px}" }
                    - label: { id: lyr_l3, text: "", width: "${400*px}", text_align: CENTER, long_mode: DOT, align: TOP_MID, y: "${146*px}" }
                    - label: { id: lyr_l4, text: "", width: "${400*px}", text_align: CENTER, long_mode: DOT, align: TOP_MID, y: "${194*px}" }
                    - label: { id: lyr_l5, text: "", width: "${400*px}", text_align: CENTER, long_mode: DOT, align: TOP_MID, y: "${238*px}" }
                    - label: { id: lyr_l6, text: "", width: "${400*px}", text_align: CENTER, long_mode: DOT, align: TOP_MID, y: "${282*px}" }
                    # Plain lyrics (no timestamps) or a note: scrolls
                    - label:
                        id: lyr_plain
                        text: ""
                        text_font: font_body
                        text_color: ${c_text}
                        text_align: CENTER
                        long_mode: WRAP
                        width: ${400*px}
                        align: TOP_MID
                        y: ${16*px}
                        pad_bottom: ${16*px}

    # Holding page (never shown): the "Play on" sheet is moved onto ui_root
    - id: holding_playon
      skip: true
      widgets:
        - obj:
            id: music_playon_panel
            width: 100%
            height: 100%
            align: TOP_LEFT
            styles: container
            scrollable: false
            scrollbar_mode: "off"
            hidden: true
            widgets:
              - label:
                  text: "Play on"
                  text_font: font_title
                  align: TOP_LEFT
                  x: ${20*px}
                  y: ${22*px}
              - button:
                  align: TOP_RIGHT
                  x: -${10*px}
                  y: ${12*px}
                  width: ${90*px}
                  height: ${44*px}
                  bg_opa: TRANSP
                  radius: ${22*px}
                  pad_all: 0
                  pressed:
                    bg_color: ${c_surface}
                    bg_opa: COVER
                  widgets:
                    - label:
                        text: "Done"
                        text_font: font_title
                        text_color: ${c_accent}
                        align: CENTER
                  on_click:
                    - lvgl.widget.hide: music_playon_panel
              - label:
                  text: "Tap a speaker to add it to this music or remove it."
                  text_font: font_caption
                  text_color: ${c_text_2}
                  long_mode: WRAP
                  width: ${440*px}
                  align: TOP_LEFT
                  x: ${20*px}
                  y: ${66*px}
              # Speaker rows (items/speaker.yaml)
              - obj:
                  id: speaker_list
                  align: TOP_MID
                  y: ${100*px}
                  width: ${448*px}
                  height: ${300*px}
                  styles: transparent
                  scrollbar_mode: "off"
              # Match volumes: every grouped speaker to this room's level
              - button:
                  id: music_btn_match
                  align: BOTTOM_MID
                  y: -${16*px}
                  width: ${240*px}
                  height: ${48*px}
                  radius: ${24*px}
                  bg_color: ${c_surface_2}
                  bg_opa: COVER
                  hidden: true
                  widgets:
                    - label:
                        text: "Match volumes"
                        text_font: font_title
                        align: CENTER
                  on_click:
                    - homeassistant.action:
                        action: media_player.volume_set
                        data:
                          # group_members "['media_player.a', 'media_player.b']" -> "media_player.a,media_player.b"
                          entity_id: !lambda |-
                            std::string out;
                            for (char c : id(music_group).state)
                              if (c != '[' && c != ']' && c != '\'' && c != '"' && c != ' ') out += c;
                            return out;
                          volume_level: !lambda |-
                            float v = id(music_volume_level).state;
                            return isnan(v) ? 0.5f : v;
