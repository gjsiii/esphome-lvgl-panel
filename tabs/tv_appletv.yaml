# Tab: TV remote for an Apple TV (iOS Remote style) with now-playing artwork.
#
#   tab_tv: !include
#     file: panel/tabs/tv_appletv.yaml
#     vars:
#       tab_position: 2                                   # 2-9, order in the tab bar
#       tv_remote: remote.family_room_apple_tv            # Apple TV remote entity
#       tv_player: media_player.family_room_apple_tv      # Apple TV media player
#       tv_volume_player: media_player.family_room        # speaker the volume keys control
#       tv_mute_player: media_player.family_room          # device the mute key controls (often the same)
#
# The tab selects itself when the Apple TV starts playing after a real stop
# (see media_autoswitch_gap_ms). Power sits in the top-right corner (tap:
# on, hold: off); the Apps button opens a sheet of round app-logo buttons
# (items/tv_app.yaml) and is hidden when there are none.
#
# Portrait screens (screen_h > 480, e.g. the handheld remote) get their own
# layout: power top-left, show / episode / app below it and large artwork on
# the right, a progress bar
# between skip back and forward, the d-pad centred with Apps, Home, Back and
# Play/Pause in the corners around it, and a wide volume pill below.

globals:
  - id: tab_index_tv
    type: int
    initial_value: "-1"
  - id: tv_playing
    type: bool
    initial_value: "false"
  - id: tv_stopped_ms
    type: uint32_t
    initial_value: "0"
  # Last Apple TV artwork URL fetched, so repeats are skipped
  - id: last_tv_art_url
    type: std::string
    initial_value: '""'
  # The artwork shown: a PSRAM copy of the shared art loader's picture
  - id: tv_art_dsc
    type: lv_image_dsc_t *
    initial_value: "nullptr"
  # Progress bar (portrait): last reported position and when it arrived
  - id: tv_pos_s
    type: float
    initial_value: "NAN"
  - id: tv_pos_ms
    type: uint32_t
    initial_value: "0"

esphome:
  on_boot:
    - priority: -10${tab_position}
      then:
        - lambda: |-
            lv_obj_t *tab = lv_tabview_add_tab(id(main_tabview), "TV");
            ::lv_image_set_src(id(img_tv_art), (const void *) nullptr);   // empty until the first art
            lv_obj_set_style_pad_all(tab, 0, 0);
            lv_obj_set_scrollbar_mode(tab, LV_SCROLLBAR_MODE_OFF);
            lv_obj_set_parent(id(content_tv), tab);
            id(tab_index_tv) = lv_obj_get_index(tab);
            // Apps sheet: onto the main screen; round logo buttons
            // (items/tv_app.yaml) four per row, 10px apart, 20px between rows
            lv_obj_set_parent(id(tv_apps_panel), id(ui_root));
            lv_obj_set_flex_flow(id(tv_apps), LV_FLEX_FLOW_ROW_WRAP);
            lv_obj_set_flex_align(id(tv_apps), LV_FLEX_ALIGN_START, LV_FLEX_ALIGN_START, LV_FLEX_ALIGN_START);
            lv_obj_set_style_pad_column(id(tv_apps), ${(10*px)|int}, 0);
            lv_obj_set_style_pad_row(id(tv_apps), ${(20*px)|int}, 0);
    # No app items: no Apps button
    - priority: -305
      then:
        - lambda: |-
            if (lv_obj_get_child_cnt(id(tv_apps)) == 0)
              lv_obj_add_flag(id(tv_btn_apps), LV_OBJ_FLAG_HIDDEN);

script:
  # Debounced Apple TV artwork fetch (downloads briefly block the UI)
  - id: load_tv_art
    mode: restart
    parameters:
      url: string
    then:
      - delay: 1500ms
      - if:
          condition:
            lambda: "return url != id(last_tv_art_url);"
          then:
            - lambda: "id(last_tv_art_url) = url;"
            - wait_until:
                condition:
                  lambda: "return !id(img_busy) || millis() - id(img_busy_ms) > 15000;"
                timeout: 15s
            - lambda: |-
                id(img_busy) = true;
                id(img_busy_ms) = millis();
                // Shared loader (core/images.yaml); keep a smaller copy
                id(art_cb) = [](bool ok) {
                  if (!ok) { ESP_LOGW("tv", "Apple TV art download failed"); return; }
                  id(img_show)(id(img_tv_art), &id(tv_art_dsc), id(art_loader)->get_lv_image_dsc(), ${((168 if screen_h > 480 else 104)*px)|int});
                };
                id(art_loader)->set_url(url);
                id(art_loader)->update();

  # Now-playing captions: show name (or title) + app name. Portrait also
  # shows the episode title under the show name.
  - id: update_tv_now_playing
    mode: restart
    then:
      - lvgl.label.update:
          id: lbl_tv_title
          text: !lambda |-
            std::string s = id(tv_artist_text).state;
            if (s.empty()) s = id(tv_title_text).state;
            return s;
      - lvgl.label.update:
          id: lbl_tv_subtitle
          text: !lambda |-
            if (id(tv_artist_text).state.empty()) return std::string("");
            return id(tv_title_text).state;
      - lvgl.label.update:
          id: lbl_tv_app
          text: !lambda "return id(tv_app_text).state;"

  # Progress bar (portrait): advance the last reported position while playing
  - id: update_tv_progress
    then:
      - lambda: |-
          float dur = id(tv_duration).state;
          float pos = id(tv_pos_s);
          bool known = !isnan(dur) && dur > 0 && !isnan(pos);
          if (!known) {
            lv_obj_add_flag(id(tv_progress), LV_OBJ_FLAG_HIDDEN);
            return;
          }
          lv_obj_clear_flag(id(tv_progress), LV_OBJ_FLAG_HIDDEN);
          if (id(tv_playing)) pos += (millis() - id(tv_pos_ms)) / 1000.0f;
          if (pos > dur) pos = dur;
          lv_bar_set_value(id(bar_tv_progress), (int32_t) (pos * 1000.0f / dur), LV_ANIM_OFF);
          auto fmt = [](int t, const char *sign) {
            char buf[16];
            if (t >= 3600) snprintf(buf, sizeof(buf), "%s%d:%02d:%02d", sign, t / 3600, (t / 60) % 60, t % 60);
            else snprintf(buf, sizeof(buf), "%s%d:%02d", sign, t / 60, t % 60);
            return std::string(buf);
          };
          lv_label_set_text(id(lbl_tv_elapsed), fmt((int) pos, "").c_str());
          lv_label_set_text(id(lbl_tv_remaining), fmt((int) (dur - pos), "-").c_str());

sensor:
  # Progress bar (portrait only; the square layout has no room for it)
  - platform: homeassistant
    id: tv_position
    entity_id: ${tv_player}
    attribute: media_position
    on_value:
      - lambda: |-
          id(tv_pos_s) = x;
          id(tv_pos_ms) = millis();
      - if:
          condition:
            lambda: "return ${ 'true' if screen_h > 480 else 'false' };"
          then:
            - script.execute: update_tv_progress
  - platform: homeassistant
    id: tv_duration
    entity_id: ${tv_player}
    attribute: media_duration

interval:
  - interval: 1s
    then:
      - if:
          condition:
            lambda: "return ${ 'true' if screen_h > 480 else 'false' } && id(tv_playing) && lv_tabview_get_tab_active(id(main_tabview)) == id(tab_index_tv);"
          then:
            - script.execute: update_tv_progress

text_sensor:
  # State: auto-select the TV tab when playback starts; show/hide now-playing art
  - platform: homeassistant
    id: tv_state_text
    entity_id: ${tv_player}
    on_value:
      - if:
          condition:
            lambda: |-
              bool playing = (x == "playing");
              bool start = playing && !id(tv_playing) &&
                (id(tv_stopped_ms) == 0 ||
                 millis() - id(tv_stopped_ms) >= ${media_autoswitch_gap_ms});
              if (!playing && id(tv_playing)) id(tv_stopped_ms) = millis();
              id(tv_playing) = playing;
              return start && id(tab_index_tv) >= 0 && id(sw_auto_media_tabs).state;
          then:
            - lambda: "lv_tabview_set_act(id(main_tabview), id(tab_index_tv), LV_ANIM_OFF);"
            - script.execute: refresh_tab_bar
      - if:
          condition:
            lambda: 'return x == "playing" || x == "paused";'
          then:
            - lvgl.widget.show: tv_now_playing
          else:
            - lvgl.widget.hide: tv_now_playing
            # HA stops sending attributes that disappear, so clear old captions
            - lambda: |-
                id(tv_title_text).publish_state("");
                id(tv_artist_text).publish_state("");
                id(tv_app_text).publish_state("");
                id(tv_pos_s) = NAN;

  - platform: homeassistant
    id: tv_entity_picture
    entity_id: ${tv_player}
    attribute: entity_picture
    on_value:
      - if:
          condition:
            lambda: "return !x.empty();"
          then:
            - script.execute:
                id: load_tv_art
                url: !lambda |-
                  if (x.rfind("http", 0) == 0) return x;
                  return std::string("${ha_url}") + x;

  - platform: homeassistant
    id: tv_title_text
    entity_id: ${tv_player}
    attribute: media_title
    on_value:
      - script.execute: update_tv_now_playing

  - platform: homeassistant
    id: tv_artist_text
    entity_id: ${tv_player}
    attribute: media_artist
    on_value:
      - script.execute: update_tv_now_playing

  - platform: homeassistant
    id: tv_app_text
    entity_id: ${tv_player}
    attribute: app_name
    on_value:
      - script.execute: update_tv_now_playing

lvgl:
  pages:
    # Holding page (never shown): content_tv is moved into the TV tab at boot
    - id: holding_tv
      skip: true
      widgets:
        - obj:
            id: content_tv
            width: 100%
            height: 100%
            styles: container
            scrollbar_mode: "off"
            widgets:
              # ── Now playing (left of the d-pad; portrait: across the top) ─
              # Shown only while the Apple TV is playing/paused.
              - obj:
                  id: tv_now_playing
                  align: TOP_LEFT
                  x: 0
                  y: 0
                  width: ${ (480 if screen_h > 480 else 128)*px }
                  height: ${ (250 if screen_h > 480 else 180)*px }
                  styles: transparent
                  clickable: false
                  scrollable: false
                  scrollbar_mode: "off"
                  hidden: true
                  widgets:
                    - obj:
                        align: TOP_LEFT
                        x: ${ (292 if screen_h > 480 else 12)*px }
                        y: ${12*px}
                        width: ${ (168 if screen_h > 480 else 104)*px }
                        height: ${ (168 if screen_h > 480 else 104)*px }
                        styles: art_frame
                        clickable: false
                        scrollable: false
                        widgets:
                          - image:
                              id: img_tv_art
                              src: art_loader   # replaced by a copy (load_tv_art)
                              align: CENTER
                    - label:
                        id: lbl_tv_title
                        text: ""
                        text_font: ${ 'font_title' if screen_h > 480 else 'font_caption' }
                        text_color: ${c_text}
                        long_mode: DOT
                        width: ${ (256 if screen_h > 480 else 108)*px }
                        align: TOP_LEFT
                        x: ${ (20 if screen_h > 480 else 12)*px }
                        y: ${ (80 if screen_h > 480 else 124)*px }
                    # Episode title (portrait only)
                    - label:
                        id: lbl_tv_subtitle
                        text: ""
                        text_font: font_body
                        text_color: ${c_text}
                        long_mode: DOT
                        width: ${256*px}
                        align: TOP_LEFT
                        x: ${20*px}
                        y: ${112*px}
                        hidden: ${ 'false' if screen_h > 480 else 'true' }
                    - label:
                        id: lbl_tv_app
                        text: ""
                        text_font: font_caption
                        text_color: ${c_text_2}
                        long_mode: DOT
                        width: ${ (256 if screen_h > 480 else 108)*px }
                        align: TOP_LEFT
                        x: ${ (20 if screen_h > 480 else 12)*px }
                        y: ${ (144 if screen_h > 480 else 146)*px }
                    # Progress bar + times (portrait only), between the skip
                    # buttons; hidden until the Apple TV reports a duration
                    - obj:
                        id: tv_progress
                        align: TOP_MID
                        y: ${206*px}
                        width: ${312*px}
                        height: ${40*px}
                        styles: transparent
                        clickable: false
                        scrollable: false
                        scrollbar_mode: "off"
                        hidden: true
                        widgets:
                          - bar:
                              id: bar_tv_progress
                              align: TOP_MID
                              y: ${4*px}
                              width: 100%
                              height: ${5*px//1}
                              min_value: 0
                              max_value: 1000
                              value: 0
                          - label:
                              id: lbl_tv_elapsed
                              text: ""
                              text_font: font_small
                              text_color: ${c_text_2}
                              align: TOP_LEFT
                              y: ${18*px}
                          - label:
                              id: lbl_tv_remaining
                              text: ""
                              text_font: font_small
                              text_color: ${c_text_2}
                              align: TOP_RIGHT
                              y: ${18*px}

              # ── D-pad ─────────────────────────────────
              - obj:
                  id: tv_dpad
                  align: TOP_MID
                  y: ${ (260 if screen_h > 480 else 4)*px }
                  width: ${ (256 if screen_h > 480 else 240)*px }
                  height: ${ (256 if screen_h > 480 else 240)*px }
                  bg_color: ${c_surface}
                  bg_opa: COVER
                  border_width: 0
                  radius: ${ (128 if screen_h > 480 else 120)*px }
                  pad_all: 0
                  clickable: false
                  scrollable: false
                  scrollbar_mode: "off"
                  widgets:
                    #### Up
                    - button:
                        id: tv_btn_up
                        align: TOP_MID
                        y: ${4*px}
                        width: ${ (88 if screen_h > 480 else 80)*px }
                        height: ${ (76 if screen_h > 480 else 68)*px }
                        styles: icon_btn
                        widgets:
                          - label:
                              text: "\U000F0143" # mdi-chevron-up
                              text_font: icons_xl
                              align: CENTER
                        on_press:
                          - homeassistant.action:
                              action: remote.send_command
                              data:
                                command: up
                                entity_id: ${tv_remote}
                                num_repeats: "1"
                                delay_secs: "0.4"
                                hold_secs: "0"

                    #### Down
                    - button:
                        id: tv_btn_down
                        align: BOTTOM_MID
                        y: -${4*px}
                        width: ${ (88 if screen_h > 480 else 80)*px }
                        height: ${ (76 if screen_h > 480 else 68)*px }
                        styles: icon_btn
                        widgets:
                          - label:
                              text: "\U000F0140" # mdi-chevron-down
                              text_font: icons_xl
                              align: CENTER
                        on_press:
                          - homeassistant.action:
                              action: remote.send_command
                              data:
                                command: down
                                entity_id: ${tv_remote}
                                num_repeats: "1"
                                delay_secs: "0.4"
                                hold_secs: "0"

                    #### Left
                    - button:
                        id: tv_btn_left
                        align: LEFT_MID
                        x: ${4*px}
                        width: ${ (76 if screen_h > 480 else 68)*px }
                        height: ${ (88 if screen_h > 480 else 80)*px }
                        styles: icon_btn
                        widgets:
                          - label:
                              text: "\U000F0141" # mdi-chevron-left
                              text_font: icons_xl
                              align: CENTER
                        on_press:
                          - homeassistant.action:
                              action: remote.send_command
                              data:
                                command: left
                                entity_id: ${tv_remote}
                                num_repeats: "1"
                                delay_secs: "0.4"
                                hold_secs: "0"

                    #### Right
                    - button:
                        id: tv_btn_right
                        align: RIGHT_MID
                        x: -${4*px}
                        width: ${ (76 if screen_h > 480 else 68)*px }
                        height: ${ (88 if screen_h > 480 else 80)*px }
                        styles: icon_btn
                        widgets:
                          - label:
                              text: "\U000F0142" # mdi-chevron-right
                              text_font: icons_xl
                              align: CENTER
                        on_press:
                          - homeassistant.action:
                              action: remote.send_command
                              data:
                                command: right
                                entity_id: ${tv_remote}
                                num_repeats: "1"
                                delay_secs: "0.4"
                                hold_secs: "0"

                    #### Select (center)
                    - button:
                        id: tv_btn_select
                        align: CENTER
                        width: ${ (100 if screen_h > 480 else 92)*px }
                        height: ${ (100 if screen_h > 480 else 92)*px }
                        styles: round_btn
                        bg_color: ${c_surface_2}
                        pressed:
                          bg_color: ${c_separator}
                        on_press:
                          - homeassistant.action:
                              action: remote.send_command
                              data:
                                command: select
                                entity_id: ${tv_remote}
                                num_repeats: "1"
                                delay_secs: "0.4"
                                hold_secs: "0"

              # ── Power | Back | Home | Play/Pause ──────
              # (portrait: Apps / Home above, Back / Play-Pause below, either
              # side of the d-pad)
              #### Power (tap: wake, hold: sleep): small, in the top-right
              # corner, away from the buttons used while watching
              # (portrait: a round button in the top-left corner, clear of the
              # status chips at the right end of the status bar)
              - button:
                  id: tv_btn_power
                  align: ${ 'TOP_LEFT' if screen_h > 480 else 'TOP_RIGHT' }
                  x: ${ (18 if screen_h > 480 else -8)*px }
                  y: ${ (12 if screen_h > 480 else 8)*px }
                  width: ${52*px}
                  height: ${52*px}
                  styles: ${ 'round_btn' if screen_h > 480 else 'icon_btn' }
                  pressed:
                    bg_color: ${c_surface}
                    bg_opa: COVER
                  widgets:
                    - label:
                        text: "\U000F0425" # mdi-power
                        text_font: icons_md
                        text_color: ${c_text_2}
                        align: CENTER
                  on_short_click:
                    - homeassistant.action:
                        action: homeassistant.reload_config_entry
                        data:
                          mode: single
                          entity_id: ${tv_remote}
                    - delay: 200ms
                    - homeassistant.action:
                        action: remote.turn_on
                        data:
                          entity_id: ${tv_remote}
                    - homeassistant.action:
                        action: media_player.turn_on
                        data:
                          entity_id: ${tv_player}
                  on_long_press:
                    - homeassistant.action:
                        action: remote.send_command
                        data:
                          command: suspend
                          entity_id: ${tv_remote}

              #### Back (menu)
              #### Apps: opens the Apps sheet (tiles from items/tv_app.yaml)
              - button:
                  id: tv_btn_apps
                  align: TOP_MID
                  x: -${ (182 if screen_h > 480 else 114)*px }
                  y: ${ (276 if screen_h > 480 else 256)*px }
                  width: ${ (64 if screen_h > 480 else 60)*px }
                  height: ${ (64 if screen_h > 480 else 60)*px }
                  styles: round_btn
                  widgets:
                    - label:
                        text: "\U000F003B" # mdi-apps
                        text_font: icons_md
                        align: CENTER
                  on_click:
                    - lambda: |-
                        lv_obj_clear_flag(id(tv_apps_panel), LV_OBJ_FLAG_HIDDEN);
                        lv_obj_move_foreground(id(tv_apps_panel));

              - button:
                  id: tv_btn_back
                  align: TOP_MID
                  x: -${ (182 if screen_h > 480 else 38)*px }
                  y: ${ (436 if screen_h > 480 else 256)*px }
                  width: ${ (64 if screen_h > 480 else 60)*px }
                  height: ${ (64 if screen_h > 480 else 60)*px }
                  styles: round_btn
                  widgets:
                    - label:
                        text: "\U000F0731" # mdi-arrow-left
                        text_font: icons_md
                        align: CENTER
                  on_press:
                    - homeassistant.action:
                        action: remote.send_command
                        data:
                          command: menu
                          entity_id: ${tv_remote}
                          num_repeats: "1"
                          delay_secs: "0.4"
                          hold_secs: "0"

              #### Home
              - button:
                  id: tv_btn_home
                  align: TOP_MID
                  x: ${ (182 if screen_h > 480 else 38)*px }
                  y: ${ (276 if screen_h > 480 else 256)*px }
                  width: ${ (64 if screen_h > 480 else 60)*px }
                  height: ${ (64 if screen_h > 480 else 60)*px }
                  styles: round_btn
                  widgets:
                    - label:
                        text: "\U000F02DC" # mdi-home
                        text_font: icons_md
                        align: CENTER
                  on_press:
                    - homeassistant.action:
                        action: remote.send_command
                        data:
                          command: home
                          num_repeats: "1"
                          delay_secs: "0.4"
                          hold_secs: "0"
                          entity_id: ${tv_remote}

              #### Play/Pause
              - button:
                  id: tv_btn_playpause
                  align: TOP_MID
                  x: ${ (182 if screen_h > 480 else 114)*px }
                  y: ${ (436 if screen_h > 480 else 256)*px }
                  width: ${ (64 if screen_h > 480 else 60)*px }
                  height: ${ (64 if screen_h > 480 else 60)*px }
                  styles: round_btn
                  widgets:
                    - label:
                        text: "\U000F040E" # mdi-play-pause
                        text_font: icons_md
                        align: CENTER
                  on_press:
                    - homeassistant.action:
                        action: media_player.media_play_pause
                        data:
                          entity_id: ${tv_player}

              # ── Volume pill: − | Mute | + ─────────────
              - obj:
                  align: TOP_MID
                  y: ${ (546 if screen_h > 480 else 328)*px }
                  width: ${ (320 if screen_h > 480 else 240)*px }
                  height: ${ (64 if screen_h > 480 else 56)*px }
                  bg_color: ${c_surface}
                  bg_opa: COVER
                  border_width: 0
                  radius: ${ (32 if screen_h > 480 else 28)*px }
                  pad_all: 0
                  clickable: false
                  scrollable: false
                  scrollbar_mode: "off"
                  widgets:
                    - button:
                        id: tv_btn_vol_down
                        align: LEFT_MID
                        width: ${ (106 if screen_h > 480 else 80)*px }
                        height: ${ (64 if screen_h > 480 else 56)*px }
                        styles: icon_btn
                        widgets:
                          - label:
                              text: "\U000F075E" # mdi-volume-minus
                              text_font: icons_md
                              align: CENTER
                        on_press:
                          - homeassistant.action:
                              action: media_player.volume_down
                              data:
                                entity_id: ${tv_volume_player}
                    - button:
                        id: tv_btn_mute
                        align: CENTER
                        width: ${ (106 if screen_h > 480 else 80)*px }
                        height: ${ (64 if screen_h > 480 else 56)*px }
                        styles: icon_btn
                        widgets:
                          - label:
                              text: "\U000F075F" # mdi-volume-mute
                              text_font: icons_md
                              align: CENTER
                        on_press:
                          - homeassistant.action:
                              action: media_player.volume_mute
                              data_template:
                                is_volume_muted: "{{ not state_attr('${tv_mute_player}', 'is_volume_muted') }}"
                                entity_id: ${tv_mute_player}
                    - button:
                        id: tv_btn_vol_up
                        align: RIGHT_MID
                        width: ${ (106 if screen_h > 480 else 80)*px }
                        height: ${ (64 if screen_h > 480 else 56)*px }
                        styles: icon_btn
                        widgets:
                          - label:
                              text: "\U000F075D" # mdi-volume-plus
                              text_font: icons_md
                              align: CENTER
                        on_press:
                          - homeassistant.action:
                              action: media_player.volume_up
                              data:
                                entity_id: ${tv_volume_player}


              # ── Skip back / forward (either side of the volume pill;
              # portrait: either side of the progress bar) ─
              - button:
                  id: tv_btn_skip_back
                  align: TOP_MID
                  x: -${ (196 if screen_h > 480 else 164)*px }
                  y: ${ (190 if screen_h > 480 else 328)*px }
                  width: ${ (52 if screen_h > 480 else 56)*px }
                  height: ${ (52 if screen_h > 480 else 56)*px }
                  styles: round_btn
                  widgets:
                    - label:
                        text: "\U000F045F" # mdi-rewind
                        text_font: icons_md
                        align: CENTER
                  on_press:
                    - homeassistant.action:
                        action: remote.send_command
                        data:
                          command: skip_backward
                          entity_id: ${tv_remote}

              - button:
                  id: tv_btn_skip_fwd
                  align: TOP_MID
                  x: ${ (196 if screen_h > 480 else 164)*px }
                  y: ${ (190 if screen_h > 480 else 328)*px }
                  width: ${ (52 if screen_h > 480 else 56)*px }
                  height: ${ (52 if screen_h > 480 else 56)*px }
                  styles: round_btn
                  widgets:
                    - label:
                        text: "\U000F0211" # mdi-fast-forward
                        text_font: icons_md
                        align: CENTER
                  on_press:
                    - homeassistant.action:
                        action: remote.send_command
                        data:
                          command: skip_forward
                          entity_id: ${tv_remote}

    # Holding page (never shown): the Apps sheet is moved onto ui_root at boot
    # (so it closes with the other sheets when the screen dims)
    - id: holding_tv_apps
      skip: true
      widgets:
        - obj:
            id: tv_apps_panel
            width: 100%
            height: 100%
            align: TOP_LEFT
            styles: container
            scrollbar_mode: "off"
            hidden: true
            widgets:
              - label:
                  text: "Apps"
                  text_font: font_title
                  align: TOP_LEFT
                  x: ${20*px}
                  y: ${22*px}
              - button:
                  align: TOP_RIGHT
                  x: -${10*px}
                  y: ${12*px}
                  width: ${90*px}
                  height: ${44*px}
                  bg_opa: TRANSP
                  radius: ${22*px}
                  pad_all: 0
                  pressed:
                    bg_color: ${c_surface}
                    bg_opa: COVER
                  widgets:
                    - label:
                        text: "Done"
                        text_font: font_title
                        text_color: ${c_accent}
                        align: CENTER
                  on_click:
                    - lvgl.widget.hide: tv_apps_panel
              # App buttons (items/tv_app.yaml), four per row; more scroll.
              # Flex layout is set at boot (an empty container can't take it).
              - obj:
                  id: tv_apps
                  align: TOP_MID
                  y: ${72*px}
                  width: ${446*px}   # exactly 4 buttons: 4 x 104 + 3 x 10
                  height: ${400*px}
                  styles: transparent
                  scrollbar_mode: "off"
