# Feature: weather in the status bar + a weather sheet opened by tapping it.
# Condition icons (status bar and sheet) are tinted by condition (wx_color)
# and switch to moon icons after sunset; the 5-day rows show each day's
# range on a bar scaled to the week (Apple Weather style).
#
#   weather: !include
#     file: panel/features/weather.yaml
#     vars:
#       weather_entity: weather.home                     # current conditions
#       forecast_entity: sensor.panel_weather_forecast   # from HA packages/panel_weather.yaml
#       outdoor_temp_entity: sensor.rooftop_temperature  # optional local thermometer
#       feels_like_entity: sensor.rooftop_feels_like     # optional "Feels like"
#
# The forecast sensor must exist in HA (copy packages/panel_weather.yaml);
# without it the sheet shows current conditions and dashes for the forecast.
# Omit this package and the status bar shows no weather.

substitutions:
  wind_unit: mph   # unit of the weather entity's wind_speed
  rain_unit: in    # unit of the forecast precipitation
  temp_unit: F     # F or C: picks the colours of the range bars
  # Optional local thermometer for the current temperature (e.g. a rooftop
  # weather station); when it reports, it replaces the forecast temperature.
  outdoor_temp_entity: "sensor.none"
  # Optional apparent temperature, shown as "Feels like" under the high/low
  feels_like_entity: "sensor.none"
  # Sun above/below the horizon: night icons for the current conditions
  sun_entity: sun.sun

globals:
  # True once the local outdoor thermometer has reported
  - id: wx_have_outdoor
    type: bool
    initial_value: "false"
  # Current HA condition, current temperature, and the 5-day lows/highs
  # (NAN = no value) for the range bars
  - id: wx_cond
    type: std::string
    initial_value: "std::string()"
  - id: wx_now_temp
    type: float
    initial_value: "NAN"
  - id: wx_lo
    type: std::array<float, 5>
    initial_value: "std::array<float, 5>{NAN, NAN, NAN, NAN, NAN}"
  - id: wx_hi
    type: std::array<float, 5>
    initial_value: "std::array<float, 5>{NAN, NAN, NAN, NAN, NAN}"
  # Night version of a condition (HA's sources often say sunny or
  # partlycloudy after dark); partlycloudy-night is this file's own key
  - id: wx_at_night
    type: std::function<std::string(const std::string &)>
    initial_value: |-
      [](const std::string &c) -> std::string {
        if (c == "sunny")        return "clear-night";
        if (c == "partlycloudy") return "partlycloudy-night";
        return c;
      }
  # Temperature -> range bar colour: violet (cold) to red (hot)
  - id: wx_temp_color
    type: std::function<uint32_t(float)>
    initial_value: |-
      [](float t) -> uint32_t {
        if (strcmp("${temp_unit}", "C") == 0) t = t * 9.0f / 5.0f + 32.0f;
        static const float T[7] = {10, 32, 50, 60, 70, 80, 95};   // °F
        static const uint32_t C[7] = {0x5E5CE6, 0x64D2FF, 0x63E6E2, 0x30D158, 0xFFD60A, 0xFF9F0A, 0xFF453A};
        if (t <= T[0]) return C[0];
        if (t >= T[6]) return C[6];
        int i = 0;
        while (t > T[i + 1]) i++;
        float f = (t - T[i]) / (T[i + 1] - T[i]);
        auto ch = [&](int s) -> uint32_t {
          int a = (C[i] >> s) & 0xFF, b = (C[i + 1] >> s) & 0xFF;
          return ((uint32_t) lroundf(a + (b - a) * f)) << s;
        };
        return ch(16) | ch(8) | ch(0);
      }
  # HA condition -> MDI weather glyph
  - id: wx_icon
    type: std::function<std::string(const std::string &)>
    initial_value: |-
      [](const std::string &c) -> std::string {
        if (c == "sunny")           return "\U000F0599";
        if (c == "clear-night")     return "\U000F0594";
        if (c == "partlycloudy")    return "\U000F0595";
        if (c == "partlycloudy-night") return "\U000F0F31";
        if (c == "cloudy")          return "\U000F0590";
        if (c == "fog")             return "\U000F0591";
        if (c == "hail")            return "\U000F0592";
        if (c == "lightning")       return "\U000F0593";
        if (c == "lightning-rainy") return "\U000F067E";
        if (c == "pouring")         return "\U000F0596";
        if (c == "rainy")           return "\U000F0597";
        if (c == "snowy")           return "\U000F0598";
        if (c == "snowy-rainy")     return "\U000F067F";
        if (c == "windy")           return "\U000F059D";
        if (c == "windy-variant")   return "\U000F059E";
        return "\U000F05D6";  // exceptional / unknown
      }
  # HA condition -> icon colour (iOS system colours)
  - id: wx_color
    type: std::function<uint32_t(const std::string &)>
    initial_value: |-
      [](const std::string &c) -> uint32_t {
        if (c == "sunny")           return 0xFFD60A;  // yellow
        if (c == "clear-night")     return 0xC9C3FF;  // pale moon
        if (c == "partlycloudy")    return 0xFFE066;  // soft yellow
        if (c == "partlycloudy-night") return 0xC9C3FF;
        if (c == "cloudy")          return 0xAEAEB2;  // grey
        if (c == "fog")             return 0x8E8E93;  // dark grey
        if (c == "hail")            return 0x99E6FF;  // icy
        if (c == "lightning")       return 0xFF9F0A;  // orange
        if (c == "lightning-rainy") return 0xFF9F0A;
        if (c == "pouring")         return 0x0A84FF;  // deep blue
        if (c == "rainy")           return 0x64D2FF;  // light blue
        if (c == "snowy")           return 0xD6F1FF;  // icy white
        if (c == "snowy-rainy")     return 0x8FD3FF;
        if (c == "windy")           return 0x63E6E2;  // teal
        if (c == "windy-variant")   return 0x63E6E2;
        return 0xFF453A;  // exceptional / unknown: red
      }
  # HA condition -> display name
  - id: wx_name
    type: std::function<std::string(const std::string &)>
    initial_value: |-
      [](const std::string &c) -> std::string {
        if (c == "sunny")           return "Sunny";
        if (c == "clear-night")     return "Clear";
        if (c == "partlycloudy")    return "Partly Cloudy";
        if (c == "partlycloudy-night") return "Partly Cloudy";
        if (c == "cloudy")          return "Cloudy";
        if (c == "fog")             return "Fog";
        if (c == "hail")            return "Hail";
        if (c == "lightning")       return "Thunderstorms";
        if (c == "lightning-rainy") return "Thunderstorms";
        if (c == "pouring")         return "Heavy Rain";
        if (c == "rainy")           return "Rain";
        if (c == "snowy")           return "Snow";
        if (c == "snowy-rainy")     return "Sleet";
        if (c == "windy")           return "Windy";
        if (c == "windy-variant")   return "Windy";
        return "Unusual Weather";
      }

esphome:
  on_boot:
    - priority: -150
      then:
        - lambda: |-
            // Move the sheet onto the main screen (built on a holding page)
            lv_obj_set_parent(id(weather_panel), id(ui_root));
            // Tapping the status-bar weather opens the sheet
            lv_obj_add_event_cb(id(btn_weather_open), [](lv_event_t *e) {
              lv_obj_clear_flag(id(weather_panel), LV_OBJ_FLAG_HIDDEN);
              lv_obj_move_foreground(id(weather_panel));
            }, LV_EVENT_CLICKED, nullptr);

script:
  # Details line: humidity · wind · UV
  - id: update_wx_details
    mode: restart
    then:
      - lambda: |-
          static const char *dirs[8] = {"N", "NE", "E", "SE", "S", "SW", "W", "NW"};
          std::string s;
          char buf[48];
          float h = id(wx_humidity).state;
          if (!isnan(h)) { snprintf(buf, sizeof(buf), "Humidity %.0f%%", h); s += buf; }
          float w = id(wx_wind_speed).state, b = id(wx_wind_bearing).state;
          if (!isnan(w)) {
            if (!s.empty()) s += "  ·  ";
            snprintf(buf, sizeof(buf), "Wind %.0f ${wind_unit}", w); s += buf;
            if (!isnan(b) && w >= 1) { s += " "; s += dirs[((int) ((b + 22.5f) / 45.0f)) % 8]; }
          }
          float u = id(wx_uv).state;
          if (!isnan(u)) { if (!s.empty()) s += "  ·  "; snprintf(buf, sizeof(buf), "UV %.0f", u); s += buf; }
          lv_label_set_text(id(lbl_wx_details), s.c_str());

  # Current condition: status-bar icon, big icon and name (night version
  # while the sun is down)
  - id: update_wx_now
    mode: restart
    then:
      - lambda: |-
          std::string c = id(wx_cond);
          if (c.empty()) return;
          if (id(wx_sun).state == "below_horizon") c = id(wx_at_night)(c);
          lv_color_t col = lv_color_hex(id(wx_color)(c));
          lv_label_set_text(id(lbl_weather_icon), id(wx_icon)(c).c_str());
          lv_obj_set_style_text_color(id(lbl_weather_icon), col, LV_PART_MAIN);
          lv_label_set_text(id(lbl_wx_now_icon), id(wx_icon)(c).c_str());
          lv_obj_set_style_text_color(id(lbl_wx_now_icon), col, LV_PART_MAIN);
          lv_label_set_text(id(lbl_wx_now_cond), id(wx_name)(c).c_str());

  # 5-day range bars: each day's low..high on a scale running from the
  # week's lowest to highest; a dot marks the current temperature on Today
  - id: update_wx_bars
    mode: restart
    then:
      - lambda: |-
          lv_obj_t *tr[5] = {id(wx_d0_track), id(wx_d1_track), id(wx_d2_track), id(wx_d3_track), id(wx_d4_track)};
          lv_obj_t *fl[5] = {id(wx_d0_fill), id(wx_d1_fill), id(wx_d2_fill), id(wx_d3_fill), id(wx_d4_fill)};
          const auto &lo = id(wx_lo);
          const auto &hi = id(wx_hi);
          const float now = id(wx_now_temp);
          float mn = INFINITY, mx = -INFINITY;
          for (int i = 0; i < 5; i++) {
            if (isnan(hi[i])) continue;
            mn = std::min(mn, isnan(lo[i]) ? hi[i] : lo[i]);
            mx = std::max(mx, hi[i]);
          }
          const bool dot = !isnan(now) && !isnan(hi[0]);
          if (dot) { mn = std::min(mn, now); mx = std::max(mx, now); }
          const int W = ${(100*px)|int}, MIN_W = ${(6*px)|int}, DOT = ${(10*px)|int};
          const float span = std::max(1.0f, mx - mn);
          auto pos = [&](float t) { return (int) lroundf((t - mn) / span * W); };
          for (int i = 0; i < 5; i++) {
            if (isnan(hi[i])) { lv_obj_add_flag(tr[i], LV_OBJ_FLAG_HIDDEN); continue; }
            lv_obj_clear_flag(tr[i], LV_OBJ_FLAG_HIDDEN);
            const float l = isnan(lo[i]) ? hi[i] : lo[i];
            int x0 = pos(l), x1 = pos(hi[i]);
            if (x1 - x0 < MIN_W) {
              x0 = std::max(0, std::min((x0 + x1 - MIN_W) / 2, W - MIN_W));
              x1 = x0 + MIN_W;
            }
            lv_obj_set_x(fl[i], x0);
            lv_obj_set_width(fl[i], x1 - x0);
            lv_obj_set_style_bg_color(fl[i], lv_color_hex(id(wx_temp_color)(l)), LV_PART_MAIN);
            lv_obj_set_style_bg_grad_color(fl[i], lv_color_hex(id(wx_temp_color)(hi[i])), LV_PART_MAIN);
          }
          if (dot) {
            // The dot sits on the card (a child of the thin track would be clipped)
            int dx = std::max(0, std::min(pos(now) - DOT / 2, W - DOT));
            lv_obj_set_x(id(wx_now_dot), ${(276*px)|int} + dx);
            lv_obj_clear_flag(id(wx_now_dot), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(wx_now_dot), LV_OBJ_FLAG_HIDDEN);
          }

sensor:
  - platform: homeassistant
    id: weather_temperature
    entity_id: ${weather_entity}
    attribute: temperature
    on_value:
      - lambda: |-
          // A local outdoor thermometer, once it reports, takes precedence
          if (id(wx_have_outdoor)) return;
          char buf[8];
          if (isnan(x)) snprintf(buf, sizeof(buf), "--°");
          else snprintf(buf, sizeof(buf), "%.0f°", x);
          lv_label_set_text(id(lbl_weather_temp), buf);
          lv_label_set_text(id(lbl_wx_now_temp), buf);
          id(wx_now_temp) = x;
          id(update_wx_bars).execute();
      - lvgl.widget.show: btn_weather_open

  # Local outdoor thermometer (outdoor_temp_entity, optional)
  - platform: homeassistant
    id: wx_outdoor_temp
    entity_id: ${outdoor_temp_entity}
    on_value:
      - lambda: |-
          if (isnan(x)) return;
          id(wx_have_outdoor) = true;
          char buf[8];
          snprintf(buf, sizeof(buf), "%.0f°", x);
          lv_label_set_text(id(lbl_weather_temp), buf);
          lv_label_set_text(id(lbl_wx_now_temp), buf);
          id(wx_now_temp) = x;
          id(update_wx_bars).execute();
      - lvgl.widget.show: btn_weather_open

  # Apparent temperature (feels_like_entity, optional)
  - platform: homeassistant
    id: wx_feels_like
    entity_id: ${feels_like_entity}
    on_value:
      - lambda: |-
          if (isnan(x)) { lv_obj_add_flag(id(lbl_wx_feels), LV_OBJ_FLAG_HIDDEN); return; }
          char buf[24];
          snprintf(buf, sizeof(buf), "Feels like %.0f°", x);
          lv_label_set_text(id(lbl_wx_feels), buf);
          lv_obj_clear_flag(id(lbl_wx_feels), LV_OBJ_FLAG_HIDDEN);

  - platform: homeassistant
    id: wx_humidity
    entity_id: ${weather_entity}
    attribute: humidity
    on_value:
      - script.execute: update_wx_details

  - platform: homeassistant
    id: wx_wind_speed
    entity_id: ${weather_entity}
    attribute: wind_speed
    on_value:
      - script.execute: update_wx_details

  - platform: homeassistant
    id: wx_wind_bearing
    entity_id: ${weather_entity}
    attribute: wind_bearing
    on_value:
      - script.execute: update_wx_details

  - platform: homeassistant
    id: wx_uv
    entity_id: ${weather_entity}
    attribute: uv_index
    on_value:
      - script.execute: update_wx_details

text_sensor:
  - platform: homeassistant
    id: weather_condition
    entity_id: ${weather_entity}
    on_value:
      - lambda: "id(wx_cond) = x;"
      - script.execute: update_wx_now
      - lvgl.widget.show: btn_weather_open

  # Sun above/below the horizon (night icons for the current condition)
  - platform: homeassistant
    id: wx_sun
    entity_id: ${sun_entity}
    on_value:
      - script.execute: update_wx_now

  # Next sunrise and sunset (packed by HA): "7:02am,6:11pm"
  - platform: homeassistant
    id: wx_sun_times
    entity_id: ${forecast_entity}
    attribute: sun
    on_value:
      - lambda: |-
          size_t k = x.find(',');
          if (x.empty() || k == std::string::npos) {
            lv_obj_add_flag(id(wx_sun_row), LV_OBJ_FLAG_HIDDEN);
            return;
          }
          lv_label_set_text(id(lbl_wx_sunrise), x.substr(0, k).c_str());
          lv_label_set_text(id(lbl_wx_sunset), x.substr(k + 1).c_str());
          lv_obj_clear_flag(id(wx_sun_row), LV_OBJ_FLAG_HIDDEN);

  # Forecast (packed by HA): "Now,58,partlycloudy;10am,62,sunny,n;..."
  # (a 4th field "n" marks hours after dark)
  - platform: homeassistant
    id: wx_forecast_hourly
    entity_id: ${forecast_entity}
    attribute: hourly
    on_value:
      - lambda: |-
          auto split = [](const std::string &s, char d) {
            std::vector<std::string> v;
            size_t a = 0, b;
            while ((b = s.find(d, a)) != std::string::npos) { v.push_back(s.substr(a, b - a)); a = b + 1; }
            v.push_back(s.substr(a));
            return v;
          };
          lv_obj_t *t[6]  = {id(wx_h0_time), id(wx_h1_time), id(wx_h2_time), id(wx_h3_time), id(wx_h4_time), id(wx_h5_time)};
          lv_obj_t *ic[6] = {id(wx_h0_icon), id(wx_h1_icon), id(wx_h2_icon), id(wx_h3_icon), id(wx_h4_icon), id(wx_h5_icon)};
          lv_obj_t *tp[6] = {id(wx_h0_temp), id(wx_h1_temp), id(wx_h2_temp), id(wx_h3_temp), id(wx_h4_temp), id(wx_h5_temp)};
          auto rows = split(x, ';');
          for (int i = 0; i < 6; i++) {
            std::vector<std::string> f;
            if (!x.empty() && i < (int) rows.size()) f = split(rows[i], ',');
            if (f.size() >= 3) {
              std::string c = (f.size() >= 4 && f[3] == "n") ? id(wx_at_night)(f[2]) : f[2];
              lv_label_set_text(t[i], f[0].c_str());
              lv_label_set_text(ic[i], id(wx_icon)(c).c_str());
              lv_obj_set_style_text_color(ic[i], lv_color_hex(id(wx_color)(c)), LV_PART_MAIN);
              lv_label_set_text(tp[i], (f[1] + "°").c_str());
            } else {
              lv_label_set_text(t[i], "--");
              lv_label_set_text(ic[i], "");
              lv_label_set_text(tp[i], "--");
            }
          }

  # Forecast (packed by HA): "Today,48,65,partlycloudy,0.00;Thu,..."
  - platform: homeassistant
    id: wx_forecast_daily
    entity_id: ${forecast_entity}
    attribute: daily
    on_value:
      - lambda: |-
          auto split = [](const std::string &s, char d) {
            std::vector<std::string> v;
            size_t a = 0, b;
            while ((b = s.find(d, a)) != std::string::npos) { v.push_back(s.substr(a, b - a)); a = b + 1; }
            v.push_back(s.substr(a));
            return v;
          };
          lv_obj_t *dy[5] = {id(wx_d0_day), id(wx_d1_day), id(wx_d2_day), id(wx_d3_day), id(wx_d4_day)};
          lv_obj_t *ic[5] = {id(wx_d0_icon), id(wx_d1_icon), id(wx_d2_icon), id(wx_d3_icon), id(wx_d4_icon)};
          lv_obj_t *rn[5] = {id(wx_d0_rain), id(wx_d1_rain), id(wx_d2_rain), id(wx_d3_rain), id(wx_d4_rain)};
          lv_obj_t *lo[5] = {id(wx_d0_lo), id(wx_d1_lo), id(wx_d2_lo), id(wx_d3_lo), id(wx_d4_lo)};
          lv_obj_t *hi[5] = {id(wx_d0_hi), id(wx_d1_hi), id(wx_d2_hi), id(wx_d3_hi), id(wx_d4_hi)};
          auto rows = split(x, ';');
          for (int i = 0; i < 5; i++) {
            std::vector<std::string> f;
            if (!x.empty() && i < (int) rows.size()) f = split(rows[i], ',');
            id(wx_lo)[i] = (f.size() >= 5 && !f[1].empty()) ? atof(f[1].c_str()) : NAN;
            id(wx_hi)[i] = (f.size() >= 5 && !f[2].empty()) ? atof(f[2].c_str()) : NAN;
            if (f.size() >= 5) {
              lv_label_set_text(dy[i], f[0].c_str());
              lv_label_set_text(ic[i], id(wx_icon)(f[3]).c_str());
              lv_obj_set_style_text_color(ic[i], lv_color_hex(id(wx_color)(f[3])), LV_PART_MAIN);
              float r = atof(f[4].c_str());
              char buf[16] = "";
              if (r >= 0.01f) snprintf(buf, sizeof(buf), "%.2f ${rain_unit}", r);
              lv_label_set_text(rn[i], buf);
              lv_label_set_text(lo[i], f[1].empty() ? "" : (f[1] + "°").c_str());
              lv_label_set_text(hi[i], (f[2] + "°").c_str());
              if (i == 0) {
                std::string hl = "H " + f[2] + "°";
                if (!f[1].empty()) hl += "  ·  L " + f[1] + "°";
                lv_label_set_text(id(lbl_wx_hilo), hl.c_str());
              }
            } else {
              lv_label_set_text(dy[i], "--");
              lv_label_set_text(ic[i], "");
              lv_label_set_text(rn[i], "");
              lv_label_set_text(lo[i], "");
              lv_label_set_text(hi[i], "");
            }
          }
      - script.execute: update_wx_bars

  # Forecast sensor state = time HA last fetched it
  - platform: homeassistant
    id: wx_forecast_updated
    entity_id: ${forecast_entity}
    on_value:
      - lambda: |-
          std::string s = (x.empty() || x == "unknown" || x == "unavailable")
              ? std::string("Forecast unavailable") : "Updated " + x;
          lv_label_set_text(id(lbl_wx_updated), s.c_str());

lvgl:
  style_definitions:
    # 5-day range bar: grey track; the fill's x, width and colours are set
    # by update_wx_bars
    - id: wx_track
      align: TOP_LEFT
      x: ${276*px}
      width: ${100*px}
      height: ${6*px}
      bg_color: ${c_separator}
      bg_opa: COVER
      border_width: 0
      radius: 999
      pad_all: 0
    - id: wx_fill
      align: LEFT_MID
      width: ${6*px}
      height: 100%
      bg_opa: COVER
      bg_grad_dir: HOR
      border_width: 0
      radius: 999
      pad_all: 0
  pages:
    # Holding page (never shown): weather_panel is moved onto ui_root at boot
    - id: holding_weather
      skip: true
      widgets:
        - obj:
            id: weather_panel
            width: 100%
            height: 100%
            align: TOP_LEFT
            styles: container
            scrollbar_mode: "off"
            hidden: true
            widgets:
              # ── Header ────────────────────────────────────────────
              - label:
                  text: "Weather"
                  text_font: font_title
                  align: TOP_LEFT
                  x: ${20*px}
                  y: ${22*px}
              - button:
                  align: TOP_RIGHT
                  x: -${10*px}
                  y: ${12*px}
                  width: ${90*px}
                  height: ${44*px}
                  bg_opa: TRANSP
                  radius: ${22*px}
                  pad_all: 0
                  pressed:
                    bg_color: ${c_surface}
                    bg_opa: COVER
                  widgets:
                    - label:
                        text: "Done"
                        text_font: font_title
                        text_color: ${c_accent}
                        align: CENTER
                  on_click:
                    - lvgl.widget.hide: weather_panel
              # Next sunrise / sunset, between the title and Done
              - obj:
                  id: wx_sun_row
                  align: TOP_MID
                  y: ${22*px}
                  width: SIZE_CONTENT
                  height: ${24*px}
                  styles: transparent
                  clickable: false
                  scrollable: false
                  hidden: true
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_main: CENTER
                    flex_align_cross: CENTER
