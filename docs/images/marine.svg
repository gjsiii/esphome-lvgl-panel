<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480" font-family="Inter, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect width="480" height="480" rx="18" fill="#000"/>
<text x="20" y="42" fill="#FFF" font-size="20" font-weight="600">Marine Forecast</text><text x="415" y="42" fill="#F2F2F7" font-size="20" font-weight="600" text-anchor="middle">Done</text>
<rect x="20" y="70" width="440" height="46" rx="12" fill="#3A1513" stroke="#FF453A"/><text x="34" y="99" fill="#FF6961" font-size="16">Small Craft Advisory in effect until 1 PM Friday</text>
<rect x="20" y="122" width="440" height="68" rx="12" fill="#3A2F0A" stroke="#FFD60A"/><text x="34" y="150" fill="#FFE066" font-size="16">Gale Warning in effect from 1 PM Friday</text><text x="34" y="172" fill="#FFE066" font-size="16">to 1 AM Saturday</text>
<text x="20" y="222" fill="#FFF" font-size="20" font-weight="600">Tonight</text><text x="20" y="248" fill="#8E8E93" font-size="16">South winds 15 to 25 kt becoming west to</text><text x="20" y="270" fill="#8E8E93" font-size="16">30 kt. Showers in the evening. Waves 3 to 5 ft.</text>
<text x="20" y="318" fill="#FFF" font-size="20" font-weight="600">Friday</text><text x="20" y="344" fill="#8E8E93" font-size="16">Northwest winds to 30 kt becoming northerly</text><text x="20" y="366" fill="#8E8E93" font-size="16">gales to 40 kt. Waves 6 to 10 ft.</text>
<text x="20" y="414" fill="#FFF" font-size="20" font-weight="600">Friday Night</text><text x="20" y="440" fill="#8E8E93" font-size="16">North gales to 40 kt easing to 25 kt.</text><text x="20" y="462" fill="#8E8E93" font-size="16">Waves 8 to 12 ft subsiding.</text>
</svg>
