<text x="240" y="128" fill="#48484A" font-size="16" font-weight="500" text-anchor="middle">Down by the salley gardens</text>
<text x="240" y="172" fill="#636366" font-size="16" font-weight="500" text-anchor="middle">my love and I did meet;</text>
<text x="240" y="216" fill="#8E8E93" font-size="16" font-weight="500" text-anchor="middle">She passed the salley gardens</text>
<text x="240" y="260" fill="#FFF" font-size="20" font-weight="600" text-anchor="middle">with little snow-white feet.</text>
<text x="240" y="304" fill="#8E8E93" font-size="16" font-weight="500" text-anchor="middle">She bid me take love easy,</text>
<text x="240" y="348" fill="#636366" font-size="16" font-weight="500" text-anchor="middle">as the leaves grow on the tree;</text>
<text x="240" y="392" fill="#48484A" font-size="16" font-weight="500" text-anchor="middle">But I, being young and foolish,</text>
